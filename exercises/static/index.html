  const top = (b) => {  // a bar's system's top in the scroller's content (px), and its height
    const p = box.querySelector(`.pg[data-pg="${b.page}"]`);
    if (!p) return null;
    const r = p.getBoundingClientRect(), s = P.pages[b.page], k = r.height / s.h;
    return { y: r.top - sc.getBoundingClientRect().top + sc.scrollTop + b.y * k, h: b.h * k };
  };
  const here = top(br), nxt = P.bars.find((b, i) => i > bi && (b.page !== br.page || b.y !== br.y));
  const after = nxt ? top(nxt) : null;
  if (!here) return;
  const above = here.h * 0.35, below = here.h * 0.3, view = [sc.scrollTop, sc.scrollTop + sc.clientHeight];
  const out = here.y - above < view[0] || here.y + here.h + below > view[1] || (after && after.y + after.h + below > view[1]);
  if (!out) return;
  const first = bi === 0 || P.bars.findIndex((b) => b.page === br.page && b.y === br.y) === 0;
  sc.scrollTo({ top: first ? 0 : Math.max(0, here.y - above), behavior: "smooth" });
}

// --- the waveform and the instructions, fetched when shown
async function loadPeaks(id) {
  if (!S.peaks[id]) {
    try { S.peaks[id] = (await api("GET", `/api/takes/${id}/peaks?n=400`)).peaks; } catch (e) { return; }
  }
  const svg = $(`[data-wave="${id}"] svg`);
  if (!svg) return;
  const p = S.peaks[id], beat0 = (S.takes.find((t) => t.id === id) || {}).beat0_s, secs = (S.takes.find((t) => t.id === id) || {}).seconds || 1;
  const b0 = beat0 != null ? beat0 / secs * p.length : -1;
  svg.innerHTML = p.map((v, i) => { const h = Math.max(1, Math.sqrt(v) * 96); return `<rect x="${i}" y="${50 - h / 2}" width="0.6" height="${h}" fill="${i < b0 ? "#7E768B" : "#F2EEF8"}"></rect>`; }).join("");
}
async function loadReadme() {
  const e = exById(C().exercise), el = $("#readme");
  if (!e || !el || el.dataset.for === e.id) return;
  try {
    const r = await fetch(`/api/exercises/${encodeURIComponent(e.id)}/readme`);
    if (!r.ok) return;
    el.innerHTML = markdown(await r.text()); el.dataset.for = e.id;
  } catch (err) {}
}
// the exercise's README as HTML: headings, paragraphs, lists, tables, code; every bit of text escaped
function inline(s) {
  return s.split(/(`[^`]+`)/).map((part) => /^`[^`]+`$/.test(part) ? `<code>${esc(part.slice(1, -1))}</code>`
    : esc(part).replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")).join("");
}
const LIST = /^\s*([-*]|\d+\.)\s+(.*)$/, BLOCK = /^(#{1,6}\s|```|\s*\||\s*([-*]|\d+\.)\s)/;
function markdown(text) {
  const lines = text.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (/^#\s/.test(lines[i] || "")) i++;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (/^```/.test(line)) {
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) { const n = Math.min(h[1].length + 1, 4); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) {
        if (/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i])) continue;
        rows.push(lines[i].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim())));
      }
      out.push("<table>" + rows.map((r, n) => "<tr>" + r.map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    const li = LIST.exec(line);
    if (li) {
      const ordered = /\d/.test(li[1]), items = [];
      while (i < lines.length) {
        const m = LIST.exec(lines[i]);
        if (m && /\d/.test(m[1]) === ordered) items.push(m[2]);
        else if (items.length && /^\s+\S/.test(lines[i]) && !m) items[items.length - 1] += " " + lines[i].trim();
        else break;
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((x) => `<li>${inline(x)}</li>`).join("") + `</${tag}>`);
      continue;
    }
    const buf = [];
    for (; i < lines.length && lines[i].trim() && !BLOCK.test(lines[i]); i++) buf.push(lines[i].trim());
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}

// --- recording
function startBody() {
  const c = C(), body = { instruments: chosen().map((i) => i.id), inputs: carries() };
  if (c.kind === "exercise") Object.assign(body, { exercise: c.exercise, tempo_bpm: tempoOf(exById(c.exercise)), click: !!c.clickThrough, count_in: !!c.countIn });
  else if (c.kind === "playalong") { const b = backingById(c.backing); Object.assign(body, { backing: c.backing, count_in: !!(c.backingCountIn && b && b.tempo) }); }
  else if (c.freeClick) Object.assign(body, { click: true, tempo_bpm: c.freeBpm, beats_per_bar: c.freeBpb, count_in: !!c.freeCountIn });
  else Object.assign(body, { click: false, count_in: false });
  return body;
}
let recordingId = null;
async function record() {
  const r = await api("POST", "/api/record/start", startBody());
  recordingId = r.take; S.screen = "recording"; render(); wakeLock(true);
}
let lock = null;
async function wakeLock(on) {  // the screen stays on while recording (where the browser can)
  try {
    if (on && "wakeLock" in navigator && !lock) lock = await navigator.wakeLock.request("screen");
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; }
}

// --- the status, often while something happens
let pollTimer = null, takesVersion = -1, dragging = false, lastTouch = Date.now(), monitorAt = 0;
const LISTEN_IDLE_MS = 10 * 60e3;  // the inputs are listened to until the page has been left alone this long
function listening() { return !document.hidden && Date.now() - lastTouch < LISTEN_IDLE_MS; }
function monitorTick() {
  const s = S.status;
  if (!s || s.recording || !["on", "ready", "record"].includes(S.screen) || !listening()) return;
  if (Date.now() - monitorAt < 2000) return;
  monitorAt = Date.now();
  api("POST", "/api/monitor").catch(() => {});
}
async function poll(once) {
  clearTimeout(pollTimer);
  let s;
  try { s = await api("GET", "/api/status"); } catch (e) { s = null; }
  if (s) {
    const prev = S.status; S.status = s;
    if ($("#end").textContent) $("#end").innerHTML = "";
    if (s.error && s.error !== S.lastServerError) { S.lastServerError = s.error; showError(s.error); }
    if (s.recording && S.screen !== "recording") { recordingId = s.recording.take; S.screen = "recording"; render(); wakeLock(true); }
    else if (!s.recording && S.screen === "recording") {
      S.take = recordingId || (prev && prev.recording && prev.recording.take); S.screen = "recorded"; wakeLock(false);
      await refresh(); render();
    }
    if (s.takes_version !== takesVersion) {
      const first = takesVersion < 0; takesVersion = s.takes_version;
      if (!first) { await refresh(); if (S.screen !== "recording") render(); }
    } else if (prev && JSON.stringify(prev.playing && [prev.playing.take, prev.playing.backing, prev.playing.exercise]) !== JSON.stringify(s.playing && [s.playing.take, s.playing.backing, s.playing.exercise])) {
      if (S.screen !== "recording") render();
    }
    live();
    monitorTick();
  } else {
    S.status = null;
    $("#end").innerHTML = '<span class="dev"><span class="dot"></span>Not reachable</span>';
  }
  const busy = s && (s.state !== "idle" || s.monitor);
  pollTimer = setTimeout(poll, s && s.state !== "idle" ? 120 : busy ? 300 : 1500);
}
async function refresh() {
  try {
    const [ex, takes, bk] = await Promise.all([api("GET", "/api/exercises"), api("GET", "/api/takes"), api("GET", "/api/backings")]);
    S.exercises = ex; S.takes = takes; S.backings = bk;
  } catch (e) {}
}

// --- taps
function flushNote() {  // a take's note typed but not sent yet, before the screen changes (or the page goes)
  const el = $("[data-note]"), t = el && S.takes.find((x) => x.id === el.dataset.note);
  if (!t || el.value === (t.note || "")) return;
  t.note = el.value;
  fetch(`/api/takes/${encodeURIComponent(t.id)}/note`, { method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ note: el.value }), keepalive: true }).catch(() => {});
}
document.addEventListener("click", (ev) => {
  lastTouch = Date.now();
  if (!ev.target.closest("[data-note]")) flushNote();
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const a = el.dataset.act, d = el.dataset, c = C();
  if (a === "dismiss") showError("");
  else if (a === "go") {
    if (d.to === "record") S.showReadme = false;
    go(d.to);
  }
  else if (a === "step") go(d.step, { walk: false });
  else if (a === "jump") jump(d.id);
  else if (a === "kind") go("instrument", { kind: d.kind });
  else if (a === "start") startOther(d.kind);
  else if (a === "restore") restore(d.to);
  else if (a === "answered") answered(d.step);
  else if (a === "inst") toggleInstrument(d.id);
  else if (a === "any-on") setAnyOn(d.id);
  else if (a === "any-other") { go("on", { walk: false }); S.toRecord = true; render(); }  // and back to the record screen
  else if (a === "kind-other") otherKind();
  else if (a === "carry") { S.choices.inputs = { ...carries(), [d.input]: d.v }; save(); render(); }
  else if (a === "just") { S.choices.instruments = [d.id]; S.choices.inputs = defaultInputs(chosen()); save(); answered("on"); }
  else if (a === "preview") { S.preview = d.id; S.previewOpen = true; render(); const sc = $(".pv-score"); if (sc) sc.scrollTop = 0; }
  else if (a === "preview-close") { S.previewOpen = false; render(); }
  else if (a === "hear-chart") act(() => api("POST", `/api/exercises/${encodeURIComponent(d.id)}/hear`, { count_in: !!c.countIn, click: !!c.clickThrough }));
  else if (a === "show-good") { S.showGood = !S.showGood; render(); }
  else if (a === "backing") set({ backing: d.id });
  else if (a === "hear") act(() => api("POST", `/api/backings/${encodeURIComponent(d.id)}/play`, { start: 0 }));
  else if (a === "hear-stop" || a === "stop-play") act(() => api("POST", "/api/stop"));
  else if (a === "toggle") set({ [d.k]: !c[d.k] });
  else if (a === "free-click") set({ freeClick: d.v === "1" });
  else if (a === "free-bpm") set({ freeBpm: Math.max(30, Math.min(260, c.freeBpm + Number(d.d))) });
  else if (a === "bpb") set({ freeBpb: Number(d.v) });
  else if (a === "ex-bpm") { const e = exById(c.exercise); set({ tempo: { ...c.tempo, [e.id]: Math.max(30, Math.min(260, Math.round(tempoOf(e)) + Number(d.d))) } }); }
  else if (a === "ex-bpm-reset") { const t = { ...c.tempo }; delete t[c.exercise]; set({ tempo: t }); }
  else if (a === "swap") set({ exercise: d.id });
  else if (a === "level") setLevel((S.status ? S.status.level_offset_db : 0) + Number(d.d));
  else if (a === "readme") { S.showReadme = !S.showReadme; render(); }
  else if (a === "record") act(record);
  else if (a === "stop-rec") act(() => api("POST", "/api/record/stop"));
  else if (a === "play") act(() => api("POST", `/api/takes/${encodeURIComponent(d.id)}/play`, { start: 0 }));
  else if (a === "sheet") { S.sheet = true; $("#sheet").hidden = false; renderSheet(); }
  else if (a === "sheet-close") { S.sheet = false; $("#sheet").hidden = true; }
  else if (a === "note") {
    const t = S.takes.find((x) => x.id === d.id), note = prompt("Note for this take:", (t && t.note) || "");
    if (note !== null) act(async () => { await api("PUT", `/api/takes/${encodeURIComponent(d.id)}/note`, { note }); await refresh(); render(); });
  }
  else if (a === "delete") {
    const t = S.takes.find((x) => x.id === d.id);
    if (t && confirm(`Delete the take from ${when(t.started)} (${fmt(t.seconds)})?`))
      act(async () => { await api("DELETE", `/api/takes/${encodeURIComponent(d.id)}`); await refresh();
        if (S.screen === "recorded" && S.take === d.id) { S.take = null; go("ready"); } else render(); });
  }
});
$("#sheet").addEventListener("click", (ev) => { if (ev.target.id === "sheet") { S.sheet = false; $("#sheet").hidden = true; } });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && S.sheet) { S.sheet = false; $("#sheet").hidden = true; }
  else if (ev.key === "Escape" && S.previewOpen) { S.previewOpen = false; render(); }
});
// the waveform: tap to play from there
document.addEventListener("click", (ev) => {
  const w = ev.target.closest("[data-wave]");
  if (!w) return;
  const r = w.getBoundingClientRect(), at = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * Number(w.dataset.seconds);
  act(() => api("POST", `/api/takes/${encodeURIComponent(w.dataset.wave)}/play`, { start: at }));
});
// the speakers' level: shown while dragged, sent when let go
function setLevel(v) {
  v = Math.max(-30, Math.min(12, Math.round(v)));
  act(async () => { const r = await api("PUT", "/api/settings", { level_offset_db: v }); if (S.status) S.status.level_offset_db = r.level_offset_db; live(); });
}
document.addEventListener("input", (ev) => {
  if (ev.target.dataset.level === undefined) return;
  dragging = true;
  const v = Number(ev.target.value);
  $$("[data-level-text]").forEach((el) => { el.innerHTML = el.classList.contains("lv") ? `${esc(dbText(v).replace(" dB", ""))} <small>dB</small>` : esc(dbText(v)); });
});
document.addEventListener("change", (ev) => {
  if (ev.target.dataset.level !== undefined) { dragging = false; setLevel(Number(ev.target.value)); }
  if (ev.target.dataset.note) { const id = ev.target.dataset.note, note = ev.target.value;
    act(async () => { await api("PUT", `/api/takes/${encodeURIComponent(id)}/note`, { note }); await refresh(); }); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.dataset.note) ev.target.blur(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.dataset.kindIn !== undefined) { ev.preventDefault(); otherKind(); } });
document.addEventListener("pointerdown", () => { const was = listening(); lastTouch = Date.now(); if (!was) monitorTick(); });
window.addEventListener("pagehide", () => { saveNow(); flushNote(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); if (!document.hidden) { lastTouch = Date.now(); refresh().then(render); poll(true); } });
// the screen named in the address: the board with none, an instrument's list by its kind (#dobro), a step, Ready
// or the record screen (#on, #ready, #record, ...). The page keeps it there as it goes (remember), so a reload
// comes back to it, and a bookmark of an instrument's list starts there.
function fromAddress() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch (e) {}
  if (h && exercisesFor(h).length) return { screen: "instrument", kind: h };
  if (["on", "which", "ready"].includes(h) || (h === "record" && readyOk())) return { screen: h };
  return { screen: "board" };
}
window.addEventListener("hashchange", () => { const a = fromAddress(); go(a.screen, { kind: a.kind }); });

// the room's inputs (recorder/static/inputs.js): a mic named on any app's page, or recorded or not, shows here at
// once; the sheet listens to the inputs while it is open
RoomInputs.onChange((listing) => {
  if (!listing) return;
  S.inputs = recordedOf(listing);
  if (S.screen !== "recording") render();
});
(async function startUp() {
  try { await loadAll(); } catch (e) { showError(`Could not load: ${e.message}`); S.choices = S.choices || { ...DEFAULTS }; }
  const a = fromAddress();
  go(a.screen, { kind: a.kind });
  RoomInputs.init({ monitor: () => { lastTouch = Date.now(); api("POST", "/api/monitor").catch(() => {}); } });
  poll(true);
})();
</script>
