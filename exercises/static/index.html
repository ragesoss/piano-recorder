<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercises</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121016">
<style>
/* Two parts: choosing the next take (steps that open on Ready, as you left it) and recording it
   (the record screen, the take, what was just recorded). Dark, with purple as the key color. */
@font-face { font-family: "Bricolage Grotesque"; src: url(/fonts/bricolage-grotesque.woff2) format("woff2");
  font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url(/fonts/public-sans.woff2) format("woff2");
  font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #121016; --surf2: #1E1A24; --surf: #28232F; --line: #3E3748; --line-soft: #2F2A37; --dash: #514960;
  --ink: #F2EEF8; --ink2: #CEC7DA; --ink3: #A79FB4; --faint: #7E768B;
  --purple-fill: #7C3AED; --purple: #8B5CF6; --purple-line: #A78BFA; --purple-ink: #B9A0FF;
  --purple-tint: #33264F; --purple-tint2: #45356A;
  --red: #D42A1F; --red-dot: #FF5147; --red-ink: #FF8F85; --red-tint: #3E1F24;
  --green: #4ADE80; --amber: #E8B93B;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 var(--text); -webkit-tap-highlight-color: transparent;
  overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--purple-ink); }
h1, h2, h3, p { margin: 0; }
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.display { font-family: var(--display); }
.tnum { font-variant-numeric: tabular-nums; }
.svg-i { flex: none; }

/* the top line: where you are, as breadcrumbs (the music room, each step with its choice, Ready, the
   record screen, the take); each one goes back there. While recording they wait for Stop. */
.top { flex: none; min-height: 68px; display: flex; align-items: center; gap: 12px; padding: 8px 24px; }
.top .home { min-height: 44px; display: flex; align-items: center; gap: 6px; color: var(--ink3); font-size: 17px; text-decoration: none; flex: none;
  padding-right: 4px; }
.top .home svg path { stroke: var(--ink3); }
.top .end { flex: none; display: flex; align-items: center; gap: 14px; font-size: 15px; color: var(--ink3); margin-left: auto; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.crumbs .chip { padding: 0 12px; max-width: 230px; }
.crumbs .chip.now { padding: 0 14px; }
.crumbs .chip.todo { padding: 0 8px; }
.crumbs .chip .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.crumbs .chev { color: var(--faint); }
.crumbs .off { opacity: .45; cursor: default; }
.crumbs .chip.off { background: transparent; }
.chip { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 22px; border: 0;
  background: var(--surf2); color: var(--ink); font-size: 16px; font-weight: 600; text-decoration: none; white-space: nowrap;
  max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.chip.now { background: var(--purple-fill); color: #fff; font-size: 17px; font-weight: 700; padding: 0 18px; }
.chip.todo { background: transparent; color: var(--ink3); font-weight: 400; font-size: 17px; padding: 0 10px; }
.chip.again { background: transparent; border: 1.5px dashed var(--red-ink); color: var(--red-ink); font-weight: 700; }
.chip.again s { color: var(--ink3); font-weight: 600; }
.dev { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: var(--green); }
.banner { margin: 0 24px 8px; padding: 12px 16px; border-radius: 14px; background: var(--red-tint); color: var(--ink);
  border: 1.5px solid var(--red-ink); font-size: 16px; display: flex; gap: 12px; align-items: center; }
.banner button { margin-left: auto; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--ink3); background: transparent; }

/* a step: the question, its choices (scrolling), and a footer */
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 40px 20px; }
.foot { flex: none; min-height: 104px; display: flex; align-items: center; gap: 16px; padding: 12px 28px 12px 40px;
  border-top: 1.5px solid var(--line); flex-wrap: wrap; }
.foot .note { flex: 1; min-width: 200px; font-size: 17px; line-height: 1.35; color: var(--ink2); }
.foot .note b { color: var(--ink); }
.foot .hint { margin-left: auto; font-size: 18px; color: var(--ink3); }
.q h1 { font-family: var(--display); font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.q p { margin-top: 6px; font-size: 19px; color: var(--ink3); }
.btn { min-height: 64px; padding: 0 24px; display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--ink2);
  border-radius: 20px; background: transparent; font-size: 19px; font-weight: 700; }
.btn.go { min-height: 76px; padding: 0 30px; border: 0; border-radius: 22px; background: var(--purple-fill); color: #fff;
  font-family: var(--display); font-size: 26px; font-weight: 700; margin-left: auto; }
.btn.go.big { min-height: 92px; padding: 0 36px; border-radius: 26px; font-size: 34px; gap: 16px; }
.btn.go:disabled { background: #2A2531; color: var(--faint); }
.btn.small { min-height: 48px; padding: 0 18px; border-radius: 24px; font-size: 17px; }
.btn.outline-p { border-color: var(--purple); color: var(--purple-ink); }
.pill { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 14px; font-weight: 700; }
.pill.red { background: var(--red-tint); color: var(--red-ink); }
.pill.purple { background: var(--purple-tint); color: var(--purple-ink); }
.label { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); }
.muted { color: var(--ink3); }
.red-ink { color: var(--red-ink); }
.p-ink { color: var(--purple-ink); }

/* 1 on what */
.on-grid { display: grid; grid-template-columns: minmax(0, 1fr) 352px; gap: 28px; margin-top: 18px; align-items: start; }
.kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.kind { display: flex; flex-direction: column; gap: 8px; }
.card { min-height: 80px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surf);
  text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-size: 18px; font-weight: 600; }
.card.sel { border: 2.5px solid var(--purple); background: var(--purple-tint); font-weight: 700; }
.card.unlisted { min-height: 64px; border: 1.5px dashed var(--dash); background: transparent; font-size: 17px; font-weight: 400; color: var(--ink2); }
.card.unlisted.sel { border: 2.5px solid var(--purple); background: var(--purple-tint); color: var(--ink); font-weight: 700; }
.card .sub { font-size: 15px; color: var(--ink3); font-weight: 400; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.card.sel .sub { color: var(--purple-ink); font-weight: 600; }
.panel { background: var(--surf); border: 1.5px solid var(--line); border-radius: 22px; padding: 18px; }
.panel h2 { font-family: var(--display); font-size: 24px; font-weight: 700; }
.inputs { display: flex; flex-direction: column; gap: 14px; }
.input { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line-soft); }
.input:last-child { border-bottom: 0; padding-bottom: 0; }
.input .row { display: flex; align-items: center; gap: 10px; }
.input .name { font-size: 17px; font-weight: 700; width: 144px; flex: none; }
.input .det { font-size: 14px; color: var(--ink3); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 3px; border-radius: 13px; background: var(--surf2); }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-size: 15px; font-weight: 600; padding: 4px 6px; line-height: 1.15; }
.seg button[aria-pressed="true"] { background: var(--purple-fill); color: #fff; font-weight: 700; }
.meter { flex: 1; height: 10px; border-radius: 5px; background: var(--line); position: relative; overflow: hidden; min-width: 60px; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: var(--ink2); transition: width .12s linear; }
.meter > b { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ink); opacity: .8; display: none; }
.meter.big { height: 14px; border-radius: 7px; }

/* the board (the index): what the project wants, a column for each instrument; a tap sets one up */
.board-body { display: flex; flex-direction: column; gap: 14px; overflow: hidden; padding-top: 14px; padding-bottom: 16px; }
.board-body > * { flex: none; }
.board-head { display: flex; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; }
.board-head .q { flex: 1; min-width: 280px; }
.board-head .q h1 { font-size: 38px; }
.board-head .q p { font-size: 17px; }
.board-head .q p button { background: transparent; border: 0; padding: 0; color: var(--purple-ink); font-weight: 700; text-decoration: underline;
  text-underline-offset: 3px; min-height: 32px; }
.board-head .others { display: flex; gap: 10px; flex-wrap: wrap; }
.board-head .others .btn { min-height: 56px; font-size: 18px; border-color: var(--line); }
.resume { display: flex; align-items: center; gap: 12px 16px; min-height: 60px; padding: 8px 10px 8px 18px; border-radius: 16px; background: var(--surf2);
  flex-wrap: wrap; }
.resume .sent { flex: 1; min-width: 240px; font-size: 17px; line-height: 1.35; color: var(--ink2); }
.resume .sent b { color: var(--ink); }
.board { flex: 1 1 auto; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 14px;
  overflow-x: auto; -webkit-overflow-scrolling: touch; }
.bcol { min-height: 0; display: flex; flex-direction: column; background: var(--surf2); border-radius: 20px; overflow: hidden; }
.bcol-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 6px 6px 16px; }
.bcol-head h2 { font-family: var(--display); font-size: 26px; font-weight: 700; flex: 1; min-width: 0; }
.bcol-head .all { min-height: 44px; padding: 0 10px; border: 0; border-radius: 14px; background: transparent; color: var(--purple-ink);
  font-size: 15px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.bcol-on { flex: none; padding: 0 16px 8px; font-size: 14px; color: var(--ink3); margin-top: -4px; }
.bcol-on b { color: var(--red-ink); }
.bcol-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.bcol-list h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin: 6px 6px 0; }
.bcol-list h3.red { color: var(--red-ink); }
.bcard { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px;
  background: var(--surf); text-align: left; width: 100%; min-height: 60px; flex: none; }
.bcard .num { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--ink3); width: 38px; flex: none; line-height: 1.25; }
.bcard .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.bcard .title { font-size: 17px; font-weight: 700; line-height: 1.25; }
.bcard .why { font-size: 14px; line-height: 1.35; color: var(--red-ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bcard .info { font-size: 14px; color: var(--ink3); }
.bcard .info b { color: var(--purple-ink); }
.bcard.sel { border: 2px solid var(--purple); background: var(--purple-tint); }
.bcard.sel .num { color: var(--purple-ink); }
.bcard.done { background: transparent; border-style: dashed; border-color: var(--dash); }
.bcard.done .title { color: var(--ink2); font-weight: 600; }
.board-empty { margin: auto; max-width: 560px; text-align: center; color: var(--ink3); font-size: 19px; line-height: 1.5; padding: 40px 20px; }

/* 3 which exercise */
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col h2 { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin-top: 8px; }
.col h2.red { color: var(--red-ink); }
.strip { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 8px 16px; border-radius: 12px; background: var(--surf2);
  font-size: 16px; color: var(--ink2); }
.strip b { color: var(--ink); }
.ex { min-height: 74px; display: flex; align-items: center; gap: 16px; padding: 8px 18px; border: 1.5px solid var(--line); border-radius: 18px;
  background: var(--surf); text-align: left; width: 100%; }
.ex .num { font-family: var(--display); font-size: 26px; font-weight: 700; width: 54px; flex: none; color: var(--ink3); }
.ex .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ex .title { font-size: 20px; font-weight: 700; }
.ex .info { font-size: 16px; color: var(--ink3); }
.ex.sel { border: 2.5px solid var(--purple); background: var(--purple-tint); }
.ex.sel .num { color: var(--purple-ink); }
.ex.sel .info { color: var(--ink2); }
.ex .now { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--purple-ink); flex: none; }
.list { background: var(--surf); border: 1.5px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; padding: 4px 0; }
.list button { min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--line-soft);
  background: transparent; text-align: left; }
.list button:last-child { border-bottom: 0; }
.list .n { font-weight: 700; width: 36px; color: var(--ink3); flex: none; }
.list .t { flex: 1; font-size: 18px; font-weight: 600; }
.list .r { font-size: 15px; color: var(--ink3); }
.list button.sel { background: var(--purple-tint); }
.list button.sel .n { color: var(--purple-ink); }
.list .more { font-size: 17px; font-weight: 700; color: var(--purple-ink); }
.tunes { display: flex; flex-wrap: wrap; gap: 8px; }
.tunes button { min-height: 48px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 24px; background: var(--surf); font-size: 17px; font-weight: 600; }
.tunes button.sel { border: 2.5px solid var(--purple); background: var(--purple-tint); }
.tunes button, .list button { gap: 8px; }
.tunes button { display: inline-flex; align-items: center; }
/* 3 which exercise: the list, and the score of the one tapped beside it (a sheet over it when narrow) */
.pick-body { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 14px; }
.pick-body > .q { flex: none; }
.pick { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); gap: 24px; margin-top: 16px; }
.pick-list { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding: 0 6px 12px 0; }
.pick-list > * { flex: none; }
.pick-list h2 { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin-top: 8px; }
.pick-list h2:first-child { margin-top: 0; }
.pick-list h2.red { color: var(--red-ink); }
.preview { min-height: 0; display: flex; flex-direction: column; background: var(--surf); border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; }
.pv-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.pv-t { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 14px; }
.pv-t .num { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--purple-ink); flex: none; }
.pv-t .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pv-t .title { font-size: 20px; font-weight: 700; }
.pv-t .info { font-size: 15px; color: var(--ink3); }
.pv-score { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px; }
.pv-score img { display: block; width: 100%; height: auto; filter: invert(0.92); mix-blend-mode: lighten; margin-bottom: 10px; }
.pv-empty { margin: auto; color: var(--ink3); font-size: 19px; padding: 40px 24px; text-align: center; line-height: 1.5; }
.preview .pv-close, .preview .pv-go { display: none; }
.btn.go.pv-go { min-height: 56px; padding: 0 20px; border-radius: 18px; font-size: 20px; }

/* 3 which backing, and the speakers */
.bk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 28px; margin-top: 18px; align-items: start; }
.bk { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border: 1.5px solid var(--line); border-radius: 20px; background: var(--surf); }
.bk.sel { border: 2.5px solid var(--purple); }
.bk .head { display: flex; gap: 10px; align-items: flex-start; }
.bk .head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.bk .t { font-size: 19px; font-weight: 700; line-height: 1.25; }
.bk .i { font-size: 15px; color: var(--ink3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bk .acts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bk .use { margin-left: auto; min-height: 52px; padding: 0 18px; border: 0; border-radius: 16px; background: var(--purple-tint); color: var(--purple-ink); font-size: 17px; font-weight: 700; }
.hear { min-height: 52px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink2); border-radius: 16px;
  background: transparent; font-size: 17px; font-weight: 700; }
.hear.on { border: 0; background: var(--purple-fill); color: #fff; }
.prog { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 4px; }
.prog .bar { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.prog .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--purple); border-radius: 4px; width: 0; }
.prog span { font-size: 14px; color: var(--ink2); }
.switch { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px;
  border: 1.5px solid var(--line); border-radius: 16px; background: transparent; font-size: 17px; text-align: left; }
.switch .track { width: 52px; height: 30px; border-radius: 15px; background: var(--line); display: flex; padding: 3px; flex: none; }
.switch .track i { width: 24px; height: 24px; border-radius: 12px; background: #fff; }
.switch[aria-checked="true"] .track { background: var(--purple); justify-content: flex-end; }
.speakers { border: 2.5px solid var(--ink2); border-radius: 24px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--surf); }
.speakers .lv { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1; }
.speakers .lv small { font-size: 26px; }
.speakers .pm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.speakers .pm button { min-height: 60px; border: 1.5px solid var(--line); border-radius: 16px; background: transparent; font-size: 28px; }
input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: var(--purple); }
.scale { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink3); }

/* 3 free play */
.fr-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 20px; margin-top: 22px; }
.fr { border: 1.5px solid var(--line); border-radius: 26px; background: var(--surf); padding: 26px; display: flex; flex-direction: column; gap: 16px; text-align: left; }
.fr.sel { border: 2.5px solid var(--purple); }
.fr .t { font-family: var(--display); font-size: 40px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
.fr .d { font-size: 19px; line-height: 1.4; color: var(--ink2); }
.radio { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink3); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.sel .radio { border-color: var(--purple); }
.sel .radio::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--purple); }
.bpm { display: flex; align-items: center; gap: 14px; }
.bpm button { width: 64px; height: 64px; flex: none; border: 1.5px solid var(--line); border-radius: 32px; background: transparent; font-size: 30px; }
.bpm .bv { flex: 1; text-align: center; font-family: var(--display); font-size: 56px; font-weight: 700; white-space: nowrap; }
.bpm .bv small { font-size: 22px; font-weight: 600; }
.bpm.sm button { width: 56px; height: 56px; font-size: 26px; }
.bpm.sm .bv { flex: none; min-width: 128px; font-size: 36px; }

/* ready */
.ready-body { padding-top: 22px; display: flex; flex-direction: column; gap: 16px; }

.sentence { font-family: var(--display); font-size: 31px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.2; }

.ornext { display: flex; align-items: center; gap: 18px; min-height: 68px; padding: 8px 12px 8px 22px; border-radius: 18px; background: var(--surf2); flex-wrap: wrap; }
.rows { background: var(--surf); border: 1.5px solid var(--line); border-radius: 22px; display: flex; flex-direction: column; }
.rows > div { display: flex; align-items: center; gap: 18px; min-height: 84px; padding: 10px 22px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }

.rows .k { width: 120px; flex: none; font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }

  background: transparent; border: 0; text-decoration: underline; text-underline-offset: 3px; }
.ins-line { display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--ink2); flex-wrap: wrap; }

.toggles { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }

/* recording: the record screen, the take, what was just recorded */
.rec-head { flex: none; padding: 4px 40px 0; display: flex; flex-direction: column; gap: 10px; }
.rec-head .sentence { font-size: 32px; line-height: 1.3; font-weight: 500; }
.rec-head .sentence button { font: inherit; font-weight: 700; color: var(--purple-ink); background: var(--purple-tint); border: 0;
  border-radius: 14px; padding: 0 12px; margin: 2px 0; }
.rec-head .meta { display: flex; align-items: center; gap: 10px; font-size: 17px; color: var(--ink2); flex-wrap: wrap; }
/* an exercise for any instrument: what it is played on, one tap to change */
.onpicks { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.onpicks .k { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); }
.onpick { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--surf2);
  font-size: 16px; font-weight: 600; color: var(--ink); white-space: nowrap; }

.onpick.more { background: transparent; border-style: dashed; border-color: var(--purple); color: var(--purple-ink); }
/* 1 on what: a kind not listed, typed */
.kindform { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1.5px dashed var(--dash); border-radius: 16px; }
.kindform label { font-size: 15px; color: var(--ink3); }
.kindform input { min-height: 44px; width: 100%; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surf2);
  font-size: 17px; }
.kindform .btn { justify-content: center; }
.rec-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; padding: 16px 28px 24px 40px; }
.score { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--surf); border: 1.5px solid var(--line);
  border-radius: 22px; padding: 14px 16px; }
.score .bar { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--ink3); margin-bottom: 6px; }
.score .bar { gap: 12px; flex-wrap: wrap; }
.score .bar .bar-r { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.score .bar .bar-r button { background: transparent; border: 0; color: var(--purple-ink); font-weight: 700; text-decoration: underline; min-height: 44px; }
.score .bar .hear { min-height: 44px; padding: 0 14px; font-size: 16px; color: var(--ink); }
.score .bar .hear.on { color: #fff; }
.score img { display: block; width: 100%; height: auto; filter: invert(0.92); mix-blend-mode: lighten; margin-bottom: 10px; }
.score .none { color: var(--ink3); padding: 40px 20px; text-align: center; font-size: 19px; line-height: 1.5; }
.readme { font-size: 16px; line-height: 1.5; color: var(--ink2); background: var(--surf2); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; }
.readme > :first-child { margin-top: 0; }
.readme p, .readme ul, .readme ol { margin: 0 0 8px; }
.readme ul, .readme ol { padding-left: 1.3em; }
.readme h2, .readme h3, .readme h4 { font-size: 16px; color: var(--ink); margin: 12px 0 4px; }
.readme code, .readme pre { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border-radius: 4px; padding: 0 3px; }
.readme pre { padding: 8px 10px; overflow-x: auto; }
.readme table { border-collapse: collapse; margin: 0 0 8px; font-size: 15px; }
.readme th, .readme td { border-bottom: 1px solid var(--line); padding: 4px 10px 4px 0; text-align: left; vertical-align: top; }
.readme th { color: var(--ink3); }
.side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
/* the boxes scroll when the column is short (three inputs, a short screen), so Record stays in view */
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 14px; }
.side-scroll > * { flex: none; }
.side > .recbtn { flex: none; }
@media (max-height: 760px) { .side > .recbtn { min-height: 96px; } }
.box { background: var(--surf2); border-radius: 18px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.box .row { display: flex; justify-content: space-between; font-size: 16px; }
.box .dev-line { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--ink3); }
.box .dev-line .dev { min-width: 0; }
.recbtn { margin-top: auto; min-height: 132px; border: 0; border-radius: 26px; background: var(--red); color: #fff; display: flex; align-items: center;
  justify-content: center; gap: 18px; font-family: var(--display); font-size: 40px; font-weight: 700; }
.recbtn:disabled { background: #2A2531; color: var(--faint); }
.recbtn i { width: 28px; height: 28px; border-radius: 50%; background: #fff; }
.recbtn.stop i { border-radius: 4px; }
.recording-chip { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 18px; border-radius: 22px; background: var(--red);
  color: #fff; font-size: 18px; font-weight: 700; flex: none; animation: pulse 1.6s ease-in-out infinite; }
.recording-chip i { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
@keyframes pulse { 50% { opacity: .78; } }
.live { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 40px; border-top: 1.5px solid var(--line); }
.live .score { border: 0; background: transparent; padding: 0; overflow: visible; }
.bigtime { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; min-height: 240px; text-align: center; }
.bigtime .v { font-family: var(--display); font-size: 120px; font-weight: 700; line-height: 1; }
.bigtime .s { font-size: 22px; color: var(--ink2); }
.bigtime .prog { width: min(720px, 100%); flex: none; }
.bigtime .prog .bar { height: 14px; border-radius: 7px; }
.rec-bar { flex: none; min-height: 150px; display: flex; align-items: center; gap: 32px; padding: 16px 28px 16px 40px; background: var(--surf2);
  border-top: 1.5px solid var(--line); flex-wrap: wrap; }
.where { display: flex; align-items: baseline; gap: 10px; min-width: 210px; }
.where .v { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.where .v.count { color: var(--red-ink); font-size: 88px; }
.where .of { font-size: 22px; color: var(--ink3); }
.beats { display: flex; flex-direction: column; gap: 8px; }
.beats .dots { display: flex; gap: 10px; }
.beats .dots i { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--faint); }
.beats .dots i.on { background: var(--purple); border-color: var(--purple); }
.beats span, .clock span { font-size: 16px; color: var(--ink3); }
.clock { display: flex; flex-direction: column; align-items: center; }
.clock .v { font-family: var(--display); font-size: 46px; font-weight: 700; line-height: 1.1; }
.meters { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; }
.meters .row { display: flex; align-items: center; gap: 12px; }
.meters .row span { width: 96px; flex: none; }
.meters .peak { font-size: 15px; color: var(--ink3); }
.meters .peak.clip { color: var(--red-ink); font-weight: 700; }
.stopbtn { min-height: 104px; min-width: 240px; border: 0; border-radius: 24px; background: var(--red); color: #fff; display: flex; align-items: center;
  justify-content: center; gap: 14px; font-family: var(--display); font-size: 40px; font-weight: 700; margin-left: auto; }
.stopbtn i { width: 24px; height: 24px; border-radius: 4px; background: #fff; }
/* recording an exercise: the score has the screen (no crumbs, no sentence), one slim bar under it, and a cursor
   that moves across the score with the click (2026-10-21, the player: "the UI should maximize the amount of screen
   available for the notation") */
.app.rec-score .top { display: none; }
.live.sc { padding: 6px 12px 8px; border-top: 0; }
.live.sc .score img { margin-bottom: 4px; }
.pg { position: relative; }
.sc-bar { position: absolute; background: rgba(139, 92, 246, 0.2); border-radius: 6px; pointer-events: none; display: none; }
.sc-cur { position: absolute; width: 3px; margin-left: -1px; background: var(--red-dot); border-radius: 2px; pointer-events: none; display: none; }
.sc-cur.wait { opacity: .5; }
.rec-bar.slim { min-height: 0; gap: 10px 20px; padding: 8px 16px; }
.slim .rb-what { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 0 1 280px; }
.slim .rb-what .recording-chip { min-height: 32px; padding: 0 12px; font-size: 15px; align-self: flex-start; }
.slim .rb-what .t { font-size: 14px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slim .where { min-width: 130px; gap: 6px; }
.slim .where .v { font-size: 38px; }
.slim .where .v.count { font-size: 46px; }
.slim .where .of { font-size: 16px; }
.slim .beats { gap: 4px; }
.slim .beats .dots { gap: 6px; }
.slim .beats .dots i { width: 18px; height: 18px; border-width: 2px; }
.slim .beats span, .slim .clock span { font-size: 13px; }
.slim .clock .v { font-size: 26px; }
.slim .meters { min-width: 170px; gap: 4px; font-size: 14px; }
.slim .meters .row { gap: 8px; }
.slim .meters .row span { width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slim .meters .peak { font-size: 13px; }
.slim .meter.big { height: 10px; }
.slim .stopbtn { min-height: 60px; min-width: 150px; border-radius: 18px; font-size: 26px; gap: 10px; }
.slim .stopbtn i { width: 18px; height: 18px; }

.done-head { flex: none; padding: 6px 40px 0; display: flex; flex-direction: column; gap: 10px; }
.done-head h1 { font-family: var(--display); font-size: 46px; font-weight: 500; line-height: 1.15; letter-spacing: -0.015em; }
.done-head h1 b { color: var(--purple-ink); font-weight: 700; }
.lined { display: flex; align-items: center; gap: 10px; font-size: 18px; color: var(--ink2); }
.done-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; padding: 18px 28px 24px 40px; }
.take-card { background: var(--surf); border: 1.5px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; overflow-y: auto; }
.wave { position: relative; height: 130px; cursor: pointer; touch-action: manipulation; }
.wave svg { width: 100%; height: 100%; display: block; }
.wave .head { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--red-dot); left: 0; display: none; }
.wave .b0 { position: absolute; top: 0; bottom: 0; border-left: 2px dotted var(--purple-line); }
.wave-times { display: flex; justify-content: space-between; font-size: 15px; color: var(--ink3); }
.wave-times b { color: var(--purple-ink); font-weight: 600; }
.acts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.acts .btn { min-height: 60px; font-size: 19px; }
.acts .btn.fill { border: 0; background: var(--purple-fill); color: #fff; }
.notefield { display: flex; align-items: center; gap: 12px; }
.notefield label { font-weight: 700; }
.notefield input { flex: 1; min-height: 56px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); padding: 0 14px; font-size: 18px; }
.next-acts { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 84px; gap: 12px; }
.next-acts button { min-height: 84px; border-radius: 20px; font-family: var(--display); font-size: 26px; font-weight: 700; }
.next-acts .again { border: 2px solid var(--red-ink); background: transparent; color: var(--red-ink); display: flex; align-items: center; justify-content: center; gap: 12px; }
.next-acts .again i { width: 20px; height: 20px; border-radius: 50%; background: var(--red-dot); }
.next-acts .else { border: 0; background: var(--purple-tint); color: var(--purple-ink); }
.next-acts .del { border: 1.5px solid var(--line); background: transparent; display: flex; align-items: center; justify-content: center; }
.takes { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
.takes h2 { font-family: var(--display); font-size: 26px; font-weight: 700; }
.tk { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 18px; background: transparent; text-align: left; width: 100%; }
.tk.on { background: var(--purple-tint); border-color: var(--purple-tint); }
.tk .play { width: 52px; height: 52px; flex: none; border-radius: 26px; border: 1.5px solid var(--ink2); display: flex; align-items: center; justify-content: center; }
.tk.on .play { background: var(--purple); border-color: var(--purple); }
.tk .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tk .m b { font-size: 17px; }
.tk .m span { font-size: 14px; color: var(--ink2); }
.tk .m em { font-size: 14px; color: var(--ink3); }
.tip-next { all: unset; cursor: pointer; display: block; width: 100%; color: inherit; font: inherit; }
.tip-next b { color: var(--ink); }
.tip-go { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--purple, #7C3AED); color: var(--ink); font-weight: 700; }
.tip-next:focus-visible { outline: 2px solid var(--purple, #7C3AED); outline-offset: 4px; border-radius: 12px; }
.tip { margin-top: auto; background: var(--surf2); border-radius: 16px; padding: 14px 16px; font-size: 16px; line-height: 1.4; color: var(--ink2); }

/* the takes, from the record screen */
.sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.sheet-box { background: var(--surf2); border: 1.5px solid var(--line); width: min(760px, 100%); max-height: min(92dvh, 900px); border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-family: var(--display); font-size: 26px; }
.sheet-list { overflow-y: auto; padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.sheet-list .tk { flex-wrap: wrap; }
.sheet-list .tk .x { display: flex; gap: 8px; }
.sheet-list .tk .x a, .sheet-list .tk .x button { min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 12px; background: transparent;
  display: inline-flex; align-items: center; color: var(--ink); text-decoration: none; font-size: 15px; }
.empty { color: var(--ink3); padding: 12px 0; }

@media (max-width: 1060px) {
  .on-grid, .bk-grid { grid-template-columns: minmax(0, 1fr); }
  .crumbs .chip { max-width: 170px; }
  .crumbs .chip .svg-i, .crumbs .wide { display: none; }
  .pick-body { display: block; overflow-y: auto; }
  .pick { display: block; }
  .pick-list { overflow: visible; padding-right: 0; }
  .preview { display: none; }
  .preview.open { display: flex; position: fixed; inset: 0; z-index: 10; border: 0; border-radius: 0; background: var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .preview.open .pv-close, .preview.open .pv-go { display: inline-flex; }
  .preview.open .pv-head { padding: 10px 16px; }
  .rec-grid, .done-grid { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
  .score { min-height: 360px; }
  .fr-grid { grid-template-columns: minmax(0, 1fr); }
  /* the board: the instruments one under another, the page scrolling */
  .board-body { overflow-y: auto; }
  .board { display: flex; flex-direction: column; overflow: visible; }
  .bcol { flex: none; overflow: visible; }
  .bcol-list { overflow: visible; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); align-items: start; }
  .bcol-list h3 { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
  body { font-size: 16px; }
  .top { padding: 8px 16px; }
  .body { padding: 14px 16px 18px; }
  .foot { padding: 12px 16px; }
  .rec-head, .done-head, .live { padding-left: 16px; padding-right: 16px; }
  .rec-grid, .done-grid { padding: 12px 16px 16px; }
  .rec-bar { padding: 12px 16px; gap: 16px; }

  .slim .meters { display: none; }
  .slim .stopbtn { width: auto; min-width: 120px; min-height: 52px; margin-left: auto; }
  .live.sc { padding: 4px 6px 6px; }
  .q h1 { font-size: 34px; }
  .sentence { font-size: 24px; }
  .rec-head .sentence, .done-head h1 { font-size: 30px; }
  .rows .k { width: 100%; }
  .stopbtn { min-width: 0; width: 100%; }
  .chip { max-width: 160px; }
  .crumbs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <div class="end" id="end"></div>
  </header>
  <div class="banner" id="error" hidden><span id="errorText"></span><button type="button" data-act="dismiss">OK</button></div>
  <div class="screen" id="screen"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">Takes</h2><button type="button" class="btn small" data-act="sheet-close">Done</button></div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<script src="/inputs.js"></script>
<script>
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = {
  check: '<svg class="svg-i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#A78BFA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
  chev: '<svg class="svg-i chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#7E768B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
  back: '<svg class="svg-i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#F2EEF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>',

function go(screen, opts = {}) {
  if (screen === "which" && C().kind === "exercise") {  // which exercise: the list of the instrument's kind, else the board
    const cur = exById(C().exercise);  // (one for any instrument: their list)
    const k = cur && cur.instrument === ANY ? ANY : chosen().length === 1 ? chosen()[0].kind : "";
    screen = k && exercisesFor(k).length ? "instrument" : "board";
    opts = { ...opts, kind: k };
  }
  if (screen !== "on") S.toRecord = false;
  if (STEPS.includes(screen) && !STEPS.includes(S.screen) && !opts.keepSnapshot) { S.snapshot = JSON.parse(JSON.stringify(C())); S.entry = screen; }
  if (opts.walk !== undefined) S.walk = opts.walk;
  if (!STEPS.includes(screen)) S.walk = false;
  const from = S.screen, fromKind = S.kind;
  S.screen = screen;
  if (screen === "instrument" && opts.kind) S.kind = opts.kind;
  S.sheet = false; $("#sheet").hidden = true;
  if (screen !== "instrument") S.showGood = false;
  if (screen === "instrument" && (from !== "instrument" || fromKind !== S.kind)) previewChosen();
  const pl = S.status && S.status.playing;
  if (pl && pl.exercise && !["ready", "record"].includes(screen)) api("POST", "/api/stop").catch(() => {});  // its Stop is not there
  if (screen === "which" && C().kind === "playalong" && !backingById(C().backing) && S.backings.length) {
    S.choices.backing = backingsNewest()[0].id; save();  // the newest, to hear first
  }
  render();
  const b = $(".body"); if (b && !opts.keepScroll) b.scrollTop = 0;
  remember();
  monitorTick();
}
function remember() {  // the screen in the address, so a reload (Safari drops a tab it has not shown for a while) comes back to it
  const h = S.screen === "board" ? "" : S.screen === "instrument" ? S.kind : ["recording", "recorded"].includes(S.screen) ? "record" : S.screen;
  try { history.replaceState(null, "", h ? `#${h}` : location.pathname + location.search); } catch (e) {}
}
function jump(id) {  // an exercise from the board or an instrument's list: set up, and its record screen
  const e = exById(id);
  if (!e) return;
  setUp(e);
  const to = readyOk() ? "record" : firstOpen() || "ready";
  go(to);
  S.toRecord = to === "on";  // asked what it is on (an exercise for any instrument, the first time): then its record screen
  if (S.toRecord) render();
}
function startOther(kind) {  // a play-along or free play, from the board: the steps from what it is on
  S.snapshot = JSON.parse(JSON.stringify(C())); S.entry = "on";
  S.choices.kind = kind; save();
  go("on", { walk: true, keepSnapshot: true });
}
function previewChosen() {  // the list's score, first: the exercise chosen if it is of this kind, else the first wanted
  const e = exById(C().exercise), list = exercisesFor(S.kind);
  S.preview = e && (e.instrument || "") === S.kind ? e.id : (list.find((x) => onBoard(x) && !x.to_review) || {}).id || null;
  S.previewOpen = false;
}
function answered(step) {  // a step's choice made: on to the next step, or back to Ready
  if (step === "on") { noteAny(); save(); }
  if (S.toRecord && step === "on") { go(firstOpen() || "record"); return; }
  if (S.walk) {
    const i = STEPS.indexOf(step);
    if (i < STEPS.length - 1) { go(STEPS[i + 1]); return; }
    go("ready"); return;
  }
  go(firstOpen() || "ready");
}
function restore(to = S.toRecord ? "record" : "ready") { if (S.snapshot) { S.choices = S.snapshot; save(); } go(to); }

function crumbsNav() {
  // the music room, the board (Exercises), then on an instrument's list its name; else each step of the
  // next take with its choice (or what is still to choose), Ready, and past it the record screen and the
  // take. Each goes back there with the choices kept; while a take records they are not links (Stop first:
  // a free take would go on with no one to stop it).
  const scr = S.screen, out = [], rec = scr === "recording";
  const names = { on: "On what", which: whichName() };
  const back = ICON.back.replace('stroke="#F2EEF8"', 'stroke="#A79FB4"');
  out.push(rec ? `<span class="home off" aria-disabled="true" title="Stop the take first">${back}Music room</span>`
    : `<a class="home" href="${esc(HOME)}" data-home>${back}Music room</a>`);
  const crumb = (label, attrs, cls = "") => rec ? `<span class="chip off${cls}" aria-disabled="true">${label}</span>`
    : `<button type="button" class="chip${cls}" ${attrs}>${label}</button>`;
  out.push(ICON.chev);
  out.push(scr === "board" ? `<span class="chip now" aria-current="page">Exercises</span>` : crumb("Exercises", `data-act="go" data-to="board"`));
  if (scr === "board") return out.join("");
  if (scr === "instrument") return out.concat([ICON.chev, `<span class="chip now" aria-current="page">${esc(kindName(S.kind))}</span>`]).join("");
  STEPS.forEach((s, i) => {
    out.push(ICON.chev);
    const n = i + 1, val = stepValue(s), ok = stepOk(s), long = s === "which" ? stepValue(s, true) : val;
    const label = long !== val && long.startsWith(val) ? `<span class="lbl">${esc(val)}<span class="wide">${esc(long.slice(val.length))}</span></span>` : esc(val);
    if (s === scr) out.push(`<span class="chip now" aria-current="step">${n} ${esc(names[s])}</span>`);
    else if (ok && val) out.push(crumb(`${ICON.check}${label}`, `data-act="step" data-step="${s}"`));
    else if (val && STEPS.slice(0, i).every(stepOk)) out.push(crumb(`<s>${esc(val)}</s> pick again`, `data-act="step" data-step="${s}"`, " again"));
    else out.push(`<span class="chip todo">${n} ${esc(names[s])}</span>`);
  });
  out.push(ICON.chev);
  out.push(scr === "ready" ? `<span class="chip now" aria-current="step">Ready</span>`
    : readyOk() ? crumb("Ready", `data-act="go" data-to="ready"`) : `<span class="chip todo">Ready</span>`);
  if (["record", "recording", "recorded"].includes(scr)) {  // the record screen (Recording: it, recording)
    out.push(ICON.chev);
    out.push(scr === "record" ? `<span class="chip now" aria-current="page">Record</span>`
      : scr === "recording" ? `<span class="chip now" aria-current="page">Recording</span>` : crumb("Record", `data-act="go" data-to="record"`));
  }
  if (scr === "recorded") {
    out.push(ICON.chev);
    out.push(`<span class="chip now" aria-current="page">The take</span>`);
  }
  return out.join("");
}
function devLine() {
  const s = S.status;
  if (!s) return "";
  const ok = s.devices.capture && s.devices.playback;
  return `<span class="dev"><span class="dot${ok ? " on" : ""}"></span>${esc(ok ? s.devices.capture_name : "Mixer not found")}</span>`
    + `<span>${(s.free_mb / 1000).toFixed(1)} GB free</span>`;
}
function leftButton() {
  // walking the steps: the step before (from the first, the board, the choices as they were); a step
  // opened from Ready: back to it as it was (named by what it keeps when this is the step opened)
  const i = STEPS.indexOf(S.screen);
  if (S.walk && i > 0) return `<button type="button" class="btn" data-act="go" data-to="${STEPS[i - 1]}">${ICON.back} Back</button>`;
  if (S.walk) return `<button type="button" class="btn" data-act="restore" data-to="board">${ICON.back} Back</button>`;
  const snap = S.snapshot;
  if (!snap) return "";
  const cur = S.choices;
  S.choices = snap;
  const valid = readyOk();
  const label = S.screen !== S.entry ? "Back to Ready, as it was"
    : S.screen === "on" ? `Keep ${andList(chosen().map((x) => x.the))}` : `Back to Ready, keep ${stepValue("which")}`;
  S.choices = cur;
  return valid ? `<button type="button" class="btn" data-act="restore">${ICON.back} ${esc(label)}</button>` : "";
}

// 1: on what
function renderOn() {
  const ids = C().instruments || [], car = carries();
  const col = (kind) => {
    const known = S.instruments.filter((i) => i.kind === kind);
    if (!known.length) return "";
    const cards = known.map((i) => instCard(i.id, i.short, ids)).join("")
      + (KIND_RE.test(kind) ? instCard(`other:${kind}`, `Another ${kind} (not listed)`, ids, true) : "");
    return `<div class="kind"><span class="label">${esc(kindName(kind))}</span>${cards}</div>`;
  };
  const c0 = C(), e0 = exById(c0.exercise), anyEx = c0.kind === "exercise" && !!e0 && e0.instrument === ANY;
  // kinds the project lists no instrument of: those it has exercises or takes of, for an exercise for any instrument
  // the player's own (SUGGEST), and one typed here (Another kind) once chosen; then something else (no kind: not
  // for an exercise for any instrument, which must say)
  const listed = (k) => S.instruments.some((i) => i.kind === k);
  const unknownKinds = [...new Set(instrumentKinds().concat(anyEx ? SUGGEST : [])
    .concat(ids.filter((id) => id.length > 6 && id.startsWith("other:")).map((id) => id.slice(6))))]
    .filter((k) => !listed(k) && KIND_RE.test(k));
  const other = unknownKinds.map((k) => instCard(`other:${k}`, cap(notListed(k)), ids, true)).join("")
    + (anyEx ? "" : instCard("other:", "Something else", ids, true))
    + `<div class="kindform"><label for="kindIn">Another kind</label><input id="kindIn" type="text" maxlength="30" autocomplete="off"
        autocapitalize="none" placeholder="ukulele" data-kind-in><button type="button" class="btn small" data-act="kind-other">Use it</button></div>`;
  const was = S.snapshot && !S.walk ? (S.snapshot.instruments || []).map(instInfo).filter(Boolean) : [];
  const inputsHtml = S.inputs.slice().sort((a, b) => a.input - b.input).map((inp) => {
    const opts = chosen().map((i) => [i.id, i.short])
      .concat([[inp.for ? "none" : "room", inp.for ? "Not used" : "The room"]]);
    return `<div class="input" role="radiogroup" aria-label="${esc(inputLabel(inp))} carries">
      <div class="row"><span class="name">${esc(inputLabel(inp))}</span><span class="meter" data-meter="${inp.input}"><i></i><b></b></span></div>
      ${inp.details ? `<span class="det">${esc(inp.details)}</span>` : ""}
      ${chosen().length ? `<div class="seg">${opts.map(([v, l]) => `<button type="button" aria-pressed="${car[inp.input] === v}" data-act="carry" data-input="${inp.input}" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
  const open = firstOpen(), c = C(), e = exById(c.exercise), blocked = c.kind === "exercise" ? exerciseBlocked() : "";
  let foot;
  if (!chosen().length) foot = `<span class="hint">${anyEx ? "Choose the one it is played on" : "Choose one or two"}</span>`;
  else if (blocked === "nokind") foot = `<span class="note"><b>${esc(exLabel(e))} is for any instrument, but it needs to know which.</b> Choose one, or name its kind.</span>`;
  else if (blocked === "two" || blocked === "noexercises") {  // an exercise is for one instrument, of a kind with exercises
    const note = blocked === "two" ? `<b>Two instruments:</b> an exercise is for one. Keep one, or record a play-along or free play.`
      : `<b>No exercises for ${esc(chosen()[0].kind ? kindName(chosen()[0].kind).toLowerCase() : "this instrument")} yet.</b> Record a play-along or free play.`;
    const just = blocked === "two" ? chosen().map((i) => `<button type="button" class="btn small outline-p" data-act="just" data-id="${esc(i.id)}">Just ${esc(i.the)}</button>`).join("") : "";
    foot = `<span class="note">${note}</span>${just}<button type="button" class="btn go" data-act="go" data-to="board">Next: what to record ${ICON.next}</button>`;
  } else if (S.walk) foot = `<button type="button" class="btn go" data-act="answered" data-step="on">${c.kind === "free" ? "Next: anything from the speakers" : "Next: which backing"} ${ICON.next}</button>`;
  else {
    const note = open === "which" && c.kind === "exercise" && e ? `<b>${esc(exLabel(e))} is ${article(e.instrument)} ${esc(e.instrument)} exercise.</b> Pick ${article(chosen()[0].kind)} ${esc(chosen()[0].kind)} one next.` : "";
    const label = !open ? (S.toRecord ? "Next: record it" : "Back to Ready") : c.kind === "exercise" ? `Next: ${article(chosen()[0].kind)} ${chosen()[0].kind} exercise` : c.kind === "free" ? "Next: anything from the speakers" : "Next: which backing";
    foot = `${note ? `<span class="note">${note}</span>` : ""}<button type="button" class="btn go" data-act="answered" data-step="on">${esc(label)} ${ICON.next}</button>`;
  }
  const ask = anyEx ? `<h1>What are you playing it on?</h1>
      <p>${esc(exName(e))} is for any instrument, in any key: one the project lists, or any other kind (“a mandolin (not listed)”).${was.length ? ` Until now: ${esc(andList(was.map((i) => i.the)))}.` : ""}</p>`
    : `<h1>What are you recording on?</h1>
      <p>One instrument, or two at once.${was.length ? ` Until now: ${esc(andList(was.map((i) => i.the)))}.` : ""}</p>`;
  return `<div class="body"><div class="q">${ask}</div>
    <div class="on-grid"><div class="kinds">${instrumentKinds().map(col).join("")}${`<div class="kind"><span class="label">${unknownKinds.length > 2 ? "Not listed" : unknownKinds.length ? esc(unknownKinds.map(kindName).join(", ")) + ", other" : "Other"}</span>${other}</div>`}</div>
      <aside class="panel" aria-label="Inputs"><div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px"><h2>Inputs</h2><span class="muted" style="font-size:15px">what each one carries</span></div>
        <div class="inputs">${inputsHtml || '<span class="muted">No input is recorded.</span>'}</div><p class="muted" id="monNote" style="font-size:14px;margin-top:10px"></p>
        <div style="margin-top:10px">${RoomInputs.extras()}</div></aside></div></div>
    <div class="foot">${leftButton()}${foot}</div>`;
}
function instCard(id, label, ids, unlisted = false) {
  const sel = ids.includes(id), was = S.snapshot && !S.walk && (S.snapshot.instruments || []).includes(id) && !sel;
  const ins = sel ? inputsOf(id).map((i) => `In ${i.input}`).join(" + ") : "";
  return `<button type="button" role="checkbox" aria-checked="${sel}" class="card${unlisted ? " unlisted" : ""}${sel ? " sel" : ""}" data-act="inst" data-id="${esc(id)}">
    <span>${esc(label)}</span>${sel ? `<span class="sub"><span>${esc(ins || "no input")}</span>${ICON.boxcheck}</span>` : was ? `<span class="sub">until now</span>` : ""}</button>`;
}
function otherKind() {  // "Another kind": a kind of instrument the project does not list, typed ("mandolin")
  const el = $("[data-kind-in]");
  if (!el) return;
  const k = el.value.trim().toLowerCase().replace(/\s+/g, " ");
  if (!KIND_RE.test(k)) { showError("Name a kind of instrument: letters, digits, spaces and hyphens, starting with a letter (“mandolin”)."); return; }
  showError("");
  const id = `other:${k}`;
  if (C().kind === "exercise") { S.choices.instruments = [id]; S.choices.inputs = defaultInputs(chosen()); save(); render(); }
  else if (!(C().instruments || []).includes(id)) toggleInstrument(id);
}
function toggleInstrument(id) {
  let ids = [...(C().instruments || [])];
  if (ids.includes(id)) ids = ids.filter((x) => x !== id);
  else { ids.push(id); if (ids.length > 2) ids = ids.slice(-2); }
  S.choices.instruments = ids;
  S.choices.inputs = defaultInputs(chosen());
  save(); render();
}

// the board (the index): a column for each instrument with something wanted, of what the project wants (wanted
// again and why, then those with no take yet), and what was recorded here since, waiting for the project to bring
// it in. A tap sets one up (on the instrument of its kind played last) and opens its record screen. Each column
// leads to the instrument's whole list; the instruments with nothing wanted are named at the top.
function boardCard(e) {
  const sel = C().kind === "exercise" && C().exercise === e.id, done = boardGroup(e) === "done";
  const st = done && e.instrument === ANY ? exState(e) : null;  // any instrument's: its take on the instrument in hand
  const info = done ? `<b>Recorded ${esc(when(st ? st.last : e.last_take))}</b> · not in the project yet`
    : `${Math.round(e.tempo.bpm)} bpm · ${e.bars} bars${sel ? " · <b>set up</b>" : ""}`;
  const why = e.status === "wanted" && !done ? `<span class="why">${esc(e.status_note || "Wanted again")}</span>` : "";
  return `<button type="button" class="bcard${sel ? " sel" : ""}${done ? " done" : ""}" data-act="jump" data-id="${esc(e.id)}">
    <span class="num">${esc(exNum(e))}</span><span class="main"><span class="title">${esc(exNum(e) ? shortTitle(e) : e.title)}</span>${why}<span class="info">${info}</span></span></button>`;
}
function renderBoard() {
  const cols = [], idle = [];
  for (const k of kinds()) {
    const all = exercisesFor(k), group = (g) => all.filter((e) => boardGroup(e) === g);
    if (!all.length) continue;
    if (!all.some(onBoard)) { idle.push(k); continue; }
    cols.push({ k, all, wanted: group("wanted"), needed: group("needed"), done: group("done") });
  }
  const chev = ICON.chev.replace('stroke="#7E768B"', 'stroke="#B9A0FF"');
  const col = ({ k, all, wanted, needed, done }) => {
    const n = wanted.length + needed.length;
    // which instrument: of its kind, when the project knows two; any instrument's, the one played on last (a tap asks
    // the first time), and what it still wants on it
    const on = k === ANY ? (lastAny() ? instInfo(lastAny()) : null)
      : S.instruments.filter((i) => i.kind === k).length > 1 ? instInfo(lastInstrument(k)) : null;
    const which = on ? ` · on ${esc(on.the)}` : k === ANY ? " · a tap asks what it is on" : "";
    return `<section class="bcol" aria-label="${esc(kindName(k))}"><div class="bcol-head"><h2>${esc(kindName(k))}</h2>
        <button type="button" class="all" data-act="kind" data-kind="${esc(k)}">All ${all.length}${chev}</button></div>
      <div class="bcol-on">${n ? `<b>${n} to record</b>` : "Nothing to record"}${which}</div>
      <div class="bcol-list">${wanted.length ? `<h3 class="red">Wanted again</h3>${wanted.map(boardCard).join("")}` : ""}
        ${needed.length ? `<h3 class="red">No take yet</h3>${needed.map(boardCard).join("")}` : ""}
        ${done.length ? `<h3>Recorded, to review</h3>${done.map(boardCard).join("")}` : ""}</div></section>`;
  };
  const toRecord = cols.reduce((n, x) => n + x.wanted.length + x.needed.length, 0);
  const updated = S.exercises.map((e) => e.status_updated).filter(Boolean).sort().pop();
  const idleHtml = idle.length ? ` Nothing wanted for ${andList(idle.map((k) => `<button type="button" data-act="kind" data-kind="${esc(k)}">${esc(k === ANY ? `any instrument${anyKind() ? ` on the ${anyKind()}` : ""}` : kindName(k).toLowerCase())}</button>`))}.` : "";
  const nb = S.backings.length, nNew = S.backings.filter(isNew).length;
  const head = `<div class="board-head"><div class="q"><h1>What's wanted</h1>
      <p>${toRecord ? `${toRecord} to record.` : "Nothing to record: every exercise has a good take."}${idleHtml}${updated ? ` <span style="color:var(--faint)">The project's list of ${esc(when(updated))}.</span>` : ""}</p></div>
    <div class="others"><button type="button" class="btn" data-act="start" data-kind="playalong"${nb ? "" : ' disabled style="opacity:.45" title="No backing tracks yet (tools/push-backing)"'}>Play-along${nNew ? ` <span class="pill red">${nNew} new</span>` : ""}</button>
      <button type="button" class="btn" data-act="start" data-kind="free">Free play</button></div></div>`;
  const resume = readyOk() ? `<div class="resume"><span class="label" style="flex:none">As you left it</span><span class="sent">${sentenceHtml()}</span>
      <button type="button" class="btn small outline-p" data-act="go" data-to="record">Back to it ${ICON.next.replace('stroke="#FFFFFF"', 'stroke="#B9A0FF"')}</button></div>` : "";
  const board = !S.exercises.length ? `<p class="board-empty">No exercises on the control unit yet. They come from the project, by tools/push-exercise.</p>`
    : cols.length ? `<div class="board">${cols.map(col).join("")}</div>` : "";
  return `<div class="body board-body">${head}${resume}${board}</div>`;
}

// 3: which exercise
function exRow(e, big) {
  // a tap shows its score (the preview); the one previewed is outlined, the one chosen says so
  const st = exState(e), sel = e.id === C().exercise, pv = e.id === S.preview, nx = nextExercise(), cur = exById(C().exercise);
  const bits = [`${Math.round(e.tempo.bpm)} bpm`, `${e.bars} bars`];
  if (st.key === "review") bits.push(e.to_review === 1 ? `1 new take, ${when(e.last_take)}` : `${e.to_review} new takes, ${when(e.last_take)}`);
  const next = !sel && nx && nx.id === e.id && cur ? ` · <span class="p-ink" style="font-weight:700">next after ${esc(exNum(cur))}</span>` : "";
  const note = st.key === "wanted" && e.status_note ? `<span class="info" style="color:var(--ink)">${esc(e.status_note)}</span>` : "";
  return `<button type="button" class="ex${pv ? " sel" : ""}" data-act="preview" data-id="${esc(e.id)}" aria-pressed="${pv}"${big ? "" : ' style="min-height:72px"'}>
    <span class="num">${esc(exNum(e))}</span><span class="main"><span class="title">${esc(shortTitle(e))}</span>${note}<span class="info">${esc(bits.join(" · "))}${next}</span></span>
    ${sel ? `<span class="now">Chosen${ICON.roundcheck}</span>` : ""}</button>`;
}
function useLabel(e) {  // the button that sets up the exercise previewed (its record screen)
  return `${e.id === C().exercise && C().kind === "exercise" ? "Back to" : "Set up"} ${exLabel(e)}`;
}
function previewHtml(e) {
  if (!e) return `<section class="preview" aria-label="Score"><p class="pv-empty">Tap an exercise to see its score here.</p></section>`;
  const st = exState(e);
  const pages = e.pages.map((_, i) => `<img src="/api/exercises/${encodeURIComponent(e.id)}/pages/${i + 1}" alt="${esc(e.title)}, page ${i + 1}" loading="lazy">`).join("");
  return `<section class="preview${S.previewOpen ? " open" : ""}" role="region" aria-label="The score of ${esc(exName(e))}">
    <div class="pv-head"><button type="button" class="btn small pv-close" data-act="preview-close">${ICON.back} The list</button>
      <div class="pv-t"><span class="num">${esc(exNum(e))}</span><span class="main"><span class="title">${esc(shortTitle(e))}</span>
        <span class="info">${Math.round(e.tempo.bpm)} bpm · ${e.tempo.beats_per_bar}/4 · ${e.bars} bars${e.pages.length > 1 ? ` · ${e.pages.length} pages` : ""} · <span class="${st.key === "good" ? "" : "red-ink"}">${esc(st.label)}</span></span></span></div>
      <button type="button" class="btn go pv-go" data-act="jump" data-id="${esc(e.id)}">${esc(useLabel(e))} ${ICON.next}</button></div>
    <div class="pv-score">${e.pages.length ? pages : '<p class="pv-empty">This exercise has no pages.</p>'}</div></section>`;
}
function renderExercises() {  // an instrument's exercises: what it still wants first, and the score of the one tapped
  const kind = S.kind, all = exercisesFor(kind), numbered = all.filter(exNum), tunes = all.filter((e) => !exNum(e));
  const g = (k) => numbered.filter((e) => exState(e).key === k);
  const wanted = g("wanted"), needed = g("needed"), review = g("review"), good = g("good"), unlisted = g("unlisted");
  // the good ones folded to four when the list is long, the chosen and the previewed one always shown
  const keep = (e) => e.id === C().exercise || e.id === S.preview;
  const shownGood = S.showGood || wanted.length + needed.length + review.length < 4 ? good : good.slice(0, 4).concat(good.slice(4).filter(keep));
  const pv = exById(S.preview);
  const small = (e, label) => `<button type="button" class="${e.id === S.preview ? "sel" : ""}" data-act="preview" data-id="${esc(e.id)}" aria-pressed="${e.id === S.preview}">${label}${e.id === C().exercise ? ICON.check : ""}</button>`;
  const go = !pv ? `<span class="hint">Tap one to see its score</span>`
    : `<button type="button" class="btn go" data-act="jump" data-id="${esc(pv.id)}">${esc(useLabel(pv))} ${ICON.next}</button>`;
  const counts = [numbered.length ? `${numbered.length} exercise${numbered.length > 1 ? "s" : ""}` : "", tunes.length ? `${tunes.length} tune${tunes.length > 1 ? "s" : ""}` : ""].filter(Boolean);
  const anyOn = kind === ANY ? anyKind() : "", forWhat = anyOn ? `the ${anyOn}` : kindWord(kind);
  const lead = kind === ANY ? `${esc(andList(counts))} for any instrument, in any key: what the project wants${anyOn ? ` on the ${esc(anyOn)}` : ""} first. Tap one to see its score.`
    : `${esc(andList(counts))}, what the project wants first. Tap one to see its score.`;
  return `<div class="body pick-body"><div class="q"><h1>${esc(kindName(kind))}</h1><p>${lead}</p></div>
    <div class="pick"><div class="pick-list">
      ${wanted.length ? `<h2 class="red">Wanted again · ${wanted.length}</h2>${wanted.map((e) => exRow(e, true)).join("")}` : `<div class="strip"><b>Wanted again</b> none for ${esc(forWhat)}</div>`}
      ${needed.length ? `<h2 class="red">Needs a take${anyOn ? ` on the ${esc(anyOn)}` : ""} · ${needed.length}</h2>${needed.map((e) => exRow(e, true)).join("")}` : `<div class="strip"><b>Needs a take</b> none for ${esc(forWhat)}</div>`}
      ${review.length ? `<h2>New takes to review · ${review.length}</h2>${review.map((e) => exRow(e)).join("")}` : ""}
      ${good.length ? `<h2>Good · ${good.length}</h2><div class="list">${shownGood.map((e) => small(e, `<span class="n">${esc(exNum(e))}</span><span class="t">${esc(shortTitle(e))}</span><span class="r">${Math.round(e.tempo.bpm)}${e.last_take ? ` · ${esc(when(e.last_take))}` : ""}</span>`)).join("")}
        ${good.length > shownGood.length || (S.showGood && good.length > 4) ? `<button type="button" data-act="show-good"><span class="more">${S.showGood ? "Fewer" : `All ${good.length} good ones`}</span></button>` : ""}</div>` : ""}
      ${tunes.length ? `<h2>Tunes · ${tunes.length}</h2><div class="tunes">${tunes.map((e) => small(e, esc(e.title))).join("")}</div>` : ""}
      ${unlisted.length ? `<h2>Not in the project's list · ${unlisted.length}</h2><div class="list">${unlisted.map((e) => small(e, `<span class="n">${esc(exNum(e))}</span><span class="t">${esc(shortTitle(e))}</span>`)).join("")}</div>` : ""}
    </div>${previewHtml(pv)}</div></div>
    <div class="foot">${go}</div>`;
}

    guide = `<div><span class="k">Backing</span><div class="acts">${hearButton(b)}</div>

// --- the chart heard over the speakers, before a take (Ready, and the record screen): its notes,
// rendered on the desktop when it was pushed, at the score's tempo, with the count-in and the click
// the take will have (Ready's switches). The speakers, not this iPad: the bass's low notes, the
// level the click will have, and a take starting stops it (it cannot end up in one).
function hearChart(e) {
  if (!e.audio || !e.audio.seconds) return `<span class="muted hear-how" title="Push it again (tools/push-exercise) to get its audio">No audio of it yet</span>`;
  const c = C(), bpm = Math.round(e.tempo.bpm), mine = Math.round(tempoOf(e)), pl = S.status && S.status.playing;
  if (pl && pl.exercise === e.id) return `<button type="button" class="hear on" data-act="hear-stop">${ICON.stop} Stop</button>
    <span class="prog" data-prog="exercise:${esc(e.id)}"><span class="bar"><i></i></span><span class="tnum" data-chart-pos>${esc(chartPlace(pl, e))}</span></span>`;
  const how = c.clickThrough ? (c.countIn ? "count-in and click" : "click") : c.countIn ? "count-in" : "";
  return `<button type="button" class="hear" data-act="hear-chart" data-id="${esc(e.id)}">${ICON.play} Hear it</button>
    <span class="muted hear-how">at ${bpm}${mine !== bpm ? ", the score's tempo" : ""}${how ? `, with the ${how}` : ""}</span>`;
}
function chartPlace(pl, e) {  // where the chart is: its count-in, the pickup, the bar and beat
  if (pl.beat0_s == null || !pl.tempo) return "On the speakers";
  const p = position({ backing: { kind: "click", tempo: pl.tempo, beat0_s: pl.beat0_s, position: pl.position } });
  if (!p) return "On the speakers";
  if (p.counting) return `Count-in · ${p.big}`;
  if (p.big === "Pickup") return `Pickup · beat ${p.beat}`;
  return Number(p.big.slice(4)) > e.bars ? "On the speakers" : `${p.big} of ${e.bars} · beat ${p.beat}`;
}

// --- recording: the record screen (the score, the inputs, Record)
function anyPicker() {  // an exercise for any instrument: what it is played on, a tap to change (the ones played on before)
  const cur = chosen().length === 1 ? chosen()[0].id : null, recent = anyRecent();
  const chips = recent.concat(cur && hasKind(cur) && !recent.includes(cur) ? [cur] : []).map((id) => {
    const i = instInfo(id);
    return `<button type="button" class="onpick" aria-pressed="${id === cur}" data-act="any-on" data-id="${esc(id)}">${esc(i.other ? cap(i.kind) : i.short)}${i.other ? " <small>not listed</small>" : ""}</button>`;
  }).join("");
  return `<span class="onpicks" role="group" aria-label="Played on"><span class="k">Played on</span>${chips}
    <button type="button" class="onpick more" data-act="any-other">${recent.length ? "Something else" : "Choose"}</button></span>`;
}
function recSentence(link) {
  const p = sentenceParts(), c = C(), on = onWord(chosen());
  const part = (text, step) => link ? `<button type="button" data-act="step" data-step="${step}">${esc(text)}</button>` : `<b>${esc(text)}</b>`;
  if (c.kind === "playalong") return `Play along with ${part(p.what, "which")}${p.over ? `, ${esc(p.over)}` : ""}, ${on} ${part(p.on, "on")}.`;
  if (c.kind === "free") return `${link ? "Record " : ""}${part(link ? "free play" : "Free play", "board")} ${on} ${part(p.on, "on")}${p.over ? `, with ${part(p.over, "which")}` : ""}.`;
  return `${link ? "Record " : ""}${part(p.what, "which")} ${p.overWord} ${link ? `<button type="button" data-act="go" data-to="ready">${esc(p.over)}</button>` : `<b>${esc(p.over)}</b>`} ${on} ${part(p.on, "on")}.`;
}
function isFree(t) { return t.kind ? t.kind === "free" : !t.exercise && !t.backing; }
function takeOn(t) {  // what a take was played on, short
  const ids = t.instruments ? t.instruments.map((i) => i.instrument_id) : t.instrument_id ? [t.instrument_id] : [];
  return ids.length ? andList(ids.map((id) => (instInfo(id) || { short: id }).short)) : t.instrument_name || "";
}
function takesFor() {  // the takes like the next one: of its exercise, with its backing, or free
  const c = C();
  if (c.kind === "exercise") return S.takes.filter((t) => t.exercise === c.exercise);
  if (c.kind === "playalong") { const b = backingById(c.backing); return S.takes.filter((t) => !t.exercise && b && t.backing === b.title); }
  return S.takes.filter(isFree);
}
function scoreHtml(e, controls) {
  if (!e.pages.length) return `<div class="none">This exercise has no pages.</div>`;
  const pages = e.pages.map((_, i) => `<div class="pg" data-pg="${i}"><img src="/api/exercises/${encodeURIComponent(e.id)}/pages/${i + 1}" alt="${esc(e.title)}, page ${i + 1}"></div>`).join("");
  return (controls ? `<div class="bar"><span class="hear-box">${hearChart(e)}</span><span class="bar-r"><span>${e.pages.length > 1 ? `${e.pages.length} pages` : "1 page"}</span>${e.readme ? `<button type="button" data-act="readme">${S.showReadme ? "Hide the instructions" : "Instructions"}</button>` : ""}</span></div>
    <div class="readme" id="readme" ${S.showReadme ? "" : "hidden"}></div>` : "") + pages;
}
function renderRecord() {
  if (!readyOk()) { S.screen = "ready"; return renderReady(); }
  const c = C(), e = exById(c.exercise), b = backingById(c.backing), mine = takesFor(), s = S.status;
  let meta = "", main;
  if (c.kind === "exercise") {
    const st = exState(e);
    meta = `<span class="pill ${st.key === "good" ? "purple" : "red"}">${esc(st.label)}</span>${st.key === "wanted" && e.status_note ? `<span>${esc(e.status_note)}</span>` : ""}
      <span class="muted">${e.tempo.beats_per_bar}/4 · ${e.bars} bars${e.last_take ? ` · last take ${esc(when(e.last_take))}` : ""}</span>${e.instrument === ANY ? anyPicker() : ""}`;
    main = `<div class="score" data-cursor="${esc(e.id)}">${scoreHtml(e, true)}</div>`;
  } else if (c.kind === "playalong") {
    meta = `<span class="muted">${esc(fmt(b.seconds))}${b.tempo ? ` · ${Math.round(b.tempo.bpm)} bpm` : ""}${b.note ? ` · ${esc(b.note)}` : ""}</span>`;
