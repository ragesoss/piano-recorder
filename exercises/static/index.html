<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercises</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121016">
<style>
/* Two parts: choosing the next take (steps that open on Ready, as you left it) and recording it
   (the record screen, the take, what was just recorded). Dark, with purple as the key color. */
@font-face { font-family: "Bricolage Grotesque"; src: url(/fonts/bricolage-grotesque.woff2) format("woff2");
  font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url(/fonts/public-sans.woff2) format("woff2");
  font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #121016; --surf2: #1E1A24; --surf: #28232F; --line: #3E3748; --line-soft: #2F2A37; --dash: #514960;
  --ink: #F2EEF8; --ink2: #CEC7DA; --ink3: #A79FB4; --faint: #7E768B;
  --purple-fill: #7C3AED; --purple: #8B5CF6; --purple-line: #A78BFA; --purple-ink: #B9A0FF;
  --purple-tint: #33264F; --purple-tint2: #45356A;
  --red: #D42A1F; --red-dot: #FF5147; --red-ink: #FF8F85; --red-tint: #3E1F24;
  --green: #4ADE80; --amber: #E8B93B;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 var(--text); -webkit-tap-highlight-color: transparent;
  overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--purple-ink); }
h1, h2, h3, p { margin: 0; }
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.display { font-family: var(--display); }
.tnum { font-variant-numeric: tabular-nums; }
.svg-i { flex: none; }

/* the top line: where you are, as breadcrumbs (the music room, each step with its choice, Ready, the
   record screen, the take); each one goes back there. While recording they wait for Stop. */
.top { flex: none; min-height: 68px; display: flex; align-items: center; gap: 12px; padding: 8px 24px; }
.top .home { min-height: 44px; display: flex; align-items: center; gap: 6px; color: var(--ink3); font-size: 17px; text-decoration: none; flex: none;
  padding-right: 4px; }
.top .home svg path { stroke: var(--ink3); }
.top .end { flex: none; display: flex; align-items: center; gap: 14px; font-size: 15px; color: var(--ink3); margin-left: auto; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.crumbs .chip { padding: 0 12px; max-width: 230px; }
.crumbs .chip.now { padding: 0 14px; }
.crumbs .chip.todo { padding: 0 8px; }
.crumbs .chip .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.crumbs .chev { color: var(--faint); }
.crumbs .off { opacity: .45; cursor: default; }
.crumbs .chip.off { background: transparent; }
.chip { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 22px; border: 0;
  background: var(--surf2); color: var(--ink); font-size: 16px; font-weight: 600; text-decoration: none; white-space: nowrap;
  max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.chip.now { background: var(--purple-fill); color: #fff; font-size: 17px; font-weight: 700; padding: 0 18px; }
.chip.todo { background: transparent; color: var(--ink3); font-weight: 400; font-size: 17px; padding: 0 10px; }
.chip.again { background: transparent; border: 1.5px dashed var(--red-ink); color: var(--red-ink); font-weight: 700; }
.chip.again s { color: var(--ink3); font-weight: 600; }
.dev { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: var(--green); }
.banner { margin: 0 24px 8px; padding: 12px 16px; border-radius: 14px; background: var(--red-tint); color: var(--ink);
  border: 1.5px solid var(--red-ink); font-size: 16px; display: flex; gap: 12px; align-items: center; }
.banner button { margin-left: auto; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--ink3); background: transparent; }

/* a step: the question, its choices (scrolling), and a footer */
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 40px 20px; }
.foot { flex: none; min-height: 104px; display: flex; align-items: center; gap: 16px; padding: 12px 28px 12px 40px;
  border-top: 1.5px solid var(--line); flex-wrap: wrap; }
.foot .note { flex: 1; min-width: 200px; font-size: 17px; line-height: 1.35; color: var(--ink2); }
.foot .note b { color: var(--ink); }
.foot .hint { margin-left: auto; font-size: 18px; color: var(--ink3); }
.q h1 { font-family: var(--display); font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.q p { margin-top: 6px; font-size: 19px; color: var(--ink3); }
.btn { min-height: 64px; padding: 0 24px; display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--ink2);
  border-radius: 20px; background: transparent; font-size: 19px; font-weight: 700; }
.btn.go { min-height: 76px; padding: 0 30px; border: 0; border-radius: 22px; background: var(--purple-fill); color: #fff;
  font-family: var(--display); font-size: 26px; font-weight: 700; margin-left: auto; }
.btn.go.big { min-height: 92px; padding: 0 36px; border-radius: 26px; font-size: 34px; gap: 16px; }
.btn.go:disabled { background: #2A2531; color: var(--faint); }
.btn.small { min-height: 48px; padding: 0 18px; border-radius: 24px; font-size: 17px; }
.btn.outline-p { border-color: var(--purple); color: var(--purple-ink); }
.pill { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 14px; font-weight: 700; }
.pill.red { background: var(--red-tint); color: var(--red-ink); }
.pill.purple { background: var(--purple-tint); color: var(--purple-ink); }
.label { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); }
.muted { color: var(--ink3); }
.red-ink { color: var(--red-ink); }
.p-ink { color: var(--purple-ink); }

/* 1 on what */
.on-grid { display: grid; grid-template-columns: minmax(0, 1fr) 352px; gap: 28px; margin-top: 18px; align-items: start; }
.kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.kind { display: flex; flex-direction: column; gap: 8px; }
.card { min-height: 80px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surf);
  text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-size: 18px; font-weight: 600; }
.card.sel { border: 2.5px solid var(--purple); background: var(--purple-tint); font-weight: 700; }
.card.unlisted { min-height: 64px; border: 1.5px dashed var(--dash); background: transparent; font-size: 17px; font-weight: 400; color: var(--ink2); }
.card.unlisted.sel { border: 2.5px solid var(--purple); background: var(--purple-tint); color: var(--ink); font-weight: 700; }
.card .sub { font-size: 15px; color: var(--ink3); font-weight: 400; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.card.sel .sub { color: var(--purple-ink); font-weight: 600; }
.panel { background: var(--surf); border: 1.5px solid var(--line); border-radius: 22px; padding: 18px; }
.panel h2 { font-family: var(--display); font-size: 24px; font-weight: 700; }
.inputs { display: flex; flex-direction: column; gap: 14px; }
.input { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line-soft); }
.input:last-child { border-bottom: 0; padding-bottom: 0; }
.input .row { display: flex; align-items: center; gap: 10px; }
.input .name { font-size: 17px; font-weight: 700; width: 144px; flex: none; }
.input .det { font-size: 14px; color: var(--ink3); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 3px; border-radius: 13px; background: var(--surf2); }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-size: 15px; font-weight: 600; padding: 4px 6px; line-height: 1.15; }
.seg button[aria-pressed="true"] { background: var(--purple-fill); color: #fff; font-weight: 700; }
.meter { flex: 1; height: 10px; border-radius: 5px; background: var(--line); position: relative; overflow: hidden; min-width: 60px; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: var(--ink2); transition: width .12s linear; }
.meter > b { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ink); opacity: .8; display: none; }
.meter.big { height: 14px; border-radius: 7px; }

/* 2 what sort */
.sorts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 22px; }
.sort { min-height: 420px; border: 1.5px solid var(--line); border-radius: 26px; background: var(--surf); padding: 26px 24px 22px;
  display: flex; flex-direction: column; gap: 14px; text-align: left; }
.sort.sel { border: 2.5px solid var(--purple); }
.sort.off { border: 1.5px dashed var(--dash); background: var(--surf2); cursor: default; }
.sort .t { font-family: var(--display); font-size: 36px; font-weight: 700; }
.sort.off .t, .sort.off .d { color: var(--ink3); }
.sort .d { font-size: 18px; line-height: 1.4; color: var(--ink2); }
.sort .why { background: var(--surf); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  font-size: 17px; line-height: 1.4; }
.sort .why button { min-height: 48px; padding: 0 16px; border: 1.5px solid var(--purple); border-radius: 14px; background: transparent;
  color: var(--purple-ink); font-size: 17px; font-weight: 700; text-align: left; }
.sort .end { margin-top: auto; font-size: 17px; font-weight: 600; display: flex; gap: 10px; align-items: center; }

/* 3 which exercise */
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col h2 { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin-top: 8px; }
.col h2.red { color: var(--red-ink); }
.strip { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 8px 16px; border-radius: 12px; background: var(--surf2);
  font-size: 16px; color: var(--ink2); }
.strip b { color: var(--ink); }
.ex { min-height: 74px; display: flex; align-items: center; gap: 16px; padding: 8px 18px; border: 1.5px solid var(--line); border-radius: 18px;
  background: var(--surf); text-align: left; width: 100%; }
.ex .num { font-family: var(--display); font-size: 26px; font-weight: 700; width: 54px; flex: none; color: var(--ink3); }
.ex .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ex .title { font-size: 20px; font-weight: 700; }
.ex .info { font-size: 16px; color: var(--ink3); }
.ex.sel { border: 2.5px solid var(--purple); background: var(--purple-tint); }
.ex.sel .num { color: var(--purple-ink); }
.ex.sel .info { color: var(--ink2); }
.ex .now { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--purple-ink); flex: none; }
.list { background: var(--surf); border: 1.5px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; padding: 4px 0; }
.list button { min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--line-soft);
  background: transparent; text-align: left; }
.list button:last-child { border-bottom: 0; }
.list .n { font-weight: 700; width: 36px; color: var(--ink3); flex: none; }
.list .t { flex: 1; font-size: 18px; font-weight: 600; }
.list .r { font-size: 15px; color: var(--ink3); }
.list button.sel { background: var(--purple-tint); }
.list button.sel .n { color: var(--purple-ink); }
.list .more { font-size: 17px; font-weight: 700; color: var(--purple-ink); }
.tunes { display: flex; flex-wrap: wrap; gap: 8px; }
.tunes button { min-height: 48px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 24px; background: var(--surf); font-size: 17px; font-weight: 600; }
.tunes button.sel { border: 2.5px solid var(--purple); background: var(--purple-tint); }
.tunes button, .list button { gap: 8px; }
.tunes button { display: inline-flex; align-items: center; }
/* 3 which exercise: the list, and the score of the one tapped beside it (a sheet over it when narrow) */
.pick-body { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 14px; }
.pick-body > .q { flex: none; }
.pick { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); gap: 24px; margin-top: 16px; }
.pick-list { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding: 0 6px 12px 0; }
.pick-list h2 { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin-top: 8px; }
.pick-list h2:first-child { margin-top: 0; }
.pick-list h2.red { color: var(--red-ink); }
.preview { min-height: 0; display: flex; flex-direction: column; background: var(--surf); border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; }
.pv-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.pv-t { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 14px; }
.pv-t .num { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--purple-ink); flex: none; }
.pv-t .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pv-t .title { font-size: 20px; font-weight: 700; }
.pv-t .info { font-size: 15px; color: var(--ink3); }
.pv-score { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px; }
.pv-score img { display: block; width: 100%; height: auto; filter: invert(0.92); mix-blend-mode: lighten; margin-bottom: 10px; }
.pv-empty { margin: auto; color: var(--ink3); font-size: 19px; padding: 40px 24px; text-align: center; line-height: 1.5; }
.preview .pv-close, .preview .pv-go { display: none; }
.btn.go.pv-go { min-height: 56px; padding: 0 20px; border-radius: 18px; font-size: 20px; }

/* 3 which backing, and the speakers */
.bk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 28px; margin-top: 18px; align-items: start; }
.bk { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border: 1.5px solid var(--line); border-radius: 20px; background: var(--surf); }
.bk.sel { border: 2.5px solid var(--purple); }
.bk .head { display: flex; gap: 10px; align-items: flex-start; }
.bk .head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.bk .t { font-size: 19px; font-weight: 700; line-height: 1.25; }
.bk .i { font-size: 15px; color: var(--ink3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bk .acts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bk .use { margin-left: auto; min-height: 52px; padding: 0 18px; border: 0; border-radius: 16px; background: var(--purple-tint); color: var(--purple-ink); font-size: 17px; font-weight: 700; }
.hear { min-height: 52px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink2); border-radius: 16px;
  background: transparent; font-size: 17px; font-weight: 700; }
.hear.on { border: 0; background: var(--purple-fill); color: #fff; }
.prog { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 4px; }
.prog .bar { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.prog .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--purple); border-radius: 4px; width: 0; }
.prog span { font-size: 14px; color: var(--ink2); }
.switch { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px;
  border: 1.5px solid var(--line); border-radius: 16px; background: transparent; font-size: 17px; text-align: left; }
.switch .track { width: 52px; height: 30px; border-radius: 15px; background: var(--line); display: flex; padding: 3px; flex: none; }
.switch .track i { width: 24px; height: 24px; border-radius: 12px; background: #fff; }
.switch[aria-checked="true"] .track { background: var(--purple); justify-content: flex-end; }
.speakers { border: 2.5px solid var(--ink2); border-radius: 24px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--surf); }
.speakers .lv { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1; }
.speakers .lv small { font-size: 26px; }
.speakers .pm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.speakers .pm button { min-height: 60px; border: 1.5px solid var(--line); border-radius: 16px; background: transparent; font-size: 28px; }
input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: var(--purple); }
.scale { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink3); }

/* 3 free play */
.fr-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 20px; margin-top: 22px; }
.fr { border: 1.5px solid var(--line); border-radius: 26px; background: var(--surf); padding: 26px; display: flex; flex-direction: column; gap: 16px; text-align: left; }
.fr.sel { border: 2.5px solid var(--purple); }
.fr .t { font-family: var(--display); font-size: 40px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
.fr .d { font-size: 19px; line-height: 1.4; color: var(--ink2); }
.radio { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink3); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.sel .radio { border-color: var(--purple); }
.sel .radio::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--purple); }
.bpm { display: flex; align-items: center; gap: 14px; }
.bpm button { width: 64px; height: 64px; flex: none; border: 1.5px solid var(--line); border-radius: 32px; background: transparent; font-size: 30px; }
.bpm .bv { flex: 1; text-align: center; font-family: var(--display); font-size: 56px; font-weight: 700; white-space: nowrap; }
.bpm .bv small { font-size: 22px; font-weight: 600; }
.bpm.sm button { width: 56px; height: 56px; font-size: 26px; }
.bpm.sm .bv { flex: none; min-width: 128px; font-size: 36px; }
.bpm.sm .bv small { font-size: 18px; }
.kv { display: flex; align-items: center; gap: 14px; }
.kv > span { font-size: 18px; font-weight: 600; width: 130px; flex: none; }
.kv .seg { flex: 1; }

/* ready */
.ready-body { padding-top: 22px; display: flex; flex-direction: column; gap: 16px; }
.ready-body > * { flex-shrink: 0; }
.sentence { font-family: var(--display); font-size: 31px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.2; }
.sentence b { font-weight: 700; }
.ornext { display: flex; align-items: center; gap: 18px; min-height: 68px; padding: 8px 12px 8px 22px; border-radius: 18px; background: var(--surf2); flex-wrap: wrap; }
.rows { background: var(--surf); border: 1.5px solid var(--line); border-radius: 22px; display: flex; flex-direction: column; }
.rows > div { display: flex; align-items: center; gap: 18px; min-height: 84px; padding: 10px 22px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.rows > div:last-child { border-bottom: 0; }
.rows .k { width: 120px; flex: none; font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
.rows .v { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 3px; }
.rows .v .big { font-size: 21px; font-weight: 700; }
.rows .v .sm { font-size: 16px; color: var(--ink3); }
.rows .change { min-height: 44px; display: flex; align-items: center; padding: 0 8px; color: var(--purple-ink); font-size: 17px; font-weight: 700;
  background: transparent; border: 0; text-decoration: underline; text-underline-offset: 3px; }
.ins-line { display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--ink2); flex-wrap: wrap; }
.ins-line b { color: var(--ink); }
.ins-line .meter { flex: none; width: 150px; }
.toggles { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.hear-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.hear-box .prog { min-width: 180px; }
.hear-how { font-size: 15px; }

/* recording: the record screen, the take, what was just recorded */
.rec-head { flex: none; padding: 4px 40px 0; display: flex; flex-direction: column; gap: 10px; }
.rec-head .sentence { font-size: 44px; line-height: 1.25; font-weight: 500; }
.rec-head .sentence button { font: inherit; font-weight: 700; color: var(--purple-ink); background: var(--purple-tint); border: 0;
  border-radius: 14px; padding: 0 12px; margin: 2px 0; }

function nextExercise() {  // after this one: the next the project still wants
  const e = exById(C().exercise);
  if (!e || !exNum(e)) return null;
  const list = exercisesFor(e.instrument).filter(exNum);
  return list.find((x) => exNum(x) > exNum(e) && todo(x)) || list.find((x) => x.id !== e.id && todo(x)) || null;

// backings: newest first; one pushed in the last three days is new
function backingById(id) { return S.backings.find((b) => b.id === id) || null; }
function backingsNewest() { return [...S.backings].sort((a, b) => (b.added || "").localeCompare(a.added || "")); }
function isNew(b) {
  const last = S.takes.find((t) => t.kind ? t.kind === "playalong" : !t.exercise && t.backing);
  return !!b.added && (last ? b.added > last.started : Date.now() - new Date(b.added).getTime() < 3 * 86400e3);
}

// the inputs: what each carries (an instrument's id, "room" or "none"); by default a pickup the
// instrument of its kind, a room mic the one instrument without a pickup of its own (else the room)
function defaultInputs(insts) {
  const pickedUp = new Set(S.inputs.filter((i) => i.for).map((i) => i.for));
  const unheard = insts.filter((i) => !pickedUp.has(i.kind));
  const out = {};
  for (const inp of S.inputs) {
    if (inp.for) { const m = insts.find((i) => i.kind === inp.for); out[inp.input] = m ? m.id : "none"; }
    else out[inp.input] = unheard.length === 1 ? unheard[0].id : "room";
  }

}

  const ids = new Set(chosen().map((i) => i.id)), def = defaultInputs(chosen()), out = {};
  for (const inp of S.inputs) {
    const v = (C().inputs || {})[inp.input];
    out[inp.input] = v && (ids.has(v) || v === (inp.for ? "none" : "room")) ? v : def[inp.input];
  }

}
function inputsOf(id) { const c = carries(); return S.inputs.filter((i) => c[i.input] === id).sort((a, b) => a.input - b.input); }
function inputLabel(i) { return `In ${i.input} · ${i.name}`; }

// --- the steps, and whether each is answered
const STEPS = ["on", "sort", "which"];
function exerciseBlocked() {  // why an exercise cannot be the next take, or ""
  const ins = chosen();
  if (ins.length > 1) return "two";
  if (!ins.length) return "none";
  if (!ins[0].kind || !exercisesFor(ins[0].kind).length) return "noexercises";
  return "";
}
function stepOk(step) {

  if (step === "sort") return c.kind === "free" || (c.kind === "playalong" && S.backings.length > 0) || (c.kind === "exercise" && !exerciseBlocked());
  if (step === "which") {
    if (c.kind === "exercise") { const e = exById(c.exercise); return !!e && !exerciseBlocked() && (e.instrument || "") === chosen()[0].kind; }
    if (c.kind === "playalong") return !!backingById(c.backing);

  }

}
function firstOpen() { return STEPS.find((s) => !stepOk(s)) || null; }
function readyOk() { return !firstOpen(); }
function whichName() {
  const k = C().kind;
  return k === "exercise" ? "Which one" : k === "playalong" ? "Which backing" : k === "free" ? "From the speakers" : "Then";
}
function stepValue(step, long) {  // a step's answer, short, for its chip (long: an exercise's number and title)
  const c = C();
  if (step === "on") return chosen().map((i) => i.short).join(" + ");
  if (step === "sort") return { exercise: "Exercise", playalong: "Play-along", free: "Free play" }[c.kind] || "";
  const e = exById(c.exercise), b = backingById(c.backing);
  if (c.kind === "exercise") return e ? (long && exNum(e) ? `${exNum(e)} ${shortTitle(e)}` : exNum(e) || shortTitle(e)) : "";
  if (c.kind === "playalong") return b ? b.title : "";
  return c.freeClick ? `Click at ${c.freeBpm}` : "Nothing";
}

// --- the next take in words: what, over what, on what
function sentenceParts() {
  const c = C(), ins = chosen(), on = andList(ins.map((i) => i.the));
  if (c.kind === "exercise") {
    const e = exById(c.exercise), bpm = e ? Math.round(tempoOf(e)) : 0;
    const over = c.clickThrough ? `the click at ${bpm}` + (c.countIn ? "" : ", no count-in")
      : c.countIn ? `a bar's count-in at ${bpm}, then no click` : "nothing";
    return { what: e ? exName(e) : "an exercise", lead: "", over, overWord: c.clickThrough || c.countIn ? "over" : "with", on };
  }
  if (c.kind === "playalong") {
    const b = backingById(c.backing);
    return { what: b ? b.title : "a backing", lead: "Along with", over: b && b.tempo && c.backingCountIn ? "its count-in first" : "", on };
  }

}
function sentenceHtml() {
  const p = sentenceParts(), c = C();
  if (c.kind === "playalong") return `Along with <b>${esc(p.what)}</b>${p.over ? `, ${esc(p.over)}` : ""}, on ${esc(p.on)}`;
  if (c.kind === "free") return `<b>Free play</b> on ${esc(p.on)}${p.over ? `, with ${esc(p.over)}` : ""}`;
  return `<b>${esc(p.what)}</b>, ${p.overWord} ${esc(p.over)}, on ${esc(p.on)}`;

// --- talking to the control unit
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body !== undefined ? { "Content-Type": "application/json" } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    let msg = `${r.status}`;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
function showError(msg) { S.error = msg || ""; $("#errorText").textContent = S.error; $("#error").hidden = !S.error; }
async function act(fn) { try { showError(""); await fn(); } catch (e) { showError(e.message); } poll(true); }
let saveTimer = null;
function save() {  // the choices, on the control unit (a moment after the last change)
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => api("PUT", "/api/choices", C()).catch(() => {}), 400);
}
function set(changes) { Object.assign(S.choices, changes); save(); render(); }

async function loadAll() {
  const [ex, inst, bk, inputs, choices, takes] = await Promise.all([api("GET", "/api/exercises"), api("GET", "/api/instruments"),
    api("GET", "/api/backings"), api("GET", "/api/inputs"), S.choices ? null : api("GET", "/api/choices"), api("GET", "/api/takes")]);
  S.exercises = ex; S.instruments = inst; S.backings = bk; S.inputs = inputs; S.takes = takes;
  if (choices) {
    S.choices = { ...DEFAULTS, ...choices, tempo: { ...(choices.tempo || {}) } };
    if (!S.choices.instruments.length) fromLastTake();
  }
}
function fromLastTake() {  // no choices saved yet: start from the newest take, if any
  const t = S.takes[0];
  if (!t) return;
  const ids = (t.instruments || []).map((i) => i.instrument_id).concat(t.instruments ? [] : t.instrument_id ? [t.instrument_id] : []);
  Object.assign(S.choices, { instruments: ids.filter((i) => instInfo(i)),
    kind: t.exercise ? "exercise" : t.backing ? "playalong" : "free", exercise: t.exercise || null });
  if (t.backing) { const b = S.backings.find((x) => x.title === t.backing); if (b) S.choices.backing = b.id; }
}

// --- the screens
const screenEl = () => $("#screen");
function render() {
  const keep = $$(".body, .score, .takes, .take-card, .live").map((el) => el.scrollTop);
  const scr = S.screen;
  $("#crumbs").innerHTML = crumbsNav();
  const cr = $("#crumbs"); if (cr.scrollWidth > cr.clientWidth) cr.scrollLeft = cr.scrollWidth;  // a phone: where you are
  if (scr === "on") screenEl().innerHTML = renderOn();
  else if (scr === "sort") screenEl().innerHTML = renderSort();
  else if (scr === "which") screenEl().innerHTML = C().kind === "exercise" ? renderExercises() : C().kind === "playalong" ? renderBackings() : renderFree();
  else if (scr === "ready") screenEl().innerHTML = renderReady();
  else if (scr === "record") screenEl().innerHTML = renderRecord();
  else if (scr === "recording") screenEl().innerHTML = renderRecording();
  else if (scr === "recorded") screenEl().innerHTML = renderRecorded();
  $$(".body, .score, .takes, .take-card, .live").forEach((el, i) => { if (keep[i]) el.scrollTop = keep[i]; });
  if (scr === "record" && S.showReadme) loadReadme();

}
function go(screen, opts = {}) {
  if (STEPS.includes(screen) && !STEPS.includes(S.screen)) { S.snapshot = JSON.parse(JSON.stringify(C())); S.entry = screen; }
  if (opts.walk !== undefined) S.walk = opts.walk;
  if (screen === "ready" || screen === "record") S.walk = false;
  const from = S.screen;
  S.screen = screen;
  S.sheet = false; $("#sheet").hidden = true;
  if (screen !== "which") S.showGood = false;
  if (screen === "which" && from !== "which") previewChosen();
  const pl = S.status && S.status.playing;
  if (pl && pl.exercise && !["ready", "record"].includes(screen)) api("POST", "/api/stop").catch(() => {});  // its Stop is not there
  if (screen === "which" && C().kind === "playalong" && !backingById(C().backing) && S.backings.length) {
    S.choices.backing = backingsNewest()[0].id; save();  // the newest, to hear first
  }
  render();
  const b = $(".body"); if (b && !opts.keepScroll) b.scrollTop = 0;

}
function previewChosen() {  // the picker's score, first: the exercise chosen, if it is of the instrument's kind
  const e = exById(C().exercise);

  S.previewOpen = false;
}
function answered(step) {  // a step's choice made: on to the next step, or back to Ready

function crumbsNav() {
  // the music room, then each step with its choice (or what is still to choose), Ready, and past
  // it the record screen and the take. Each goes back to that step with the choices kept; while a
  // take records they are not links (Stop first: a free take would go on with no one to stop it).
  const scr = S.screen, out = [], rec = scr === "recording";
  const names = { on: "On what", sort: "What sort", which: whichName() };
  const back = ICON.back.replace('stroke="#F2EEF8"', 'stroke="#A79FB4"');
  out.push(rec ? `<span class="home off" aria-disabled="true" title="Stop the take first">${back}Music room</span>`
    : `<a class="home" href="${esc(HOME)}" data-home>${back}Music room</a>`);
  const crumb = (label, attrs, cls = "") => rec ? `<span class="chip off${cls}" aria-disabled="true">${label}</span>`
    : `<button type="button" class="chip${cls}" ${attrs}>${label}</button>`;

  if (["record", "recording", "recorded"].includes(scr)) {  // the record screen (Recording: it, recording)

    <div class="foot">${leftButton()}<span class="hint">Tap one to go on</span></div>`;
}

// 3: which exercise
function exRow(e, big) {
  // a tap shows its score (the preview); the one previewed is outlined, the one chosen says so
  const st = exState(e), sel = e.id === C().exercise, pv = e.id === S.preview, nx = nextExercise(), cur = exById(C().exercise);
  const bits = [`${Math.round(e.tempo.bpm)} bpm`, `${e.bars} bars`];
  if (st.key === "review") bits.push(e.to_review === 1 ? `1 new take, ${when(e.last_take)}` : `${e.to_review} new takes, ${when(e.last_take)}`);
  const next = !sel && nx && nx.id === e.id && cur ? ` · <span class="p-ink" style="font-weight:700">next after ${esc(exNum(cur))}</span>` : "";
  const note = st.key === "wanted" && e.status_note ? `<span class="info" style="color:var(--ink)">${esc(e.status_note)}</span>` : "";
  return `<button type="button" class="ex${pv ? " sel" : ""}" data-act="preview" data-id="${esc(e.id)}" aria-pressed="${pv}"${big ? "" : ' style="min-height:72px"'}>
    <span class="num">${esc(exNum(e))}</span><span class="main"><span class="title">${esc(shortTitle(e))}</span>${note}<span class="info">${esc(bits.join(" · "))}${next}</span></span>
    ${sel ? `<span class="now">Chosen${ICON.roundcheck}</span>` : ""}</button>`;
}
function useLabel(e) {  // the button that takes the exercise previewed on
  return S.walk ? `Next: ready, with ${exNum(e) || shortTitle(e)}` : e.id === C().exercise ? `Keep ${exNum(e) || shortTitle(e)}: back to Ready`
    : `Use ${exNum(e) || shortTitle(e)}: back to Ready`;
}
function previewHtml(e) {
  if (!e) return `<section class="preview" aria-label="Score"><p class="pv-empty">Tap an exercise to see its score here.</p></section>`;
  const st = exState(e);
  const pages = e.pages.map((_, i) => `<img src="/api/exercises/${encodeURIComponent(e.id)}/pages/${i + 1}" alt="${esc(e.title)}, page ${i + 1}" loading="lazy">`).join("");
  return `<section class="preview${S.previewOpen ? " open" : ""}" role="region" aria-label="The score of ${esc(exName(e))}">
    <div class="pv-head"><button type="button" class="btn small pv-close" data-act="preview-close">${ICON.back} The list</button>
      <div class="pv-t"><span class="num">${esc(exNum(e))}</span><span class="main"><span class="title">${esc(shortTitle(e))}</span>
        <span class="info">${Math.round(e.tempo.bpm)} bpm · ${e.tempo.beats_per_bar}/4 · ${e.bars} bars${e.pages.length > 1 ? ` · ${e.pages.length} pages` : ""} · <span class="${st.key === "good" ? "" : "red-ink"}">${esc(st.label)}</span></span></span></div>
      <button type="button" class="btn go pv-go" data-act="exercise" data-id="${esc(e.id)}">${esc(useLabel(e))} ${ICON.next}</button></div>
    <div class="pv-score">${e.pages.length ? pages : '<p class="pv-empty">This exercise has no pages.</p>'}</div></section>`;
}
function renderExercises() {
  const kind = chosen()[0].kind, all = exercisesFor(kind), numbered = all.filter(exNum), tunes = all.filter((e) => !exNum(e));
  const g = (k) => numbered.filter((e) => exState(e).key === k);
  const wanted = g("wanted"), needed = g("needed"), review = g("review"), good = g("good");
  // the good ones folded to four when the list is long, the chosen and the previewed one always shown
  const keep = (e) => e.id === C().exercise || e.id === S.preview;
  const shownGood = S.showGood || wanted.length + needed.length + review.length < 4 ? good : good.slice(0, 4).concat(good.slice(4).filter(keep));
  const pv = exById(S.preview);
  const small = (e, label) => `<button type="button" class="${e.id === S.preview ? "sel" : ""}" data-act="preview" data-id="${esc(e.id)}" aria-pressed="${e.id === S.preview}">${label}${e.id === C().exercise ? ICON.check : ""}</button>`;
  const left = leftButton();
  const go = !pv ? `<span class="hint">Tap one to see its score</span>`
    : pv.id === C().exercise && left && !S.walk ? `<span class="hint">Tap another to see its score</span>`
    : `<button type="button" class="btn go" data-act="exercise" data-id="${esc(pv.id)}">${esc(useLabel(pv))} ${ICON.next}</button>`;
  return `<div class="body pick-body"><div class="q"><h1>Which exercise?</h1><p>${esc(kindName(kind))}, in the order the project wants them. Tap one to see its score.</p></div>
    <div class="pick"><div class="pick-list">
      ${wanted.length ? `<h2 class="red">Wanted again · ${wanted.length}</h2>${wanted.map((e) => exRow(e, true)).join("")}` : `<div class="strip"><b>Wanted again</b> none for ${esc(kind)}</div>`}
      ${needed.length ? `<h2 class="red">Needs a take · ${needed.length}</h2>${needed.map((e) => exRow(e, true)).join("")}` : `<div class="strip"><b>Needs a take</b> none for ${esc(kind)}</div>`}
      ${review.length ? `<h2>New takes to review · ${review.length}</h2>${review.map((e) => exRow(e)).join("")}` : ""}
      ${good.length ? `<h2>Good · ${good.length}</h2><div class="list">${shownGood.map((e) => small(e, `<span class="n">${esc(exNum(e))}</span><span class="t">${esc(shortTitle(e))}</span><span class="r">${Math.round(e.tempo.bpm)}${e.last_take ? ` · ${esc(when(e.last_take))}` : ""}</span>`)).join("")}
        ${good.length > shownGood.length || (S.showGood && good.length > 4) ? `<button type="button" data-act="show-good"><span class="more">${S.showGood ? "Fewer" : `All ${good.length} good ones`}</span></button>` : ""}</div>` : ""}
      ${tunes.length ? `<h2>Tunes · ${tunes.length}</h2><div class="tunes">${tunes.map((e) => small(e, esc(e.title))).join("")}</div>` : ""}
    </div>${previewHtml(pv)}</div></div>
    <div class="foot">${left}${go}</div>`;
}

function bpmControl(value, act, small) {

// Ready: the next take, as left; one tap to record it, or to change one thing

      <div class="toggles"><button type="button" class="switch" role="switch" aria-checked="${!!c.countIn}" data-act="toggle" data-k="countIn">Count-in<span class="track"><i></i></span></button>
        <button type="button" class="switch" role="switch" aria-checked="${!!c.clickThrough}" data-act="toggle" data-k="clickThrough">Click all through<span class="track"><i></i></span></button></div></div>`;
  } else if (c.kind === "playalong") {
    what = `<span class="big">${esc(b.title)}</span><span class="sm">Play-along · ${esc(fmt(b.seconds))}${b.tempo ? ` · ${Math.round(b.tempo.bpm)} bpm` : ""} · added ${esc(when(b.added))}</span>`;
    guide = `<div><span class="k">Backing</span><div class="acts">${hearButton(b)}</div>
      ${b.tempo ? `<div class="toggles"><button type="button" class="switch" role="switch" aria-checked="${!!c.backingCountIn}" data-act="toggle" data-k="backingCountIn">Count-in from the backing<span class="track"><i></i></span></button></div>` : `<span class="muted">No count-in: its tempo is not known</span>`}</div>`;
  } else {

    guide = `<div><span class="k">Click</span><div class="seg" style="min-width:240px"><button type="button" aria-pressed="${!c.freeClick}" data-act="free-click" data-v="0">Nothing</button><button type="button" aria-pressed="${!!c.freeClick}" data-act="free-click" data-v="1">A click</button></div>
      ${c.freeClick ? `${bpmControl(c.freeBpm, "free-bpm", true)}<div style="min-width:200px">${bpbSeg(c.freeBpb)}</div>
        <button type="button" class="switch" role="switch" aria-checked="${!!c.freeCountIn}" data-act="toggle" data-k="freeCountIn">Count-in<span class="track"><i></i></span></button>` : ""}</div>`;
  }
  const car = carries(), used = S.inputs.slice().sort((a, x) => a.input - x.input);
  const unused = used.filter((i) => car[i.input] === "none");
  const onLines = chosen().map((i) => `<span class="ins-line"><b>${esc(i.short)}</b>${inputsOf(i.id).map((x) => `<span>In ${x.input} ${esc(x.name)}</span><span class="meter" data-meter="${x.channel}"><i></i><b></b></span>`).join("") || '<span class="red-ink">no input carries it</span>'}</span>`).join("");
  const room = used.filter((i) => car[i.input] === "room").map((x) => `<span class="ins-line"><span>In ${x.input} ${esc(x.name)}: the room</span><span class="meter" data-meter="${x.channel}"><i></i><b></b></span></span>`).join("");
  const level = S.status ? S.status.level_offset_db : 0;

      ${guide}
      <div><span class="k">On</span><span class="v" style="gap:6px">${onLines}${room}${unused.length ? `<span class="muted" style="font-size:15px">${esc(andList(unused.map((x) => `In ${x.input} ${x.name}`)))} not used</span>` : ""}</span><button type="button" class="change" data-act="step" data-step="on">Change</button></div>
      <div style="min-height:76px"><label class="k" for="readyLevel">Speakers</label><input id="readyLevel" type="range" min="-30" max="12" step="1" value="${level}" data-level style="flex:1;min-width:200px"><span data-level-text class="tnum" style="font-size:19px;font-weight:700;width:76px;text-align:right">${esc(dbText(level))}</span></div>
    </div>
    <p class="muted" id="monNote" style="font-size:14px"></p>
  </div>
  <div class="foot"><button type="button" class="btn" data-act="start-over">${ICON.restart} Start from the top</button>
    <button type="button" class="btn go big" data-act="go" data-to="record"><svg class="svg-i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FF5147" stroke="#FFFFFF" stroke-width="2"></circle></svg> Ready to record ${ICON.next}</button></div>`;
}

// --- the chart heard over the speakers, before a take (Ready, and the record screen): its notes,
// rendered on the desktop when it was pushed, at the score's tempo, with the count-in and the click
// the take will have (Ready's switches). The speakers, not this iPad: the bass's low notes, the
// level the click will have, and a take starting stops it (it cannot end up in one).
function hearChart(e) {
  if (!e.audio || !e.audio.seconds) return `<span class="muted hear-how" title="Push it again (tools/push-exercise) to get its audio">No audio of it yet</span>`;
  const c = C(), bpm = Math.round(e.tempo.bpm), mine = Math.round(tempoOf(e)), pl = S.status && S.status.playing;
  if (pl && pl.exercise === e.id) return `<button type="button" class="hear on" data-act="hear-stop">${ICON.stop} Stop</button>
    <span class="prog" data-prog="exercise:${esc(e.id)}"><span class="bar"><i></i></span><span class="tnum" data-chart-pos>${esc(chartPlace(pl, e))}</span></span>`;
  const how = c.clickThrough ? (c.countIn ? "count-in and click" : "click") : c.countIn ? "count-in" : "";
  return `<button type="button" class="hear" data-act="hear-chart" data-id="${esc(e.id)}">${ICON.play} Hear it</button>
    <span class="muted hear-how">at ${bpm}${mine !== bpm ? ", the score's tempo" : ""}${how ? `, with the ${how}` : ""}</span>`;
}
function chartPlace(pl, e) {  // where the chart is: its count-in, the pickup, the bar and beat
  if (pl.beat0_s == null || !pl.tempo) return "On the speakers";
  const p = position({ backing: { kind: "click", tempo: pl.tempo, beat0_s: pl.beat0_s, position: pl.position } });
  if (!p) return "On the speakers";
  if (p.counting) return `Count-in · ${p.big}`;
  if (p.big === "Pickup") return `Pickup · beat ${p.beat}`;
  return Number(p.big.slice(4)) > e.bars ? "On the speakers" : `${p.big} of ${e.bars} · beat ${p.beat}`;
}

// --- recording: the record screen (the score, the inputs, Record)
function recSentence(link) {
  const p = sentenceParts(), c = C();
  const part = (text, step) => link ? `<button type="button" data-act="step" data-step="${step}">${esc(text)}</button>` : `<b>${esc(text)}</b>`;
  if (c.kind === "playalong") return `Play along with ${part(p.what, "which")}${p.over ? `, ${esc(p.over)}` : ""}, on ${part(p.on, "on")}.`;
  if (c.kind === "free") return `${link ? "Record " : ""}${part(link ? "free play" : "Free play", "sort")} on ${part(p.on, "on")}${p.over ? `, with ${part(p.over, "which")}` : ""}.`;
  return `${link ? "Record " : ""}${part(p.what, "which")} ${p.overWord} ${link ? `<button type="button" data-act="go" data-to="ready">${esc(p.over)}</button>` : `<b>${esc(p.over)}</b>`} on ${part(p.on, "on")}.`;
}
function isFree(t) { return t.kind ? t.kind === "free" : !t.exercise && !t.backing; }
function takeOn(t) {  // what a take was played on, short
  const ids = t.instruments ? t.instruments.map((i) => i.instrument_id) : t.instrument_id ? [t.instrument_id] : [];
  return ids.length ? andList(ids.map((id) => (instInfo(id) || { short: id }).short)) : t.instrument_name || "";
}
function takesFor() {  // the takes like the next one: of its exercise, with its backing, or free
  const c = C();
  if (c.kind === "exercise") return S.takes.filter((t) => t.exercise === c.exercise);
  if (c.kind === "playalong") { const b = backingById(c.backing); return S.takes.filter((t) => !t.exercise && b && t.backing === b.title); }
  return S.takes.filter(isFree);
}
function scoreHtml(e, controls) {

function position(rec) {  // where the player is: {big, of, beat, beats, counting}
  const bk = rec && rec.backing;
  if (!bk) return null;
  if (bk.kind === "backing") {
    if (bk.tempo && bk.position < bk.count_in_s) return { big: String(Math.max(1, Math.ceil((bk.count_in_s - bk.position) / (60 / bk.tempo.bpm) - 0.02))), counting: true };
    return null;
  }
  if (!bk.tempo || bk.beat0_s == null) return null;
  const spb = 60 / bk.tempo.bpm, bpb = bk.tempo.beats_per_bar || 4, pickup = bk.tempo.pickup_beats || 0;
  const beat = (bk.position - bk.beat0_s) / spb, fromBar1 = beat - pickup;
  const startsAt = pickup > 0 ? -bpb * Math.ceil(pickup / bpb - 1e-9) : 0;
  if (fromBar1 < startsAt - 0.02) return { big: String(Math.ceil(startsAt - fromBar1 - 0.02)), counting: true, beats: bpb };
  const inBar = (x) => Math.floor(x + 1e-6) + 1;
  if (beat < -0.02) return { big: "Pickup", beat: inBar(fromBar1 - startsAt), beats: bpb };

  return { big: `Bar ${bar}`, beat: inBar(fromBar1 - (bar - 1) * bpb), beats: bpb };
}

// the exercise's README as HTML: headings, paragraphs, lists, tables, code; every bit of text escaped
function inline(s) {
  return s.split(/(`[^`]+`)/).map((part) => /^`[^`]+`$/.test(part) ? `<code>${esc(part.slice(1, -1))}</code>`
    : esc(part).replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")).join("");
}
const LIST = /^\s*([-*]|\d+\.)\s+(.*)$/, BLOCK = /^(#{1,6}\s|```|\s*\||\s*([-*]|\d+\.)\s)/;
function markdown(text) {
  const lines = text.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (/^#\s/.test(lines[i] || "")) i++;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (/^```/.test(line)) {
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) { const n = Math.min(h[1].length + 1, 4); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) {
        if (/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i])) continue;
        rows.push(lines[i].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim())));
      }
      out.push("<table>" + rows.map((r, n) => "<tr>" + r.map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    const li = LIST.exec(line);
    if (li) {
      const ordered = /\d/.test(li[1]), items = [];
      while (i < lines.length) {
        const m = LIST.exec(lines[i]);
        if (m && /\d/.test(m[1]) === ordered) items.push(m[2]);
        else if (items.length && /^\s+\S/.test(lines[i]) && !m) items[items.length - 1] += " " + lines[i].trim();
        else break;
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((x) => `<li>${inline(x)}</li>`).join("") + `</${tag}>`);
      continue;
    }
    const buf = [];
    for (; i < lines.length && lines[i].trim() && !BLOCK.test(lines[i]); i++) buf.push(lines[i].trim());
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}

async function wakeLock(on) {  // the screen stays on while recording (where the browser can)
  try {
    if (on && "wakeLock" in navigator && !lock) lock = await navigator.wakeLock.request("screen");
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; }
}

// --- the status, often while something happens
let pollTimer = null, takesVersion = -1, dragging = false, lastTouch = Date.now(), monitorAt = 0;
const LISTEN_IDLE_MS = 10 * 60e3;  // the inputs are listened to until the page has been left alone this long
function listening() { return !document.hidden && Date.now() - lastTouch < LISTEN_IDLE_MS; }
function monitorTick() {
  const s = S.status;
  if (!s || s.recording || !["on", "ready", "record"].includes(S.screen) || !listening()) return;
  if (Date.now() - monitorAt < 2000) return;
  monitorAt = Date.now();
  api("POST", "/api/monitor").catch(() => {});
}
async function poll(once) {
  clearTimeout(pollTimer);
  let s;
  try { s = await api("GET", "/api/status"); } catch (e) { s = null; }
  if (s) {
    const prev = S.status; S.status = s;
    if ($("#end").textContent) $("#end").innerHTML = "";
    if (s.error && s.error !== S.lastServerError) { S.lastServerError = s.error; showError(s.error); }
    if (s.recording && S.screen !== "recording") { recordingId = s.recording.take; S.screen = "recording"; render(); wakeLock(true); }
    else if (!s.recording && S.screen === "recording") {
      S.take = recordingId || (prev && prev.recording && prev.recording.take); S.screen = "recorded"; wakeLock(false);
      await refresh(); render();
    }
    if (s.takes_version !== takesVersion) {
      const first = takesVersion < 0; takesVersion = s.takes_version;
      if (!first) { await refresh(); if (S.screen !== "recording") render(); }
    } else if (prev && JSON.stringify(prev.playing && [prev.playing.take, prev.playing.backing, prev.playing.exercise]) !== JSON.stringify(s.playing && [s.playing.take, s.playing.backing, s.playing.exercise])) {
      if (S.screen !== "recording") render();
    }
    live();
    monitorTick();
  } else {
    S.status = null;
    $("#end").innerHTML = '<span class="dev"><span class="dot"></span>Not reachable</span>';
  }
  const busy = s && (s.state !== "idle" || s.monitor);
  pollTimer = setTimeout(poll, s && s.state !== "idle" ? 120 : busy ? 300 : 1500);
}
async function refresh() {
  try {
    const [ex, takes, bk] = await Promise.all([api("GET", "/api/exercises"), api("GET", "/api/takes"), api("GET", "/api/backings")]);
    S.exercises = ex; S.takes = takes; S.backings = bk;
  } catch (e) {}
}

// --- taps
function flushNote() {  // a take's note typed but not sent yet, before the screen changes (or the page goes)
  const el = $("[data-note]"), t = el && S.takes.find((x) => x.id === el.dataset.note);
  if (!t || el.value === (t.note || "")) return;
  t.note = el.value;
  fetch(`/api/takes/${encodeURIComponent(t.id)}/note`, { method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ note: el.value }), keepalive: true }).catch(() => {});
}
document.addEventListener("click", (ev) => {
  lastTouch = Date.now();
  if (!ev.target.closest("[data-note]")) flushNote();
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const a = el.dataset.act, d = el.dataset, c = C();
  if (a === "dismiss") showError("");
  else if (a === "go") {
    if (d.to === "record") S.showReadme = false;
    go(d.to);
  }
  else if (a === "step") go(d.step, { walk: false });
  else if (a === "start-over") go("on", { walk: true });
  else if (a === "restore") restore();
  else if (a === "answered") answered(d.step);
  else if (a === "inst") toggleInstrument(d.id);
  else if (a === "carry") { S.choices.inputs = { ...carries(), [d.input]: d.v }; save(); render(); }
  else if (a === "just") { S.choices.instruments = [d.id]; S.choices.inputs = defaultInputs(chosen()); S.choices.kind = "exercise"; save(); answered("sort"); }
  else if (a === "sort") { S.choices.kind = d.kind; save(); answered("sort"); }
  else if (a === "exercise") { S.choices.exercise = d.id; S.previewOpen = false; save(); answered("which"); }
  else if (a === "preview") { S.preview = d.id; S.previewOpen = true; render(); const sc = $(".pv-score"); if (sc) sc.scrollTop = 0; }
  else if (a === "preview-close") { S.previewOpen = false; render(); }
  else if (a === "hear-chart") act(() => api("POST", `/api/exercises/${encodeURIComponent(d.id)}/hear`, { count_in: !!c.countIn, click: !!c.clickThrough }));
  else if (a === "show-good") { S.showGood = !S.showGood; render(); }
  else if (a === "backing") set({ backing: d.id });
  else if (a === "hear") act(() => api("POST", `/api/backings/${encodeURIComponent(d.id)}/play`, { start: 0 }));
  else if (a === "hear-stop" || a === "stop-play") act(() => api("POST", "/api/stop"));
  else if (a === "toggle") set({ [d.k]: !c[d.k] });
  else if (a === "free-click") set({ freeClick: d.v === "1" });
  else if (a === "free-bpm") set({ freeBpm: Math.max(30, Math.min(260, c.freeBpm + Number(d.d))) });
  else if (a === "bpb") set({ freeBpb: Number(d.v) });
  else if (a === "ex-bpm") { const e = exById(c.exercise); set({ tempo: { ...c.tempo, [e.id]: Math.max(30, Math.min(260, Math.round(tempoOf(e)) + Number(d.d))) } }); }
  else if (a === "ex-bpm-reset") { const t = { ...c.tempo }; delete t[c.exercise]; set({ tempo: t }); }
  else if (a === "swap") set({ exercise: d.id });
  else if (a === "prepare") { Object.assign(S.choices, { kind: "exercise", exercise: d.id }); save(); go("ready"); }
  else if (a === "level") setLevel((S.status ? S.status.level_offset_db : 0) + Number(d.d));
  else if (a === "readme") { S.showReadme = !S.showReadme; render(); }
  else if (a === "record") act(record);
  else if (a === "stop-rec") act(() => api("POST", "/api/record/stop"));
  else if (a === "play") act(() => api("POST", `/api/takes/${encodeURIComponent(d.id)}/play`, { start: 0 }));
  else if (a === "sheet") { S.sheet = true; $("#sheet").hidden = false; renderSheet(); }
  else if (a === "sheet-close") { S.sheet = false; $("#sheet").hidden = true; }
  else if (a === "note") {
    const t = S.takes.find((x) => x.id === d.id), note = prompt("Note for this take:", (t && t.note) || "");
    if (note !== null) act(async () => { await api("PUT", `/api/takes/${encodeURIComponent(d.id)}/note`, { note }); await refresh(); render(); });
  }
  else if (a === "delete") {
    const t = S.takes.find((x) => x.id === d.id);
    if (t && confirm(`Delete the take from ${when(t.started)} (${fmt(t.seconds)})?`))
      act(async () => { await api("DELETE", `/api/takes/${encodeURIComponent(d.id)}`); await refresh();
        if (S.screen === "recorded" && S.take === d.id) { S.take = null; go("ready"); } else render(); });
  }
});
$("#sheet").addEventListener("click", (ev) => { if (ev.target.id === "sheet") { S.sheet = false; $("#sheet").hidden = true; } });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && S.sheet) { S.sheet = false; $("#sheet").hidden = true; }
  else if (ev.key === "Escape" && S.previewOpen) { S.previewOpen = false; render(); }
});
// the waveform: tap to play from there
document.addEventListener("click", (ev) => {
  const w = ev.target.closest("[data-wave]");
  if (!w) return;
  const r = w.getBoundingClientRect(), at = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * Number(w.dataset.seconds);
  act(() => api("POST", `/api/takes/${encodeURIComponent(w.dataset.wave)}/play`, { start: at }));
});
// the speakers' level: shown while dragged, sent when let go
function setLevel(v) {
  v = Math.max(-30, Math.min(12, Math.round(v)));
  act(async () => { const r = await api("PUT", "/api/settings", { level_offset_db: v }); if (S.status) S.status.level_offset_db = r.level_offset_db; live(); });
}
document.addEventListener("input", (ev) => {
  if (ev.target.dataset.level === undefined) return;
  dragging = true;
  const v = Number(ev.target.value);
  $$("[data-level-text]").forEach((el) => { el.innerHTML = el.classList.contains("lv") ? `${esc(dbText(v).replace(" dB", ""))} <small>dB</small>` : esc(dbText(v)); });
});
document.addEventListener("change", (ev) => {
  if (ev.target.dataset.level !== undefined) { dragging = false; setLevel(Number(ev.target.value)); }
  if (ev.target.dataset.note) { const id = ev.target.dataset.note, note = ev.target.value;
    act(async () => { await api("PUT", `/api/takes/${encodeURIComponent(id)}/note`, { note }); await refresh(); }); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.dataset.note) ev.target.blur(); });
document.addEventListener("pointerdown", () => { const was = listening(); lastTouch = Date.now(); if (!was) monitorTick(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastTouch = Date.now(); refresh().then(render); poll(true); } });
// a screen named in the address (#ready, #on, ...): for trying the page out
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["on", "sort", "which", "ready", "record"].includes(h)) go(h); });

(async function startUp() {
  try { await loadAll(); } catch (e) { showError(`Could not load: ${e.message}`); S.choices = S.choices || { ...DEFAULTS }; }
  const h = location.hash.slice(1);
  S.screen = ["on", "sort", "which", "ready", "record"].includes(h) && (h !== "record" || readyOk()) ? h : readyOk() ? "ready" : "on";
  S.walk = !readyOk();
  if (STEPS.includes(S.screen)) S.snapshot = readyOk() ? JSON.parse(JSON.stringify(C())) : null;
  if (S.screen === "which") previewChosen();
  render();
  poll(true);
})();
</script>
</body>
