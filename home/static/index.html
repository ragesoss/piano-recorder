<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music room</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#121016">
<style>
/* The way into each app, and what each is doing. The exercise app's look
   (exercises/static/index.html): dark, purple for what to tap, red only for recording. */
@font-face { font-family: "Bricolage Grotesque"; src: url(/fonts/bricolage-grotesque.woff2) format("woff2");
  font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url(/fonts/public-sans.woff2) format("woff2");
  font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #121016; --surf2: #1E1A24; --surf: #28232F; --line: #3E3748; --line-soft: #2F2A37; --dash: #514960;
  --ink: #F2EEF8; --ink2: #CEC7DA; --ink3: #A79FB4; --faint: #7E768B;
  --purple-fill: #7C3AED; --purple: #8B5CF6; --purple-ink: #B9A0FF; --purple-tint: #33264F;
  --red: #D42A1F; --red-dot: #FF5147; --red-ink: #FF8F85; --red-tint: #3E1F24;
  --green: #4ADE80;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 var(--text); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .7; }
h1, p { margin: 0; }
main { max-width: 600px; margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
h1 { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 4px 2px 16px; }
.apps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }

/* a tile: the app's name, what it is for, what it is doing; tap to open it */
a.app { display: flex; flex-direction: column; gap: 4px; min-height: 132px; padding: 16px 16px 16px 20px; text-decoration: none; color: inherit;
  background: var(--surf); border: 1.5px solid var(--line); border-radius: 22px; }
a.app:active { background: var(--purple-tint); }
.head { display: flex; align-items: center; gap: 12px; }
.name { flex: 1; min-width: 0; font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
.go { width: 44px; height: 44px; flex: none; border-radius: 22px; background: var(--purple-tint); display: flex; align-items: center; justify-content: center; }
.about { font-size: 16px; color: var(--ink3); }
.state { margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; color: var(--ink2); }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--faint); flex: none; }
a.app.on .state { color: var(--ink); }
a.app.on .dot { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
a.app.rec { background: var(--red-tint); border-color: var(--red-ink); }
a.app.rec .state { color: var(--red-ink); }
a.app.rec .dot { background: var(--red-dot); }
a.app.down { background: transparent; border-style: dashed; border-color: var(--dash); }
a.app.down .state { color: var(--ink3); font-weight: 400; }
a.app.down .dot { background: transparent; border: 2px solid var(--faint); }
@keyframes pulse { 50% { opacity: .4; } }

.stop-all { width: 100%; min-height: 64px; margin-top: 14px; border: 0; border-radius: 20px; background: var(--purple-fill); color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--display); font-size: 24px; font-weight: 700; }
.notes { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.note { color: var(--ink3); font-size: 15px; line-height: 1.4; padding: 0 2px; }
.note b { color: var(--ink2); }

/* an iPad: every tile on one screen. Upright, two to a row (nine apps: five rows); on its side, three (three rows) */
@media (min-width: 700px) {
  main { max-width: 1000px; padding-left: max(28px, env(safe-area-inset-left)); padding-right: max(28px, env(safe-area-inset-right)); padding-top: max(20px, env(safe-area-inset-top)); }
  h1 { font-size: 38px; margin-bottom: 16px; }
  .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  a.app { min-height: 136px; padding: 16px 18px 16px 22px; }
  .name { font-size: 30px; }
  .stop-all { max-width: 420px; margin: 16px auto 0; }
  .notes { max-width: 720px; margin-top: 14px; }
}
@media (min-width: 1000px) and (orientation: landscape) {
  main { max-width: 1240px; }
  .apps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  a.app { min-height: 124px; }
  .name { font-size: 28px; }
}
/* a short screen (an iPad on its side, the browser's bars taking their share): smaller still */
@media (min-width: 700px) and (max-height: 860px) {
  main { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  h1 { font-size: 32px; margin: 2px 2px 12px; }
  .apps { gap: 12px; }
  a.app { min-height: 112px; padding: 14px 16px 14px 20px; gap: 2px; }
  .go { width: 38px; height: 38px; }
  .about { font-size: 15px; }
  .state { padding-top: 6px; font-size: 16px; }
  .stop-all { min-height: 54px; font-size: 21px; margin-top: 12px; }
}
</style>
</head>
<body>
<main>
  <h1>Music room</h1>
  <div class="apps" id="apps"></div>
  <button type="button" class="stop-all" id="stopAll" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"></rect></svg>Stop everything</button>
  <div class="notes">
    <p class="note">Only one of these plays at a time: starting one fades the other out. A recording is never interrupted.</p>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const GO = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#B9A0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';

function mmss(s) { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

// The practice recorder and the exercise app: the same engine (recorder/engine.py), so the same words.
function recorderState(s) {
  if (s.state === "recording") return [`Recording ${mmss(s.recording.seconds)}`, true, false, true];
  if (s.state === "playing" || s.state === "preparing") return [s.playing && s.playing.backing ? "Playing a backing track"
    : s.playing && s.playing.exercise ? "Playing an exercise's notes" : "Playing a take", true];
  return ["Ready", false];
}

// What each app is doing, in a few words: [text, active, not running, recording].
function describe(a) {
  const s = a.status;
  if (!a.up) return ["Not running", false, true];
  if (a.id === "practice" || a.id === "exercises") return recorderState(s);
  if (a.id === "transcribe") {  // the same engine, and a transcription after each take
    if (s.state === "recording") return recorderState(s);
    if (s.job || (s.queue || []).length) return ["Transcribing a take", true];
    if (s.review) return ["Making a review", true];
    if (s.chart) return ["Drafting a chord chart", true];
    return ["Ready", false];
  }
  if (a.id === "ambient") {
    const st = s.state;
    const sc = s.explain && s.explain.scale;
    const what = sc ? `${sc.notes.split(" ")[0]} ${sc.name}` : st.key;
    if (s.playing) return [`Playing · ${what}`, true];
    if (s.fading) return ["Fading out", true];
    return ["Stopped", false];
  }
  if (a.id === "band") {
    const what = s.tune ? ` · ${s.tune}` : "";
    if (s.playing && s.state === "listening for your count") return [`Listening for a count${what}`, true];
    if (s.playing) return [`Playing${what}`, true];
    return ["Stopped", false];
  }
  if (a.id === "chords") {
    // the chord over the bar once it is sure (it holds still), else this moment's
    const heard = s.bar && s.bar.chord && s.bar.confidence >= 0.4 ? s.bar.chord : s.chord;
    if (s.state === "listening") return [heard ? `Hearing ${heard}` : "Listening", true];
    if (s.state === "waiting") return ["Letting a recorder have the inputs", false];
    return ["Ready", false];
  }
  if (a.id === "board") return [s.state || "Ready", false];  // what is in Next or Doing, by kind of work: "3 to listen · 2 to play"
  const st = s && s.state ? String(s.state) : "running";
  return [st[0].toUpperCase() + st.slice(1), false];
}

function render(data) {
  const host = location.hostname;
  let any = false;
  const box = $("apps");
  for (const a of data.apps) {
    let el = document.getElementById(`app-${a.id}`);
    if (!el) {
      el = document.createElement("a");
      el.className = "app"; el.id = `app-${a.id}`;
      el.innerHTML = `<span class="head"><span class="name"></span><span class="go">${GO}</span></span><span class="about"></span><span class="state"><span class="dot"></span><span class="text"></span></span>`;
      box.append(el);
    }
    el.href = `${a.scheme || "http"}://${host}:${a.port}/`;  // the contribution app over HTTPS (home/server.py)
    el.querySelector(".name").textContent = a.name;
    el.querySelector(".about").textContent = a.about || "";
    const [text, on, down, rec] = describe(a);
    el.querySelector(".text").textContent = text;
    el.className = "app" + (on ? " on" : "") + (down ? " down" : "") + (rec ? " rec" : "");
    any = any || on;
  }
  $("stopAll").hidden = !any;
}

async function poll() {
  try { render(await (await fetch("/api/status")).json()); } catch (e) {}
  setTimeout(poll, document.hidden ? 5000 : 1500);
}
$("stopAll").onclick = async () => {
  $("stopAll").disabled = true;
  try { render(await (await fetch("/api/stop-all", { method: "POST" })).json()); } catch (e) {}
  $("stopAll").disabled = false;
};
poll();
</script>
</body>
</html>
