# The exercise app's config, installed as /etc/exercise-recorder.toml by
# setup/install.sh. The same devices as the practice recorder; its own port,
# takes and exercises (tools/push-exercise puts them in exercises_dir).

capture = "scarlett-18i8-gen3"
playback = "scarlett-18i8-gen3"
# The inputs it records, and what is on each, are the room's: ~/room-inputs.toml (recorder/inputs.py; first
# installed from config/inputs.toml, then named from the apps' pages), as every app's. A take keeps the recorded
# inputs in input-number order, and its sidecar's `channels` names each. (Until 2026-10-20 this config listed
# them: keep_channels = [2, 3, 6], inputs 3 the Nadine, 4 the MXL 990, 7 the piezo, with an [inputs.N] each. A
# config of before that still stands in for the room's file while there is none.)
# "~" is the home of the user the service runs as.
takes_dir = "~/exercise-takes"
exercises_dir = "~/exercises"
# Backing tracks for play-along takes (tools/push-backing puts them here).
backing_dir = "~/backing"
# Other programs on the control unit that play through the same speakers (only one plays at a
# time), or listen to the same inputs (the chord app, 8003): before recording or playing, this one asks
# each to let go (recorder/peers.py). 8004: the Ugly Duckling String Band (ambient-room), which holds the 18i8
# both ways while it plays. 8006: the transcribe app (transcriber/), which records.
peers = ["http://127.0.0.1:8000", "http://127.0.0.1:8001", "http://127.0.0.1:8003",
         "http://127.0.0.1:8004", "http://127.0.0.1:8006"]

[web]
host = "0.0.0.0"
port = 8002

[loudness]
# As the practice recorder's (config/practice.toml).
target_dbfs = -21.0
limit_dbfs = -1.0
max_gain_db = 16.0
