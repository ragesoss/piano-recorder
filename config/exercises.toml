# The exercise app's config, installed as /etc/exercise-recorder.toml by
# setup/install.sh. The same devices as the practice recorder; its own port,
# takes and exercises (tools/push-exercise puts them in exercises_dir).

capture = "scarlett-18i8-gen3"
playback = "scarlett-18i8-gen3"
# The inputs this app keeps, in place of the profile's (inputs 3 and 4): input 3 (the Nadine), input
# 4 (the condenser), and input 7 (a rear line input) for the bass's Fishman Full Circle piezo through
# its Fishman Pro-EQ Platinum DI (2026-10-16; on input 1, phantom off, from 2026-10-15). A take's
# channels are in this order: 0 the Nadine, 1 the condenser, 2 input 7. The channels are the inputs'
# numbers less one. (Rear inputs 5 and 6 carry the mixer for records: not kept.)
keep_channels = [2, 3, 6]
# "~" is the home of the user the service runs as.
takes_dir = "~/exercise-takes"
exercises_dir = "~/exercises"
# Backing tracks for play-along takes (tools/push-backing puts them here).
backing_dir = "~/backing"
# Other programs on the control unit that play through the same speakers (only one plays at a
# time), or listen to the same inputs (the chord app, 8003): before recording or playing, this one asks
# each to let go (recorder/peers.py).
peers = ["http://127.0.0.1:8000", "http://127.0.0.1:8001", "http://127.0.0.1:8003"]

# What is plugged into each kept input, by the interface's input number: the app's input panel
# shows them, and each take's sidecar says what each channel carried. "for": a pickup or mic on
# one kind of instrument; none: a mic for the room.
[inputs.7]
name = "Piezo"
details = "Fishman Full Circle, through the Fishman Pro-EQ Platinum DI, into rear line input 7"
for = "bass"

[inputs.3]
name = "Nadine"
details = "Ear Trumpet Labs Nadine, on the bass"
for = "bass"

[inputs.4]
name = "Room mic"
details = "The condenser, pointed at the player"

[web]
host = "0.0.0.0"
port = 8002

[loudness]
# As the practice recorder's (config/practice.toml).
target_dbfs = -21.0
limit_dbfs = -1.0
max_gain_db = 16.0
