# The exercise app on the desktop, with the fake device.

capture = "fake"
playback = "fake"
takes_dir = "exercise-takes-dev"
exercises_dir = "exercises-dev"
backing_dir = "backing-dev"
# As on the control unit (config/exercises.toml): the fake device's four channels stand in.
keep_channels = [2, 3, 0]

# What is plugged into each kept input, by the interface's input number: the app's input panel
# shows them, and each take's sidecar says what each channel carried. "for": a pickup or mic on
# one kind of instrument; none: a mic for the room.
[inputs.1]
name = "Piezo"
details = "Fishman Full Circle, through the Fishman Pro-EQ Platinum DI"
for = "bass"

[inputs.3]
name = "Nadine"
details = "Ear Trumpet Labs Nadine, on the bass"
for = "bass"

[inputs.4]
name = "Room mic"
details = "The condenser, pointed at the player"

[web]
host = "127.0.0.1"
port = 8002

[loudness]
target_dbfs = -21.0
limit_dbfs = -1.0
max_gain_db = 30.0
