# The exercise app on the desktop, with the fake device.

capture = "fake"
playback = "fake"
takes_dir = "exercise-takes-dev"
exercises_dir = "exercises-dev"
backing_dir = "backing-dev"
# The room's inputs on the desktop, shared by the dev configs (recorder/inputs.py; not in git). Until a page
# names one, this config's own stand in for it: the fake device's four inputs as the unit's were before
# 2026-10-20 (inputs 3, 4 and 1 kept, in that order, each named below).
inputs_file = "inputs-dev.toml"
keep_channels = [2, 3, 0]

# What is plugged into each kept input, by the interface's input number (until inputs-dev.toml exists).
# "for": a pickup or mic on one kind of instrument; none: a mic for the room.
[inputs.1]
name = "Piezo"
details = "Fishman Full Circle, through the Fishman Pro-EQ Platinum DI"
for = "bass"

[inputs.3]
name = "Nadine"
details = "Ear Trumpet Labs Nadine, on the bass"
for = "bass"

[inputs.4]
name = "Room mic"
details = "The condenser, pointed at the player"

[web]
host = "127.0.0.1"
port = 8002

[loudness]
target_dbfs = -21.0
limit_dbfs = -1.0
max_gain_db = 30.0
