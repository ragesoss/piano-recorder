# The home page, installed once as /etc/room-home.toml by setup/install.sh.
# It lists the apps on the control unit and shows what each is doing.

port = 80

[[apps]]
id = "practice"
name = "Practice"
about = "Record and play back takes"
port = 8000
# what "Stop everything" calls
stop = ["/api/record/stop", "/api/stop"]

[[apps]]
id = "exercises"
name = "Exercises"
about = "Record exercises with the score in view"
port = 8002
stop = ["/api/record/stop", "/api/stop"]

[[apps]]
id = "transcribe"
name = "Transcribe"
about = "Record a take and see it as notation and tab"
port = 8006
stop = ["/api/record/stop"]

[[apps]]
id = "chords"
name = "Chords"
about = "The chord being played, and checks of it"
port = 8003
stop = ["/api/stop"]

[[apps]]
id = "ambient"
name = "Ambient"
about = "Music for the room"
port = 8001
stop = ["/api/stop"]

[[apps]]
id = "band"
name = "Ugly Duckling String Band"
about = "A band that follows you: bass, chop and chords from a chart"
port = 8004
stop = ["/api/stop"]

[[apps]]
id = "review"
name = "Transcription review"
about = "Questions about your takes: listen, then say what you played"
port = 8005
stop = []

[[apps]]
id = "board"
name = "Board"
about = "What to do next: listen, play, the agent, people, hardware"
port = 8007
# it plays nothing
stop = []
