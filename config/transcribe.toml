# The transcribe app's config (transcriber/), installed as /etc/take-transcriber.toml by setup/install.sh.
# The same devices as the exercise app (config/exercises.toml): the 18i8. It records the dobro, the bass, the
# piano and any stringed instrument ([instruments.*]).

capture = "scarlett-18i8-gen3"
playback = "scarlett-18i8-gen3"
# The inputs it records, and what is on each, are the room's (~/room-inputs.toml, recorder/inputs.py: named from
# the apps' pages), as every app's. A take's folder holds the instrument's input alone (take-01.flac) and every
# recorded input (raw/, its sidecar naming each channel).
# The take folders ("~" is the home of the user the service runs as): what "Review it" hands the review app.
takes_dir = "~/transcribe-takes"
# Before recording, this app asks each of these to let go of the inputs and the speakers (recorder/peers.py):
# 8000 the practice recorder, 8001 the ambient synth, 8002 the exercise app, 8003 the chord app, 8004 the Ugly
# Duckling String Band. It answers /api/yield itself (refused while it records).
peers = ["http://127.0.0.1:8000", "http://127.0.0.1:8001", "http://127.0.0.1:8002", "http://127.0.0.1:8003",
         "http://127.0.0.1:8004"]

# What this app records, as the pipeline names it (`transcribe --instrument`), and the input that carries it
# unless the page says another, by its mic's name in the room's list (wherever it is plugged in): the dobro on the
# Bluebird SL, the player's choice by ear over the MXL 990 (2026-10-21, dobro-transcription's review
# 2026-10-20-mics-by-ear: "the Bluebird sounds a touch clearer even aside from the click"; then "you can switch to
# bluebird for everything except piano and bass"); the bass on the Nadine, as the
# corpus's bass takes (dobro-transcription tunes/bass/*: "the Nadine's channel alone"); the piano on the room mic,
# as the exercise app records it. The piano is written as a grand staff, no tab. Any stringed instrument (the
# pipeline's generic path: a mandolin, a banjo, a guitar...; its kind chosen on the page, or not) on the Bluebird SL,
# written as one staff, no tab. With no recorded input of that name (or one its mic went by, "Room mic" for the MXL
# before 2026-10-21): one for the instrument's kind (the bass: the piezo), else the room's (recorder/inputs.py,
# `Inputs.pick`).
[instruments.dobro]
name = "Dobro"
input = "Bluebird SL"

[instruments.bass]
name = "Bass"
input = "Nadine"

[instruments.piano]
name = "Piano"
input = "MXL 990"

[instruments.strings]
name = "Any stringed instrument"
input = "Bluebird SL"

# The transcription project's package as synced to the unit, and the venv that has its dependencies (numpy,
# scipy, librosa, soundfile): the review app's. A run gets a few threads and nice 19.
[pipeline]
python = "~/dobro-transcription/review/.venv/bin/python"
src = "~/dobro-transcription/pipeline/src"
threads = 2
nice = 19

# "Review it": the review app's generator (review/make_review.py take-check), run in the project's folder with
# its venv; --install local puts the review in REVIEW_DATA, which the review app (port 8005) reads.
[review]
root = "~/dobro-transcription"
python = "~/dobro-transcription/review/.venv/bin/python"
data = "~/review-data"
port = 8005

[web]
host = "0.0.0.0"
port = 8006

[loudness]
# As the practice recorder's (config/practice.toml); this app plays only its click.
target_dbfs = -21.0
limit_dbfs = -1.0
max_gain_db = 16.0
