# The control unit's config, installed as /etc/practice-recorder.toml by
# setup/install.sh. It picks the parts by profile name (hardware/<name>.toml);
# see docs/components.md.

# The Scarlett 18i8 3rd Gen from 2026-10-14 (the BMG-04F before: hardware/bmg-04f.toml).
capture = "scarlett-18i8-gen3"
playback = "scarlett-18i8-gen3"
# The inputs it records, and what is on each: the room's, ~/room-inputs.toml (recorder/inputs.py), shared by
# every app and named from their pages. Each app's config may say another file (inputs_file).
# "~" is the home of the user the service runs as.
# Backing tracks for play-along takes (tools/push-backing puts them here).
backing_dir = "~/backing"
takes_dir = "~/takes"
# The control unit's address on the LAN, reserved on the router (slot 7).
# Nothing in the code uses it yet.
address = "practice.local"
# Other programs on the control unit that play through the same speakers (only one plays at a
# time), or listen to the same inputs (the chord app, 8003): before recording or playing, this one asks
# each to let go (recorder/peers.py). 8004: the Ugly Duckling String Band (ambient-room), which holds the 18i8
# both ways while it plays. 8006: the transcribe app (transcriber/), which records.
peers = ["http://127.0.0.1:8001", "http://127.0.0.1:8002", "http://127.0.0.1:8003",
         "http://127.0.0.1:8004", "http://127.0.0.1:8006"]

[web]
host = "0.0.0.0"
port = 8000

[loudness]
# Playback: each take is brought to this gated rms, through a peak limiter.
# Calibrated against a record on 2026-10-10 ("Shared mixer" in
# docs/components.md).
target_dbfs = -21.0
limit_dbfs = -1.0
# The boost also raises the take's noise floor (about -72 dBFS with the
# BMG-04F). 16 dB is what a take of normal playing needs; softer takes stay
# softer instead of bringing their noise up with them (2026-10-10).
max_gain_db = 16.0
