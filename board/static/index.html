<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121016">
<style>
/* The project's cards as a kanban: Backlog, Next, Doing, Waiting, Done, for each kind of work it is for the
   player (Listen & evaluate, Play & sing, Manage the agent, People, Hardware, or All), area as a chip or as
   lanes, filters, and a sheet per card with its actions; and the project's large-scale goals (when the cards come
   with them): a view of each one's progress over time, a page for each with its board under it, a colour for each
   worn by its cards, a filter. Each card's number (#42: what the player says), a card opened by it ("Card #", or a
   link to #42), and the player's mark "Ready" (to go, for Claude) on a card Claude can take up, with a filter. A
   card's links to the apps on the unit (where the player does it) big at the top of its sheet, its own questions'
   "Answer" (the review app, one question at a time) first, each review's count by its link. The room's
   look (exercises/static/index.html): dark, purple for what to tap. --faint is for lines only (3.5:1 on cards). */
@font-face { font-family: "Bricolage Grotesque"; src: url(/fonts/bricolage-grotesque.woff2) format("woff2");
  font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url(/fonts/public-sans.woff2) format("woff2");
  font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #121016; --surf2: #1E1A24; --surf: #28232F; --line: #3E3748; --line-soft: #2F2A37; --dash: #514960;
  --ink: #F2EEF8; --ink2: #CEC7DA; --ink3: #A79FB4; --faint: #7E768B;
  --purple-fill: #7C3AED; --purple: #8B5CF6; --purple-line: #A78BFA; --purple-ink: #B9A0FF;
  --purple-tint: #33264F; --purple-tint2: #45356A;
  --red-ink: #FF8F85; --red-tint: #3E1F24; --green: #4ADE80; --amber: #E8B93B;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pad: 20px; --gap: 12px;
  /* the goals' ten colours (the contract's names). Each is a mark only, never text: at least 3.9:1 on the cards
     (#28232F; red the least), 4.4:1 on the sheets (#1E1A24), 4.9:1 on the background, and the background's
     #121016 on it at least 4.9:1 (where text might sit on one). PLAN.md, step 9, has each one's numbers and how far
     it is from the others and from the purple key, the red, the amber and the live green. A goal is always named
     beside its colour. */
  --g-teal: #5CE3E0; --g-orange: #E07A12; --g-pink: #FF73C3; --g-green: #55B46E; --g-gold: #FFEB8A;
  --g-blue: #2F8CFF; --g-red: #E0505E; --g-violet: #D04BDB; --g-lime: #C6EE2A; --g-sky: #4CC2FF;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 var(--text); -webkit-tap-highlight-color: transparent;
  overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--purple-ink); }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--purple-line); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.svg-i { flex: none; }
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

/* the top: the way home, the views, filters and adding a card */
.top { flex: none; display: flex; align-items: center; gap: 10px 14px; padding: 10px var(--pad) 6px; flex-wrap: wrap; }
.home { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink3); font-size: 17px; text-decoration: none; flex: none; }
.top h1 { font-family: var(--display); font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; flex: none; }
.views { order: 5; flex: 1 1 100%; }
.views button { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; }
.views button .lbl { text-align: left; }
@media (min-width: 1100px) { .views button { white-space: nowrap; } }
.top .end { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 3px; border-radius: 14px; background: var(--surf2); }
.seg button { min-height: 44px; border: 0; border-radius: 11px; background: transparent; font-size: 15px; font-weight: 600; padding: 4px 8px;
  line-height: 1.15; color: var(--ink2); }
.seg button .n { font-weight: 400; color: var(--ink3); margin-left: 4px; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--purple-fill); color: #fff; font-weight: 700; }
.seg button[aria-pressed="true"] .n { color: #fff; }
.btn { min-height: 48px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid var(--line); border-radius: 16px; background: transparent; font-size: 16px; font-weight: 700; color: var(--ink); }
.btn.go { border: 0; background: var(--purple-fill); color: #fff; }
.btn.go:disabled { background: #2A2531; color: var(--ink3); }
.btn.outline-p { border-color: var(--purple); color: var(--purple-ink); }
.btn .count { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--purple-fill); color: #fff; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; }
.sub { flex: none; display: flex; align-items: center; gap: 8px 14px; padding: 0 var(--pad) 8px; flex-wrap: wrap; font-size: 15px; color: var(--ink3); }
#sub { display: contents; }
.sub b { color: var(--ink2); font-weight: 600; }
/* each card's number (what the player says: "card 42"), a card opened by it; the player's mark "ready to go" */
.find { margin-left: auto; display: flex; }
.find input { width: 104px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surf2);
  font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.find input::placeholder { color: var(--ink3); }
.cnum { font-size: 13px; font-weight: 700; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.readypill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--purple-fill);
  color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }
.sub .rfilter { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--purple); background: transparent;
  color: var(--purple-ink); font-size: 15px; font-weight: 700; }
.sub .rfilter[aria-pressed="true"] { background: var(--purple-fill); border-color: var(--purple-fill); color: #fff; }
.sub .rfilter[aria-pressed="true"]::before { content: "✓ "; }
.btn.rbtn { border-color: var(--purple); color: var(--purple-ink); }
.btn.rbtn[aria-pressed="true"] { background: var(--purple-fill); border-color: var(--purple-fill); color: #fff; }
.btn.rbtn[aria-pressed="true"]::before { content: "✓"; }
.sub .linkish { min-height: 44px; padding: 0 6px; border: 0; background: transparent; color: var(--purple-ink); font-weight: 700; font-size: 15px;
  text-decoration: underline; text-underline-offset: 3px; }
.sync { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
.banner { margin: 0 var(--pad) 8px; padding: 10px 14px; border-radius: 14px; background: var(--red-tint); border: 1.5px solid var(--red-ink);
  font-size: 16px; display: flex; gap: 12px; align-items: center; }
.banner.info { background: var(--purple-tint); border-color: var(--purple-line); }
.banner button { margin-left: auto; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--ink3); background: transparent; }

/* jumping between columns, where they do not all fit (an iPad upright, a phone) */
.colnav { flex: none; display: none; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 0 var(--pad) 8px; }
.colnav button { min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px; background: transparent; font-size: 14px; font-weight: 600;
  color: var(--ink2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 2px; }
.colnav button b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.colnav button[aria-current="true"] { border-color: var(--purple); background: var(--purple-tint); color: var(--ink); }

/* the board: five columns; area lanes across them when grouped */
.board { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 var(--pad) 24px;
  scroll-padding-left: var(--pad); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: var(--gap); min-width: 100%; }
.colhead { position: sticky; top: 0; z-index: 3; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 6px 4px 8px;
  min-height: 52px; scroll-snap-align: start; }
.colhead h2 { font-family: var(--display); font-size: 22px; font-weight: 700; }
.colhead .n { font-size: 15px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.colhead .older { margin-left: auto; min-height: 44px; padding: 0 10px; border: 0; border-radius: 12px; background: transparent; color: var(--purple-ink);
  font-size: 14px; font-weight: 700; white-space: nowrap; }
.lane { grid-column: 1 / -1; padding: 14px 0 6px; }
.lane h3 { font: inherit; }
.lane span { position: sticky; left: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink2); }
.lane span i { width: 10px; height: 10px; border-radius: 50%; background: var(--hue, var(--ink3)); }
.lane span small { font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink3); }
.cell { display: flex; flex-direction: column; gap: 8px; padding: 8px; background: var(--surf2); border-radius: 16px; min-height: 64px;
  border: 2px solid transparent; min-width: 0; }
.cell.over { border-color: var(--purple); background: var(--purple-tint); }
.cell .empty { color: var(--ink3); font-size: 14px; padding: 8px 6px; }
.lanes .cell { align-self: start; }
.lanes .cell.none { min-height: 44px; background: transparent; border: 1.5px dashed var(--line-soft); }
.cell h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); margin: 8px 4px 0;
  display: flex; align-items: center; gap: 8px; }
.cell h3:first-child { margin-top: 2px; }
.cell h3 i { width: 9px; height: 9px; border-radius: 50%; background: var(--hue, var(--ink3)); }
.cell .more { min-height: 44px; border: 1.5px dashed var(--dash); border-radius: 12px; background: transparent; color: var(--purple-ink); font-size: 15px; font-weight: 700; }
.board-empty { max-width: 620px; margin: 40px auto; text-align: center; color: var(--ink2); font-size: 18px; line-height: 1.5; }
.board-empty code { color: var(--ink); }

/* a card */
.card { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 10px 12px 10px; text-align: left; background: var(--surf);
  border: 1.5px solid var(--line); border-radius: 14px; min-height: 64px; flex: none; color: var(--ink); }
.card:hover { border-color: var(--dash); }
.card.imp1 { border-left: 5px solid var(--purple); padding-left: 9px; }
.card.live { border-style: dashed; border-color: var(--green); background: #1F2622; }
.card.dragging { opacity: .5; }
.card.flash { outline: 3px solid var(--purple-line); outline-offset: 2px; }
.card .meta { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; font-size: 13px; }
.card .meta .area { background: transparent; padding: 0; height: auto; }
.card .meta .work { background: transparent; padding: 0; height: auto; }
.card .people { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
.card .title { font-size: 16px; font-weight: 700; line-height: 1.28; overflow-wrap: anywhere; }
.card.imp3 .title { font-weight: 600; color: var(--ink2); }
.card .summary { font-size: 14px; color: var(--ink2); }
.card .effort { font-size: 14px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.card .flags { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--ink3); }
.work { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; background: var(--purple-tint);
  color: var(--purple-ink); font-size: 13px; font-weight: 700; white-space: nowrap; }
.area { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; height: 22px; padding: 0 8px 0 7px; border-radius: 11px;
  background: var(--surf2); font-size: 13px; font-weight: 600; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.area i { width: 8px; height: 8px; border-radius: 50%; background: var(--hue, var(--ink3)); flex: none; }
.imp { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink3); white-space: nowrap; }
.imp.i1 { color: var(--purple-ink); }
.imp.i2 { color: var(--ink2); font-weight: 600; }
.imp.i3 { font-weight: 400; }
.who { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 12px; font-size: 13px; font-weight: 700; }
.badge.player { background: var(--purple-tint); color: var(--purple-ink); }
.badge.claude { border: 1.5px solid var(--ink3); color: var(--ink); }
.badge.others { background: var(--surf2); color: var(--ink2); border: 1.5px dashed var(--dash); }
.flag { display: inline-flex; align-items: center; gap: 4px; }
.flag.blocked { color: var(--red-ink); font-weight: 700; }
.flag.waiting { color: var(--amber); font-weight: 600; }
.flag.unsynced { color: var(--ink2); font-weight: 600; }
.livepill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; background: #173322; color: var(--green);
  font-size: 13px; font-weight: 700; }
.livepill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
/* the review app's: who made a review (a glyph and a word), and a review archived (the player done with it) */
.origin { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; border: 1.5px solid var(--ink3);
  color: var(--ink2); font-size: 13px; font-weight: 700; white-space: nowrap; vertical-align: middle; }
.summary .origin, .live-note .origin { margin-left: 6px; }
.archpill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; border: 1.5px dashed var(--ink3);
  color: var(--ink2); font-size: 13px; font-weight: 700; }
.origin-line { color: var(--ink2); font-size: 15px; }

/* the goals: a stripe across a card's top, a segment for each of its goals (most relevant first), and a chip naming
   each; the Goals view, a tile per goal with its chart (the stages up the side, the dates along, a step line in its
   colour, a dot for each change: a tap says the date, the stage and its note); its sheet */
.card { position: relative; overflow: hidden; }
.card.has-goals { padding-top: 14px; }
.gstripe { position: absolute; top: 0; left: 0; right: 0; height: 5px; display: flex; gap: 2px; pointer-events: none; }
.gstripe i { flex: 1; background: var(--g); }
.card .goals { display: flex; flex-wrap: wrap; gap: 4px 6px; min-width: 0; }
.gchip { display: inline-flex; align-items: center; height: 22px; max-width: 100%; min-width: 0; padding: 0 7px; border-radius: 6px;
  border: 1.5px solid var(--g); color: var(--ink2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.gchip span { overflow: hidden; text-overflow: ellipsis; }
.gchip { position: relative; cursor: pointer; }
.gchip::after { content: ""; position: absolute; inset: -5px -2px; }  /* a little more than the chip, the rest of the card the card's */
.gchip:hover { background: var(--surf2); }
.gsw { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 3px; background: var(--g, var(--ink3)); }
.meter { display: inline-flex; gap: 2px; flex: none; }
.meter i { width: 6px; height: 10px; border-radius: 2px; background: var(--line); }
.meter i.on { background: var(--g); }
.board.goals-mode { scroll-snap-type: none; }
.app.goals-mode .colnav { display: none !important; }
.goals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--gap); padding-top: 4px; }
.gtile { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 10px 14px 12px; background: var(--surf); border: 1.5px solid var(--line);
  border-top: 5px solid var(--g); border-radius: 16px; cursor: pointer; }
.gtile:hover { border-color: var(--dash); border-top-color: var(--g); }
.gopen { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 44px; padding: 2px 0; border: 0; background: transparent;
  color: var(--ink); text-align: left; }
.gname { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.gstage { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--ink2); }
.gstage small { font-size: 13px; font-weight: 400; color: var(--ink3); }
.gchart { position: relative; width: 100%; min-height: 40px; }
.gchart svg { display: block; overflow: visible; }
.gchart svg text { font: 12px var(--text); fill: var(--ink3); }
.gchart svg .grid { stroke: var(--line); stroke-width: 1; }
.gchart svg .grid.soft { stroke: var(--line-soft); }
.gchart svg .line { stroke: var(--g); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.gchart svg .dot { fill: var(--g); stroke-width: 2; }
.gchart svg .dot.pending { stroke: var(--g); stroke-width: 2.5; }
.gchart svg .sel { fill: none; stroke: var(--ink); stroke-width: 2; }
.gchart .none { font-size: 14px; color: var(--ink3); padding: 8px 0; }
.gdot { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; border-radius: 50%; background: transparent; }
.gread { display: flex; align-items: center; gap: 2px; border-radius: 12px; background: var(--bg); font-size: 14px; color: var(--ink2); }
.gread .txt { flex: 1; min-width: 0; padding: 6px 4px; overflow-wrap: anywhere; }
.gread .txt b { color: var(--ink); }
.gread button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--purple-ink);
  display: inline-flex; align-items: center; justify-content: center; }
.gread button:disabled { color: var(--faint); }
.grelease { font-size: 14px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.grelease b { color: var(--ink); font-weight: 600; }
.grelease.none, .gcounts { color: var(--ink3); }
.gcounts { font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.gcounts b { color: var(--ink); font-variant-numeric: tabular-nums; }
.gtag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 7px; border-radius: 6px; border: 1.5px solid var(--g);
  font-size: 13px; font-weight: 700; color: var(--ink2); }
.gtag .gsw { width: 10px; height: 10px; }
.rel button .gsw { margin-right: 2px; }
.ggroup h3 { font-size: 14px; font-weight: 700; color: var(--ink2); margin: 4px 0 6px; display: flex; gap: 8px; align-items: baseline; }
.ggroup h3 .n { font-weight: 400; color: var(--ink3); }
.gcards { display: flex; flex-direction: column; gap: 10px; }
.ghist { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }
.ghist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: 12px; background: var(--surf); font-size: 15px; overflow-wrap: anywhere; }
.ghist li.sel { outline: 2px solid var(--g); outline-offset: -2px; }
.ghist li .meter { margin-top: 6px; }
.ghist li small { display: block; color: var(--ink3); font-size: 13px; }
.stages button .sn { color: var(--ink3); font-weight: 400; }
.stages button[aria-pressed="true"] .sn { color: #fff; }
.stages button.now { border-style: dashed; color: var(--ink2); }
.gmove { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--surf); border: 1.5px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.gpick button .gord { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #fff; color: var(--purple-fill); font-size: 13px; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center; }
/* a goal's page: the goal above its board, short enough that the board keeps most of the screen */
.goalhead { flex: none; display: flex; flex-direction: column; gap: 4px; margin: 0 var(--pad) 8px; padding: 4px 14px 10px; background: var(--surf);
  border: 1.5px solid var(--line); border-top: 5px solid var(--g); border-radius: 16px; min-width: 0; }
.gh-top { display: flex; align-items: center; flex-wrap: wrap; gap: 0 14px; min-width: 0; }
.gh-top .back { flex: none; min-height: 44px; display: inline-flex; align-items: center; gap: 2px; padding: 0 10px 0 0; border: 0; background: transparent;
  color: var(--purple-ink); font-size: 16px; font-weight: 700; }
.gh-top h2 { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; min-width: 0; overflow-wrap: anywhere; }
.gh-top h2:focus { outline: none; }
.gh-top h2:focus-visible { outline: 3px solid var(--purple-line); outline-offset: 2px; }
.gh-top .gstage { flex-wrap: wrap; }
.goalhead .gh-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 4px 22px; align-items: start; padding-top: 0; }
.gh-chart { width: 100%; min-width: 0; }
.gh-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gline { font-size: 14px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gline b { color: var(--ink); font-weight: 600; }
.gline.none { color: var(--ink3); }
.gacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.gacts .btn { min-height: 44px; padding: 0 14px; font-size: 15px; }
.gh-text .said { font-size: 14px; }
.gh-fold > summary { font-size: 15px; }
.goalhead .gh-fold[open] > .gh-body { padding-top: 4px; }
@media (min-width: 1100px) { .gline { -webkit-line-clamp: 1; } }  /* on its side the height is short: a line each, the whole in the sheet */
@media (min-width: 641px) and (max-width: 1099px) {  /* upright: a smaller chart, so the three actions keep to one row */
  .goalhead .gh-body { grid-template-columns: minmax(0, 1fr) 280px; }
  .gacts { gap: 6px; }
  .gacts .btn { padding: 0 12px; }
}
@media (max-width: 640px) {
  .goalhead { margin: 0 var(--pad) 6px; padding: 2px 12px 4px; }
  .gh-top .gstage { margin-left: auto; font-size: 14px; }
  .gh-top h2 { order: 3; flex-basis: 100%; font-size: 21px; padding-bottom: 2px; }
  .goalhead .gh-body { grid-template-columns: minmax(0, 1fr); }
  .gacts .btn { padding: 0 12px; }
}
.views.has-goals { grid-template-columns: repeat(6, minmax(0, 1fr)) minmax(0, .82fr); grid-auto-flow: row; }
.views .short { display: none; }
@media (min-width: 641px) and (max-width: 1099px) {
  .views.has-goals .full { display: none; }
  .views.has-goals .short { display: inline; }
  .views.has-goals { grid-template-columns: repeat(7, minmax(0, 1fr)); }
}

/* the sheets: a card, filters, a new card, a goal. Over the board on an iPad; the whole screen on a phone */
dialog { padding: 0; border: 1.5px solid var(--line); border-radius: 22px; background: var(--surf2); color: var(--ink);
  width: min(720px, calc(100vw - 48px)); max-height: calc(100dvh - 48px); overflow: hidden; }
dialog[open] { display: flex; flex-direction: column; }
dialog .seg { background: var(--bg); }
dialog::backdrop { background: rgba(0, 0, 0, .62); }
.sh-head { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.sh-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.sh-head h2 { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.sh-head .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sh-head .acts { flex: none; display: flex; align-items: flex-start; gap: 8px; }
.sh-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 18px; }
.sh-foot { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sh-foot.said-only:has(.said:empty) { display: none; }
.sh-foot .grow { flex: 1; min-width: 160px; font-size: 15px; color: var(--ink2); }
.close { flex: none; }
.group { display: flex; flex-direction: column; gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
.group > .k, .group > legend { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); padding: 0; margin-bottom: 8px; }
.group > .k { margin-bottom: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 16px; margin: 0; }
.facts div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.facts dt { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
.facts dd { margin: 0; font-size: 16px; color: var(--ink); overflow-wrap: anywhere; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { min-height: 44px; min-width: 44px; justify-content: center; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--line); background: transparent; font-size: 15px;
  font-weight: 600; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
.toggles button[aria-pressed="true"] { background: var(--purple-fill); border-color: var(--purple-fill); color: #fff; font-weight: 700; }
.toggles button[aria-pressed="true"]::before { content: "✓"; font-weight: 700; }
.toggles button:disabled { opacity: 1; cursor: not-allowed; }
.seg.wide button { font-size: 15px; }
.seg.wide button[aria-pressed="true"]::before { content: "✓ "; }
.work-seg button { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; }
.work-seg button[aria-pressed="true"]::before { content: "✓"; }
.qnext { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 12px 14px; border-radius: 16px; background: var(--surf); border: 1.5px solid var(--line); }
.qnext p { flex: 1; min-width: 200px; font-size: 15px; color: var(--ink2); }
.field { display: flex; gap: 8px; flex-wrap: wrap; }
.field input, .field select, textarea, .add-form input, .add-form select { min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); font-size: 16px; color: var(--ink); min-width: 0; }
.field input { flex: 1 1 220px; }
textarea { width: 100%; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
details.more > summary { min-height: 44px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; font-weight: 700; color: var(--purple-ink);
  list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸"; color: var(--ink3); }
details.more[open] > summary::before { content: "▾"; }
details.more > div { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.md { font-size: 16px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
.md > * + * { margin-top: 8px; }
.md h2, .md h3, .md h4 { font-size: 17px; font-weight: 700; margin-top: 12px; }
.md ul, .md ol { margin: 6px 0 0; padding-left: 22px; }
.md code { font-size: 14px; background: var(--bg); padding: 1px 5px; border-radius: 6px; color: var(--ink); }
.md pre { background: var(--bg); padding: 10px 12px; border-radius: 10px; overflow-x: auto; font-size: 14px; color: var(--ink); }
.md table { border-collapse: collapse; font-size: 15px; display: block; overflow-x: auto; }
.md td, .md th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.md .none { color: var(--ink3); }
.rel, .links, .notes { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }
.rel button { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--surf); text-align: left; font-size: 15px; }
.rel button .st { margin-left: auto; color: var(--ink3); font-size: 14px; white-space: nowrap; }
.rel button.open-blocker .st { color: var(--red-ink); font-weight: 700; }
.links a, .links .path { min-height: 48px; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 12px; border-radius: 12px;
  background: var(--surf); border: 1.5px solid var(--line); text-decoration: none; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.links a small, .links .path small { font-size: 13px; font-weight: 400; color: var(--ink3); }
.links .path { color: var(--ink); font-weight: 600; }
.links .path code { font-size: 13px; color: var(--ink2); }
/* where the player does it: the card's links to the apps on the unit, at the top of its sheet; its own questions'
   "Answer" filled, first */
.do { display: flex; flex-wrap: wrap; gap: 8px; }
.dobtn { flex: 0 1 auto; min-width: 120px; min-height: 56px; display: inline-flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 6px 20px; border-radius: 28px; border: 1.5px solid var(--purple-line); background: var(--surf); color: var(--ink);
  text-decoration: none; font-size: 17px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.dobtn small { font-size: 13px; font-weight: 500; color: var(--ink3); }
.dobtn.own { background: var(--purple-fill); border-color: var(--purple-fill); color: #fff; font-size: 19px; min-width: 150px; }
.dobtn.own small { color: #FFFFFF; }
.dobtn:active { background: var(--purple-tint); }
.dobtn.own:active { background: var(--purple); }
@media (max-width: 640px) { .dobtn { flex: 1 1 140px; } }
.links a.big { background: var(--purple-fill); border-color: var(--purple-fill); color: #fff; font-size: 18px; min-height: 56px; }
.links a.big small { color: #FFFFFF; }
.notes li { padding: 8px 12px; border-radius: 12px; background: var(--surf); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.notes li small { display: block; color: var(--ink3); font-size: 13px; white-space: normal; margin-bottom: 2px; }
.about { font-size: 14px; color: var(--ink3); display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.about b { color: var(--ink2); font-weight: 600; }
.said { font-size: 15px; color: var(--ink2); min-height: 22px; }
.live-note { font-size: 15px; color: var(--ink2); padding: 10px 12px; border-radius: 12px; background: #1F2622; border: 1.5px dashed var(--green); }
.add-form { display: flex; flex-direction: column; gap: 16px; }
.add-form label.k { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); }
.add-form input[type=text] { width: 100%; font-size: 18px; }
.add-form select { width: 100%; }
.hint { font-size: 15px; color: var(--ink3); }

/* an iPad upright: three columns in view, the board scrolls sideways a column at a time */
@media (max-width: 1099px) {
  .colnav { display: grid; }
  .grid { grid-template-columns: repeat(5, var(--colw)); width: max-content; }
  .board { --colw: calc((100vw - 2 * var(--pad) - 2 * var(--gap)) / 3); scroll-snap-type: x mandatory; }
}
/* a phone: one column at a time */
@media (max-width: 640px) {
  :root { --pad: 16px; --gap: 16px; }
  .top { padding-top: 6px; gap: 8px; flex-wrap: wrap; }
  .top h1 { font-size: 24px; }
  .top .end { gap: 6px; }
  .home { font-size: 16px; }
  .btn { padding: 0 12px; }
  .wide-only { display: none; }
  #addBtn { padding: 0; width: 48px; }
  #addBtn .lbl { display: none; }
  .board { --colw: calc(100vw - 2 * var(--pad)); }
  .cell { align-self: start; }  /* one column in view: it ends with its cards, not with the longest column's */
  .seg button { font-size: 14px; padding: 4px 4px; }
  .views { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .views button { gap: 4px; }
  .views.has-goals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .views.has-goals [data-view="goals"] { grid-column: 1 / -1; }
  dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; border: 0; margin: 0; }
  .sh-head h2 { font-size: 23px; }
  .sh-head .acts { flex-direction: column-reverse; align-items: stretch; }  /* Done on top, Ready under it */
  .find input { width: 92px; }
  .sub .sync { order: 2; }  /* "Card #" on the first line, with the count, and what is not synced under them */
  .find { order: 1; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="home" id="home" href="/"><svg class="svg-i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#A79FB4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Music room</a>
    <h1>Board</h1>
    <div class="views seg" id="views" role="group" aria-label="Which cards"></div>
    <div class="end">
      <button type="button" class="btn" id="filtersBtn" aria-haspopup="dialog">Filters</button>
      <button type="button" class="btn go" id="addBtn" aria-haspopup="dialog" aria-label="Add a card"><svg class="svg-i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"></path></svg><span class="lbl">Add</span></button>
    </div>
  </header>
  <div class="banner" id="error" role="alert" hidden><span id="errorText"></span><button type="button" id="errorOk">OK</button></div>
  <section class="goalhead" id="goalHead" aria-labelledby="goalPageTitle" hidden></section>
  <div class="sub"><div id="sub"></div>
    <form class="find" id="find" role="search" hidden><label class="sr-only" for="findIn">Open a card by its number</label><input id="findIn" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off" spellcheck="false" maxlength="60" placeholder="Card #"></form></div>
  <nav class="colnav" id="colnav" aria-label="Columns"></nav>
  <main class="board" id="board" aria-label="The cards"></main>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle"></dialog>
<dialog id="filters" aria-labelledby="filtersTitle"></dialog>
<dialog id="add" aria-labelledby="addTitle"></dialog>
<dialog id="goal" aria-labelledby="goalTitle"></dialog>
<div class="sr-only" id="say" aria-live="polite"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("#home").href = `http://${location.hostname}/`;

// --- the contract (dobro-transcription board/board.py; board/store.py)
const COLS = [["backlog", "Backlog"], ["next", "Next"], ["doing", "Doing"], ["waiting", "Waiting"], ["done", "Done"]];
const COL_NAME = Object.fromEntries(COLS);
const WHO = [["player", "You"], ["claude", "Claude"], ["others", "Others"]];
const WHO_NAME = Object.fromEntries(WHO);
// the kind of work it is for the player: [id, its name, a short word for a card, what it covers]
const WORK = [
  ["listen", "Listen & evaluate", "Listen", "Listening and evaluating: reviews, takes, A/Bs by ear"],
  ["play", "Play & sing", "Play", "Playing an instrument and singing: what wants recording"],
  ["agent", "Manage the agent", "Agent", "Managing the agent: decisions, priorities, what it built, Claude's software work"],
  ["people", "People", "People", "Communicating with other people: emails, maintainers, sign-ups, requests"],
  ["hardware", "Hardware", "Hardware", "Working with the hardware"],
];
const WORK_NAME = Object.fromEntries(WORK.map((w) => [w[0], w[1]]));
const WORK_WORD = Object.fromEntries(WORK.map((w) => [w[0], w[2]]));
const IMP = [[1, "High"], [2, "Medium"], [3, "Low"]];
const IMP_NAME = Object.fromEntries(IMP);
const EFFORT_P = ["", "5m", "15m", "30m", "1h", "2h", "half-day", "day+"];
const EFFORT_C = ["", "S", "M", "L", "XL"];
const P_BUCKET = { "5m": "short", "15m": "short", "30m": "hour", "1h": "hour", "2h": "long", "half-day": "long", "day+": "long" };
const P_BUCKETS = [["short", "Up to 15m"], ["hour", "30m to 1h"], ["long", "2h or more"]];
const OLD_DAYS = 14;  // Done shows the last two weeks; older is folded
const HUES = ["#B9A0FF", "#7DD3FC", "#4ADE80", "#E8B93B", "#FF8F85", "#F0ABFC", "#5EEAD4", "#CEC7DA"];
// the goals (2026-10-20): each at a stage of ten, from an idea (1) to released (10); a colour of the ten. The stages'
// labels are the JSON's own ("stages") when it has all ten; these otherwise
const STAGE_LABELS = ["Idea", "Idea with a plan", "Testable prototype", "Tested prototype", "Rough but usable", "Decent",
  "Getting pretty good", "Almost release-ready", "Release-ready", "Released"];
const TOP = STAGE_LABELS.length;
function stages() {  // [[1, "Idea"], ... [10, "Released"]]
  const own = S.data && S.data.stages;
  const labels = Array.isArray(own) && own.length === TOP && own.every((x) => typeof x === "string" && x.trim()) ? own : STAGE_LABELS;
  return labels.map((x, i) => [i + 1, x]);
}
function stageName(n) { const s = stages()[n - 1]; return s ? s[1] : ""; }
function stageText(n) { return stageName(n) ? `${n} · ${stageName(n)}` : String(n ?? ""); }
const NOTE_BY = { player: ["player", "You"], claude: ["claude", "Claude"] };  // who wrote a goal's note, as a badge
const GOAL_COLORS = ["teal", "orange", "pink", "green", "gold", "blue", "red", "violet", "lime", "sky"];
const BY_STATUS = [["doing", "Doing"], ["next", "Next"], ["waiting", "Waiting"], ["backlog", "Backlog"], ["done", "Done"]];
const DAY = 86400000;

// --- where to focus: a kind of work (the live cards too: the reviews are listening, the exercises playing), or all
const VIEWS = WORK.map(([id, name, , about]) => ({ id, name, about, test: (c) => c.work === id }))
  .concat([{ id: "all", name: "All", about: "Every card", test: () => true }]);
// and, when the cards come with goals, the goals: each one's progress, its cards
const GOALS_VIEW = { id: "goals", name: "Goals", about: "The project's large-scale goals: their progress and their cards", test: () => true };
const VIEW = Object.fromEntries(VIEWS.concat([GOALS_VIEW]).map((v) => [v.id, v]));
const ADD_WHO = { agent: ["claude"] };  // who a new card is for, by its work (else you)

// --- remembered on this device (the view, filters, grouping); the page works without it
const KEY = "board.v1";
const EMPTY_F = () => ({ goal: [], area: [], importance: [], who: [], effortP: [], effortC: [], ready: [] });
function loadPrefs() {
  try { const p = JSON.parse(localStorage.getItem(KEY) || "{}"); return p && typeof p === "object" ? p : {}; } catch (e) { return {}; }
}
const P = Object.assign({ view: "all", group: "columns", older: false, col: null, addArea: "", addWork: "play" }, loadPrefs());
P.filters = Object.assign(EMPTY_F(), P.filters || {});
delete P.filters.kind;
if (!VIEW[P.view]) P.view = "all";
function savePrefs() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

const S = { data: null, open: null, said: "", busy: false, loadedOnce: false, goal: null, gsel: {}, gmove: null, goalEdit: null,
  goalPage: null, gsection: null, gsaid: "", mode: null };

// --- the server
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.detail && (typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail))) || `${r.status} ${r.statusText}`);
  return j;
}
function showError(msg, info) { $("#errorText").textContent = msg; $("#error").classList.toggle("info", !!info); $("#error").hidden = false; }
$("#errorOk").onclick = () => { $("#error").hidden = true; };
function say(text) { $("#say").textContent = ""; setTimeout(() => { $("#say").textContent = text; }, 30); }

async function load() {
  try {
    S.data = await api("GET", "/api/board");
    render();
    openHashCard();  // a link to a card (#42)
    const c = S.open && byId(S.open), a = document.activeElement;
    if (c && $("#sheet").open && !S.busy && JSON.stringify(c) !== S.sheetKey && !(a && $("#sheet").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) renderSheet(true);
    const g = S.goal && goalOf(S.goal);
    if ($("#goal").open && !S.busy && (!g || JSON.stringify(g) !== S.goalKey) && !(a && $("#goal").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) renderGoal(true);
  } catch (e) {
    if (!S.data) showError(`The board did not load: ${e.message}`);
  }
}

// --- the cards
function all() { return S.data ? S.data.cards.concat(S.data.live || []) : []; }
function byId(id) { return all().find((c) => c.id === id); }
function areaOf(id) {
  const list = (S.data && S.data.areas) || [];
  const i = list.findIndex((a) => a.id === id);
  if (i >= 0) return { ...list[i], hue: hasGoals() ? "var(--ink3)" : HUES[i % HUES.length] };  // with goals, colour is theirs
  return { id, name: id ? id : "No area", about: "", hue: "var(--ink3)" };
}
// the goals: none in a board pushed before them, and then the page is as it was
function goals() { return (S.data && S.data.goals) || []; }
function hasGoals() { return goals().length > 0; }
function goalOf(id) { return goals().find((g) => g.id === id); }
function goalColor(g) { return GOAL_COLORS.includes(g.color) ? `var(--g-${g.color})` : "var(--ink3)"; }
function goalShort(g) { return g.short || g.name; }
function cardGoals(c) { return (c.goals || []).map(goalOf).filter(Boolean); }
function goalCards(g) { return S.data.cards.filter((c) => (c.goals || []).includes(g.id)); }
function goalFilter() {  // the goals chosen in Filters that are on the board ("none": the cards with no goal); not on a goal's page
  if (!hasGoals() || pageGoal()) return [];
  const ids = new Set(goals().map((g) => g.id).concat(["none"]));
  return (P.filters.goal || []).filter((v) => ids.has(v));
}
// a goal's page (#goal=<id>): the goal at the top, the board under it with only its cards
function pageGoal() { return (S.goalPage && goalOf(S.goalPage)) || null; }
function boardView() { return pageGoal() && !WORK_NAME[P.view] ? "all" : P.view; }  // Goals, or All: All within the goal

// --- the markdown of a card's details: headings, paragraphs, lists, tables, code. Every bit of text
// escaped; a link is a link only when it goes to http(s), else its text.
function inline(s) {
  return s.split(/(`[^`]+`)/).map((part) => {
    if (/^`[^`]+`$/.test(part)) return `<code>${esc(part.slice(1, -1))}</code>`;
    const out = [];
    let last = 0;
    const re = /\[([^\]]+)\]\(([^)\s]*)\)/g;
    let m;
    while ((m = re.exec(part))) {
      out.push(emph(esc(part.slice(last, m.index))));
      out.push(/^https?:\/\//i.test(m[2]) ? `<a href="${esc(m[2])}" target="_blank" rel="noopener noreferrer">${emph(esc(m[1]))}</a>` : emph(esc(m[1])));
      last = re.lastIndex;
    }
    out.push(emph(esc(part.slice(last))));
    return out.join("");
  }).join("");
}
function emph(s) { return s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>"); }

function markdown(text) {
  const lines = String(text || "").replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (/^```/.test(line)) {
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) { const n = Math.min(h[1].length + 1, 4); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) {
        if (/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i])) continue;
        rows.push(lines[i].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim())));
      }
      out.push("<table>" + rows.map((r, n) => "<tr>" + r.map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }

      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((x) => `<li>${inline(x)}</li>`).join("") + `</${tag}>`);
      continue;
    }
    const buf = [];
    for (; i < lines.length && lines[i].trim() && !BLOCK.test(lines[i]); i++) buf.push(lines[i].trim());
    out.push(`<p>${inline(buf.join(" "))}</p>`);

}

      <div class="group"><span class="k">Claude's size</span>${seg("Claude's size", EFFORT_C.map((e) => [e, e || "Not set"]), c.effort_claude, "data-effc")}</div>
      <div class="group"><label class="k" for="areaSel">Area</label><div class="field"><select id="areaSel" data-field="area">${(S.data.areas || []).map((a) => `<option value="${esc(a.id)}"${a.id === c.area ? " selected" : ""}>${esc(a.name)}</option>`).join("")}</select></div></div>
      ${wait ? "" : `<div class="group"><label class="k" for="waitText">Waiting on</label><div class="field"><input id="waitText" type="text" maxlength="300" value="${esc(waitDraft ?? c.waiting_on)}" placeholder="Who or what"><button type="button" class="btn" data-act="wait">Save</button></div></div>`}
    </div></details>

    ${ob.length ? `<div class="group"><span class="k">Blocked by</span><ul class="rel">${ob.map((b) => `<li><button type="button" data-open="${esc(b.id)}" class="${b.status !== "done" ? "open-blocker" : ""}"${b.missing ? " disabled" : ""}>${b.number ? `<span class="cnum">${numText(b)}</span>` : ""}${esc(b.title)}<span class="st">${b.missing ? "not on the board" : b.status === "done" ? "Done" : COL_NAME[b.status]}</span></button></li>`).join("")}</ul></div>` : ""}
    ${bl.length ? `<div class="group"><span class="k">Blocks</span><ul class="rel">${bl.map((b) => `<li><button type="button" data-open="${esc(b.id)}">${b.number ? `<span class="cnum">${numText(b)}</span>` : ""}${esc(b.title)}<span class="st">${COL_NAME[b.status]}</span></button></li>`).join("")}</ul></div>` : ""}
    ${rest.length ? `<div class="group"><span class="k">Links</span><ul class="links">${rest.map((l) => linkHtml(l)).join("")}</ul></div>` : ""}
    <div class="group"><span class="k">Notes</span>${notes ? `<ul class="notes">${notes}</ul>` : ""}
      <label class="sr-only" for="noteText">A note</label><textarea id="noteText" maxlength="4000" placeholder="A note for this card"></textarea>

    <div class="about">${c.source ? `<span><b>Source</b> ${esc(c.source)}</span>` : c.new ? "<span><b>Source</b> added on the board, not synced yet</span>" : ""}
      <span><b>Created</b> ${esc(niceDate(c.created) || "—")} · <b>Updated</b> ${esc(niceDate(c.updated) || "—")}${c.done ? ` · <b>Done</b> ${esc(niceDate(c.done))}` : ""}</span>
      <span>${c.number ? `${numText(c)} · ` : ""}${esc(c.id)}</span></div>

}

// a card's goals in its sheet: each opens its goal; "Goals…" chooses them (the first chosen the most relevant)
function cardGoalsHtml(c) {
  if (!hasGoals()) return "";
  const gs = cardGoals(c);
  const list = gs.length ? `<ul class="rel">${gs.map((g) => `<li><button type="button" data-goal-open="${esc(g.id)}" style="--g:${goalColor(g)}"><i class="gsw" aria-hidden="true"></i>${esc(g.name)}<span class="st">${esc(stageText(g.stage))}</span></button></li>`).join("")}</ul>`
    : '<p class="hint">Not part of a goal yet.</p>';
  const pick = S.goalEdit;
  const editor = pick ? `<div class="gmove"><div class="toggles gpick" role="group" aria-label="Its goals, the most relevant first">${goals().map((g) => {
      const i = pick.indexOf(g.id);
      return `<button type="button" data-goalpick="${esc(g.id)}" aria-pressed="${i >= 0}" style="--g:${goalColor(g)}"><i class="gsw" aria-hidden="true"></i>${esc(g.name)}${i >= 0 ? `<span class="gord" aria-label="${i + 1}${i ? "" : ", the most relevant"}">${i + 1}</span>` : ""}</button>`; }).join("")}</div>
      <p class="hint">In the order chosen: the first is the most relevant, its colour first on the card.</p>
      <div class="row"><button type="button" class="btn go" data-act="goals-save">Save the goals</button><button type="button" class="btn" data-act="goals-cancel">Cancel</button></div></div>`
    : '<div><button type="button" class="btn" data-act="goals-edit" aria-haspopup="true">Goals…</button></div>';
  return `<div class="group" id="cardGoals"><span class="k">Goals</span>${list}${editor}</div>`;
}

async function edit(fn, words) {
  if (S.busy) return;
  S.busy = true;
  try {
    const r = await fn();
    if (r && r.card) {
      const list = S.data.cards, i = list.findIndex((x) => x.id === r.card.id);
      if (i >= 0) list[i] = r.card; else list.push(r.card);
    }
    if (r && r.goal) {
      const list = S.data.goals, i = list.findIndex((x) => x.id === r.goal.id);
      if (i >= 0) list[i] = r.goal;
    }
    recount();
    S.said = r && r.change === null ? "No change." : `${words} Not synced to the desktop yet.`;
    say(S.said);
    render();
    if ($("#sheet").open) renderSheet(true);
    if ($("#goal").open) renderGoal(true);
    // a card moved or its who changed: which others Claude can take up may change too (a blocker done), so the rest
    // are read again
    const set = r && r.change && r.change.set;
    if (set && ("status" in set || "who" in set)) setTimeout(load, 0);
    return r;
  } catch (e) {
    showError(`Not saved: ${e.message}`);
  } finally {
    S.busy = false;
  }
}
const patch = (fields, words) => edit(() => api("PATCH", `/api/cards/${encodeURIComponent(S.open)}`, fields), words);

$("#sheet").addEventListener("click", (ev) => {
  const dlg = $("#sheet");
  if (ev.target === dlg) { dlg.close(); return; }  // a tap on the backdrop
  const b = ev.target.closest("button");
  if (!b || b.disabled) return;
  const c = byId(S.open);
  if (b.dataset.act === "close") dlg.close();
  else if (b.dataset.open) openCard(b.dataset.open);
  else if (b.dataset.goalOpen) openGoalPage(b.dataset.goalOpen);
  else if (!c || c.live) return;
  else if (b.dataset.act === "goals-edit") { S.goalEdit = (c.goals || []).slice(); renderSheet(true); const el = dlg.querySelector("[data-goalpick]"); if (el) el.focus(); }
  else if (b.dataset.act === "goals-cancel") { S.goalEdit = null; renderSheet(true); dlg.querySelector('[data-act="goals-edit"]').focus(); }
  else if (b.dataset.goalpick) {
    const id = b.dataset.goalpick;
    S.goalEdit = S.goalEdit.includes(id) ? S.goalEdit.filter((x) => x !== id) : S.goalEdit.concat([id]);
    renderSheet(true); dlg.querySelector(`[data-goalpick="${CSS.escape(id)}"]`).focus();
  } else if (b.dataset.act === "goals-save") {
    const chosen = S.goalEdit.slice(), names = chosen.map((id) => (goalOf(id) || { name: id }).name);
    patch({ goals: chosen }, chosen.length ? `Goals: ${names.join(", ")}.` : "No goals.").then((r) => {
      if (r) { S.goalEdit = null; renderSheet(true); const el = dlg.querySelector('[data-act="goals-edit"]'); if (el) el.focus(); }
    });
  }
  else if (b.dataset.act === "ready") patch({ ready: !c.ready }, c.ready ? "Ready cleared." : "Marked ready.").then(() => { const el = dlg.querySelector('[data-act="ready"]'); if (el) el.focus(); });
  else if (b.dataset.status) patch({ status: b.dataset.status }, `Moved to ${COL_NAME[b.dataset.status]}.`);
  else if (b.dataset.imp) patch({ importance: +b.dataset.imp }, `${IMP_NAME[+b.dataset.imp]} importance.`);
  else if (b.dataset.work) patch({ work: b.dataset.work }, `Work: ${WORK_NAME[b.dataset.work]}.`);
  else if (b.dataset.effc !== undefined) patch({ effort_claude: b.dataset.effc }, `Claude's size: ${b.dataset.effc || "not set"}.`);
  else if (b.dataset.who) {
    const w = b.dataset.who, who = c.who.includes(w) ? c.who.filter((x) => x !== w) : WHO.map(([x]) => x).filter((x) => x === w || c.who.includes(x));
    patch({ who }, `For ${whoWords(who)}.`);
  } else if (b.dataset.act === "claude-next") edit(() => api("POST", `/api/cards/${encodeURIComponent(S.open)}/claude-next`), "Queued for Claude: in Next, high importance.");
  else if (b.dataset.act === "wait") patch({ waiting_on: dlg.querySelector("#waitText").value }, "Waiting on saved.");
  else if (b.dataset.act === "note") {
    const t = dlg.querySelector("#noteText"), text = t.value.trim();
    if (!text) { t.focus(); return; }
    edit(() => api("POST", `/api/cards/${encodeURIComponent(S.open)}/notes`, { note: text }), "Note added.").then((r) => { if (r) { const tt = $("#noteText"); if (tt) tt.value = ""; } });
  }
});
$("#sheet").addEventListener("change", (ev) => {

// --- a goal's page (#goal=<id>, so a reload or the back button keeps it): the goal at the top (its stage, chart,
// what release-ready and released mean, a move, a note, its history and notes), and the board under it, its cards only
function goalHash() { const m = /^#goal=(.+)$/.exec(location.hash); return m ? decodeURIComponent(m[1]) : null; }
function closeSheets() {  // before a goal's page opens: no sheet left over it, and no focus sent back behind it
  for (const id of ["#sheet", "#goal"]) if ($(id).open) { S.swap = true; $(id).close(); }
}
function openGoalPage(id) {
  closeSheets();
  if (S.goalPage !== id) {
    const depth = ((history.state && history.state.goalDepth) || 0) + 1;  // goals' pages opened in a row here
    history.pushState({ goalDepth: depth }, "", `#goal=${encodeURIComponent(id)}`);
    S.gsaid = "";
    delete S.gsel[id];  // it opens short: a dot's readout only once a dot is tapped
    route();
    $("#board").scrollTop = 0;
  }
  const t = $("#goalPageTitle");
  if (t) t.focus({ preventScroll: true });
  const g = goalOf(id);
  if (g) say(`${g.name}: ${stageText(g.stage)}. ${filtered().length} of its cards.`);
}
function leaveGoalPage() {  // "‹ All goals": the Goals view, by the back button's way when the pages were opened here
  P.view = "goals"; savePrefs();
  const depth = (history.state && history.state.goalDepth) || 0;
  if (depth > 0) history.go(-depth);
  else { history.replaceState(null, "", location.pathname + location.search); route(); }
}
function route() {
  S.goalPage = goalHash();
  if (S.data) render();
}
addEventListener("popstate", () => { closeSheets(); route(); const g = pageGoal(); if (!g) { const t = document.querySelector('#views [aria-pressed="true"]'); if (t) t.focus({ preventScroll: true }); } });
function renderGoalHead(g) {

    + (g.shipped ? `<p class="gline" title="${esc(g.shipped)}"><b>Released (10):</b> ${esc(g.shipped)}</p>` : "");

    <button type="button" class="btn" data-gsheet="note" aria-haspopup="dialog">Add a note</button>

  el.innerHTML = `<div class="gh-top"><button type="button" class="back" data-act="all-goals">${glyph("left", 20)}All goals</button>

    ${phone.matches ? `<details class="more gh-fold"${P.headOpen ? " open" : ""}><summary>Its chart, a move, a note</summary>${body}</details>` : body}`;

}
$("#goalHead").addEventListener("toggle", (ev) => {  // the phone's fold, kept per device

}, true);

// --- a goal's sheet, from its page: "Move to stage…" (the ten, then a note), or its notes and history
function openGoalSheet(id, section, from) {
  S.gfrom = from || document.activeElement;
  S.goal = id; S.lastGoal = id; S.gsection = section === "move" ? "move" : "notes"; S.lastGsection = section; S.said = "";
  S.gmove = null;
  renderGoal(false);
  const dlg = $("#goal");
  if (!dlg.open) dlg.showModal();
  drawCharts(dlg);
  dlg.querySelector(".sh-body").scrollTop = 0;
  (section === "note" ? dlg.querySelector("#gnoteText") : dlg.querySelector(".close")).focus();
}
function renderGoal(keep) {
  const g = goalOf(S.goal), dlg = $("#goal");
  if (!g) { if (dlg.open) dlg.close(); return; }
  S.goalKey = JSON.stringify(g);
  const body = dlg.querySelector(".sh-body"), scroll = body ? body.scrollTop : 0;
  const val = (sel) => (dlg.querySelector(sel) ? dlg.querySelector(sel).value : "");
  const noteDraft = val("#gnoteText"), moveDraft = val("#gmoveNote");
  const col = goalColor(g);
  const head = `<div class="sh-head" style="--g:${col}"><div class="t"><div class="meta"><span class="gtag"><i class="gsw" aria-hidden="true"></i>Goal</span><span class="gstage">${meterHtml(g.stage)}${esc(stageText(g.stage))}</span>${g.pending ? `<span class="flag unsynced">${ICON.unsynced}Not synced yet</span>` : ""}</div>
      <h2 id="goalTitle">${esc(g.name)}</h2></div><button type="button" class="btn close" data-act="close">Done</button></div>`;
  let inner;
  if (S.gsection === "move") {
    const ladder = stages().map(([n, name]) => n === g.stage
      ? `<button type="button" class="now" disabled aria-label="${n}, ${esc(name)}: the stage now"><span class="sn">${n} ·</span> ${esc(name)} (now)</button>`
      : `<button type="button" data-stage="${n}" aria-pressed="${S.gmove === n}"><span class="sn">${n} ·</span> ${esc(name)}</button>`).join("");
    const move = S.gmove ? `<div class="gmove"><label class="k" for="gmoveNote">What changed (a note, if you like)</label>
        <textarea id="gmoveNote" maxlength="4000" placeholder="Why it is ${esc(stageText(S.gmove))} now"></textarea>
        <div class="row"><button type="button" class="btn go" data-act="gmove">Move to ${esc(stageText(S.gmove))}</button><button type="button" class="btn" data-act="gmove-cancel">Cancel</button></div></div>` : "";
    inner = `<div class="group"><span class="k" id="gmoveK">Move to stage…</span><div class="toggles stages" role="group" aria-labelledby="gmoveK">${ladder}</div>${move}</div>
      <p class="hint">Release-ready (9): ${esc(g.release || "not written yet")}${g.shipped ? `. Released (10): ${esc(g.shipped)}` : ""}.</p>`;
  } else {
    const hist = (g.history || []).map((h, i) => [h, i]).reverse().map(([h, i]) => `<li data-entry="${i}">${meterHtml(h.stage)}<div><small>${esc(niceDay(h.date))}${h.pending ? " · not synced yet" : ""}</small><b>${esc(stageText(h.stage))}</b>${h.note ? ` ${esc(h.note)}` : ""}</div></li>`).join("");
    const notes = (g.notes || []).slice().reverse().map((n) => `<li><small>${NOTE_BY[n.by] ? `<span class="badge ${NOTE_BY[n.by][0]}">${NOTE_BY[n.by][1]}</span> ` : ""}${esc(niceDay(n.date))}${n.pending ? " · not synced yet" : ""}</small>${esc(n.text)}</li>`).join("");
    inner = `${g.about ? `<p class="md">${esc(g.about)}</p>` : ""}
      <div class="group"><span class="k">Release-ready (9) means</span><p class="md${g.release ? "" : " none"}">${g.release ? esc(g.release) : "Not written yet."}</p></div>
      ${g.shipped ? `<div class="group"><span class="k">Released (10) means</span><p class="md">${esc(g.shipped)}</p></div>` : ""}
      <div class="group"><span class="k">Notes</span>
        <label class="sr-only" for="gnoteText">A note on this goal</label><textarea id="gnoteText" maxlength="4000" placeholder="A note on this goal"></textarea>
        <div><button type="button" class="btn outline-p" data-act="gnote">Add the note</button></div>
        ${notes ? `<ul class="notes">${notes}</ul>` : ""}</div>
      <div class="group"><span class="k">History</span>${hist ? `<ol class="ghist" reversed>${hist}</ol>` : '<p class="hint">No stages recorded yet.</p>'}</div>
      <div class="about"><span>${esc(g.id)} · ${esc(g.color || "")}</span></div>`;
  }
  dlg.innerHTML = `${head}<div class="sh-body">${inner}</div><div class="sh-foot said-only"><span class="grow said">${esc(S.said)}</span></div>`;
  if (dlg.querySelector("#gnoteText")) dlg.querySelector("#gnoteText").value = noteDraft;
  if (dlg.querySelector("#gmoveNote")) dlg.querySelector("#gmoveNote").value = moveDraft;
  if (dlg.open) drawCharts(dlg);
  if (keep) dlg.querySelector(".sh-body").scrollTop = scroll;
}
$("#goal").addEventListener("click", (ev) => {
  const dlg = $("#goal");
  if (ev.target === dlg) { dlg.close(); return; }
  const b = ev.target.closest("button");
  if (!b || b.disabled || chartClick(b)) return;
  const g = goalOf(S.goal);
  if (b.dataset.act === "close" || !g) { dlg.close(); return; }
  const url = `/api/goals/${encodeURIComponent(g.id)}`;
  if (b.dataset.stage) {

$("#goal").addEventListener("close", () => {

    : document.querySelector(`#goalHead [data-gsheet="${CSS.escape(S.lastGsection || "")}"]`) || $("#goalPageTitle");

      ${group("effortC", "Claude's size", EFFORT_C.filter(Boolean).map((e) => [e, e]))}
    </div>
    <div class="sh-foot"><button type="button" class="btn" data-act="clear"${nFilters() ? "" : " disabled"}>Clear filters</button>
      <button type="button" class="btn go" data-act="close" style="margin-left:auto">Show ${n} card${n === 1 ? "" : "s"}</button></div>`;
}
$("#filtersBtn").onclick = () => { renderFilters(); $("#filters").showModal(); $("#filters").querySelector(".close").focus(); };
$("#filters").addEventListener("click", (ev) => {
  const dlg = $("#filters");
  if (ev.target === dlg) { dlg.close(); return; }
  const b = ev.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.act === "close") { dlg.close(); return; }
  if (b.dataset.act === "clear") P.filters = EMPTY_F();
  else if (b.dataset.group) P.group = b.dataset.group;
  else if (b.dataset.f) {
    const key = b.dataset.f, v = key === "importance" ? +b.dataset.v : b.dataset.v, list = P.filters[key];
    P.filters[key] = list.includes(v) ? list.filter((x) => x !== v) : list.concat([v]);
  }
  savePrefs(); render();
  const focus = b.dataset.f ? `[data-f="${b.dataset.f}"][data-v="${CSS.escape(b.dataset.v)}"]` : b.dataset.group ? `[data-group="${b.dataset.group}"]` : ".close";
  renderFilters(); const el = dlg.querySelector(focus); if (el) el.focus();
});
$("#filters").addEventListener("close", () => $("#filtersBtn").focus());

// --- a new card: a title, an area, who and its work; the rest defaults (Backlog, medium importance)
function renderAdd() {
  const dlg = $("#add"), areas = S.data.areas || [];
  const work = WORK_NAME[P.view] ? P.view : WORK_NAME[P.addWork] ? P.addWork : "play";  // All and Goals: the last chosen
  const area = P.filters.area.length === 1 ? P.filters.area[0] : areas.some((a) => a.id === P.addArea) ? P.addArea : (areas[0] || {}).id;
  S.addWho = (ADD_WHO[work] || ["player"]).slice(); S.addWork = work;
  dlg.innerHTML = `<div class="sh-head"><div class="t"><h2 id="addTitle">Add a card</h2></div><button type="button" class="btn close" data-act="close">Cancel</button></div>
    <form class="sh-body add-form" id="addForm" novalidate>
      <div class="group"><label class="k" for="addTitleIn">Title</label><input id="addTitleIn" type="text" maxlength="200" required autocomplete="off" placeholder="What wants doing"></div>
      <div class="group"><label class="k" for="addArea">Area</label><select id="addArea">${areas.map((a) => `<option value="${esc(a.id)}"${a.id === area ? " selected" : ""}>${esc(a.name)}</option>`).join("")}</select></div>
      <div class="group"><span class="k">Who</span><div class="toggles" role="group" aria-label="Who" id="addWho"></div></div>
      <div class="group"><span class="k">Work</span><div id="addWork"></div></div>
      <p class="hint">It goes into Backlog, medium importance${pageGoal() ? `, for ${esc(pageGoal().name)}` : ""}. Open it to move it or change the rest.</p>
    </form>
    <div class="sh-foot"><span class="grow said" id="addSaid" aria-live="polite"></span><button type="submit" form="addForm" class="btn go">Add the card</button></div>`;
  renderAddChoices();
}
function renderAddChoices() {
  $("#addWho").innerHTML = WHO.map(([w, label]) => `<button type="button" data-who="${w}" aria-pressed="${S.addWho.includes(w)}"${S.addWho.length === 1 && S.addWho[0] === w ? " disabled" : ""}>${label}</button>`).join("");
  $("#addWork").innerHTML = workSeg(S.addWork);
}
$("#addBtn").onclick = () => {
  if (!S.data || !(S.data.areas || []).length) { showError("There are no areas yet: push the cards from the desktop first (tools/push-board)."); return; }
  renderAdd(); $("#add").showModal(); $("#addTitleIn").focus();
};
$("#add").addEventListener("click", (ev) => {
  const dlg = $("#add");
  if (ev.target === dlg) { dlg.close(); return; }
  const b = ev.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.act === "close") dlg.close();
  else if (b.dataset.who) {
    const w = b.dataset.who;
    S.addWho = S.addWho.includes(w) ? S.addWho.filter((x) => x !== w) : WHO.map(([x]) => x).filter((x) => x === w || S.addWho.includes(x));
    renderAddChoices(); $(`#addWho [data-who="${w}"]`).focus();
  } else if (b.dataset.work) { S.addWork = b.dataset.work; renderAddChoices(); $(`#addWork [data-work="${b.dataset.work}"]`).focus(); }
});
$("#add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const title = $("#addTitleIn").value.trim();
  if (!title) { $("#addSaid").textContent = "A card needs a title."; $("#addTitleIn").focus(); return; }
  const area = $("#addArea").value;
  P.addArea = area; if (!WORK_NAME[P.view]) P.addWork = S.addWork; savePrefs();
  try {
    const r = await api("POST", "/api/cards", { title, area, who: S.addWho, work: S.addWork });
    const pg = pageGoal();
    if (pg) r.card = (await api("PATCH", `/api/cards/${encodeURIComponent(r.card.id)}`, { goals: [pg.id] })).card;  // its goal: a second edit
    S.data.cards.push(r.card);
    recount();
    $("#add").close();
    // shown even if this view or a filter would hide it: say where it went
    const hidden = !filtered().some((c) => c.id === r.card.id);
    render();
    say(`Added "${r.card.title}" to Backlog${hidden ? ", which this view or a filter hides" : ""}. Not synced yet.`);
    const el = document.querySelector(`.card[data-id="${CSS.escape(r.card.id)}"]`);
    if (el) {
      jump("backlog", false);
      el.scrollIntoView({ block: "nearest", inline: "nearest" }); el.classList.add("flash"); el.focus();
      setTimeout(() => el.classList.remove("flash"), 1600);
    } else showError(`Added "${r.card.title}" to Backlog. This view or a filter hides it: All shows it.`, true);
  } catch (e) { $("#addSaid").textContent = `Not added: ${e.message}`; }
});

// --- the board's own taps, and drags between columns (a mouse only; on a touch screen, the sheet's buttons)
document.addEventListener("click", (ev) => {
  if (ev.target.closest("dialog")) return;
  const b = ev.target.closest("button");
  if (b && chartClick(b)) return;
  if (b && b.dataset.goalOpen) { openGoalPage(b.dataset.goalOpen); return; }
  const tile = !b && ev.target.closest(".gtile");  // a tap anywhere on a goal's tile opens its page
  if (tile) { openGoalPage(tile.dataset.goal); return; }
  if (!b) return;
  if (b.dataset.act === "all-goals") { leaveGoalPage(); return; }
  if (b.dataset.gsheet) { const g = pageGoal(); if (g) openGoalSheet(g.id, b.dataset.gsheet, b); return; }
  // a goal's chip on a card: that goal's page (on its own page, the card, like the rest of it)
  const chip = b.classList.contains("card") && ev.target.closest(".gchip");
  if (chip && goalOf(chip.dataset.goal) && chip.dataset.goal !== S.goalPage) { openGoalPage(chip.dataset.goal); return; }
  if (b.dataset.view) {
    const was = P.view;
    P.view = b.dataset.view; savePrefs(); render();
    if (was === "goals" && P.view !== "goals" && getComputedStyle($("#colnav")).display !== "none") jump(P.col || "next", false);
    say(P.view === "goals" ? `Goals: ${goals().length}.` : `${VIEW[P.view].name}: ${filtered().length} cards.`);
  }
  else if (b.classList.contains("card")) { S.lastOpen = b.dataset.id; openCard(b.dataset.id, b); }
  else if (b.dataset.act === "older") { P.older = !P.older; savePrefs(); render(); }
  else if (b.dataset.act === "clear") { P.filters = EMPTY_F(); savePrefs(); render(); }
  else if (b.dataset.act === "ready-filter") {
    P.filters.ready = P.filters.ready.length ? [] : ["ready"]; savePrefs(); render();
    if (getComputedStyle($("#colnav")).display !== "none" && P.filters.ready.length) jump(firstCol(), false);  // where they are
    say(P.filters.ready.length ? `The cards marked ready: ${filtered().length}.` : `${filtered().length} cards.`);
  }
  else if (b.dataset.act === "jump") jump(b.dataset.col);
});
let dragId = null;
$("#board").addEventListener("dragstart", (ev) => {
  const el = ev.target.closest && ev.target.closest(".card");
  if (!el || !el.draggable) return;
  dragId = el.dataset.id; el.classList.add("dragging");
  ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", dragId);
});
$("#board").addEventListener("dragend", (ev) => {
  dragId = null;
  document.querySelectorAll(".dragging, .cell.over").forEach((el) => el.classList.remove("dragging", "over"));
});
$("#board").addEventListener("dragover", (ev) => {
  const cell = ev.target.closest(".cell");
  if (!cell || !dragId) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".cell.over").forEach((el) => el !== cell && el.classList.remove("over"));
  cell.classList.add("over");
});
$("#board").addEventListener("drop", (ev) => {
  const cell = ev.target.closest(".cell");
  if (!cell || !dragId) return;
  ev.preventDefault();
  const id = dragId, to = cell.dataset.status, c = byId(id);
  cell.classList.remove("over");
  if (!c || c.status === to) return;
  edit(() => api("PATCH", `/api/cards/${encodeURIComponent(id)}`, { status: to }), `"${c.title}" moved to ${COL_NAME[to]}.`);
});

// --- a card by its number ("card 42"): typed in "Card #" (its id works too), or a link to it (#42)
function openNumber(raw, from) {
  const t = String(raw || "").trim().replace(/^#\s*/, ""), num = /^\d+$/.test(t);
  if (!t) return false;
  const c = num ? byNumber(+t) : byId(t);
  if (!c) {
    showError(`There is no card ${num ? `#${+t}` : `"${t}"`} on the board.`, true);
    if (from && from.select) from.select();  // to type another over it
    return false;
  }
  $("#error").hidden = true;
  S.lastOpen = c.id;
  openCard(c.id, from);
  return true;
}
$("#find").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const inp = $("#findIn");
  if (openNumber(inp.value, inp)) inp.value = "";
});
function cardHash() { const m = /^#(\d+)$/.exec(location.hash); return m ? m[1] : null; }
function openHashCard() {  // its sheet over the board; the link's hash then dropped
  const n = cardHash();
  if (n === null || !S.data) return;
  history.replaceState(history.state, "", location.pathname + location.search);
  openNumber(n);
}
addEventListener("hashchange", openHashCard);

// --- kept fresh: every 30 s while in view (the live cards, edits from another device)
setInterval(() => { if (!document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
S.goalPage = goalHash();  // a link, or a reload, to a goal's page
load();
</script>
</body>
</html>
