<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chords</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121016">
<style>
/* The chord as heard, large; and checks: play the chord asked for, see what was heard. The exercise
   app's look: dark, purple for what to tap. */
@font-face { font-family: "Bricolage Grotesque"; src: url(/fonts/bricolage-grotesque.woff2) format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Public Sans"; src: url(/fonts/public-sans.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #121016; --surf2: #1E1A24; --surf: #28232F; --line: #3E3748; --line-soft: #2F2A37;
  --ink: #F2EEF8; --ink2: #CEC7DA; --ink3: #A79FB4; --faint: #7E768B;
  --purple-fill: #7C3AED; --purple: #8B5CF6; --purple-ink: #B9A0FF; --purple-tint: #33264F;
  --red-ink: #FF8F85; --red-tint: #3E1F24; --green: #4ADE80; --green-tint: #173326; --amber: #E8B93B;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 var(--text); -webkit-tap-highlight-color: transparent; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 24px; flex-wrap: wrap; }
.home { min-height: 44px; display: flex; align-items: center; gap: 6px; color: var(--ink3); text-decoration: none; }
.top h1 { margin: 0; font-family: var(--display); font-size: 28px; font-weight: 700; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 3px; border-radius: 13px; background: var(--surf2); }
.seg button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; font-size: 16px; }
.seg button[aria-pressed="true"] { background: var(--purple-fill); color: #fff; font-weight: 700; }
.grow { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chips .lbl { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
.chip { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid var(--line); background: transparent; font-size: 15px; font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--purple); background: var(--purple-tint); color: var(--purple-ink); }
select { min-height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surf2); padding: 0 10px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink3); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.dot.on { background: var(--green); }
.banner { margin: 0 24px 8px; padding: 12px 16px; border-radius: 14px; background: var(--red-tint); border: 1.5px solid var(--red-ink); }
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 12px 24px 28px; text-align: center; }
.big { font-family: var(--display); font-weight: 700; line-height: 0.95; letter-spacing: -0.03em; font-size: clamp(120px, 26vw, 260px); min-height: 1em; }
.big.none { color: var(--faint); }
.quality { font-size: 24px; color: var(--ink2); min-height: 1.4em; }
.conf { width: min(420px, 80vw); height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.conf i { display: block; height: 100%; width: 0; background: var(--purple); transition: width .12s linear; }
.alts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 36px; }
.alt { padding: 6px 12px; border-radius: 12px; background: var(--surf2); font-size: 15px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.alt b { color: var(--ink); margin-right: 6px; }
.meter { width: min(420px, 80vw); height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink2); }
.history { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 760px; min-height: 40px; }
.history span { padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); font-weight: 600; color: var(--ink2); }
.history span:last-child { border-color: var(--purple); color: var(--purple-ink); }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { min-height: 60px; padding: 0 24px; border-radius: 18px; border: 1.5px solid var(--ink2); background: transparent; font-size: 19px; font-weight: 700; }
.btn.go { border: 0; background: var(--purple-fill); color: #fff; font-family: var(--display); font-size: 24px; }
.btn.quiet { border-color: var(--line); color: var(--ink2); }
.toast { min-height: 1.4em; font-size: 16px; color: var(--ink3); }
.ask { font-size: 22px; color: var(--ink2); }
.verdict { font-family: var(--display); font-size: 34px; font-weight: 700; min-height: 1.3em; display: flex; align-items: center; gap: 12px; justify-content: center; }
.verdict.right { color: var(--green); }
.verdict.wrong { color: var(--red-ink); }
.tally { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; color: var(--ink2); font-size: 16px; }
.tally b { font-family: var(--display); font-size: 22px; color: var(--ink); }
.misses { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
.misses span { padding: 4px 10px; border-radius: 10px; background: var(--red-tint); color: var(--red-ink); font-size: 14px; }
.set { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
.sheet-box { background: var(--surf2); border: 1.5px solid var(--line); border-radius: 22px; padding: 18px; width: min(760px, 100%); max-height: 92dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-box h2 { margin: 0; font-family: var(--display); font-size: 26px; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.grid button { min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surf); font-weight: 700; font-size: 18px; }
@media (max-width: 700px) { .top { padding: 8px 16px; } main { padding: 8px 16px 20px; } .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="home" id="home" href="/">‹ Music room</a>
    <h1>Chords</h1>
    <div class="seg" role="group" aria-label="View"><button type="button" id="vListen" aria-pressed="true">Listen</button><button type="button" id="vCheck" aria-pressed="false">Check</button></div>
    <span class="grow"></span>
    <div class="chips" id="inputs"><span class="lbl">Hear</span></div>
    <label class="chips"><span class="lbl">Playing</span><select id="instrument">
      <option value="piano">Piano</option><option value="guitar">Guitar</option><option value="dobro">Dobro</option>
      <option value="bass">Bass</option><option value="banjo">Banjo</option><option value="other">Something else</option></select></label>
    <span class="status"><span class="dot" id="dot"></span><span id="stateText">connecting…</span></span>
  </header>
  <div class="banner" id="error" hidden></div>

  <main id="listen">
    <div class="big none" id="chord">–</div>
    <div class="quality" id="quality">Play a chord</div>
    <div class="conf" aria-label="How sure"><i id="conf"></i></div>
    <div class="alts" id="alts"></div>
    <div class="meter" aria-label="Level"><i id="level"></i></div>
    <div class="history" id="history" aria-label="Recently heard"></div>
    <div class="row">
      <button type="button" class="btn" id="right">Right</button>
      <button type="button" class="btn" id="wrong">Wrong: it was…</button>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <main id="check" hidden>
    <div class="ask" id="ask">Play</div>
    <div class="big" id="target">–</div>
    <div class="quality" id="targetQ"></div>
    <div class="verdict" id="verdict" aria-live="polite"></div>
    <div class="alts" id="checkAlts"></div>
    <div class="row">
      <button type="button" class="btn go" id="next">Next chord</button>
      <button type="button" class="btn" id="again">Same again</button>
      <button type="button" class="btn quiet" id="discard">I played it wrong</button>
    </div>
    <div class="set">
      <span class="chips"><span class="lbl">Chords</span>
        <button type="button" class="chip" data-q="maj" aria-pressed="true">Major</button>
        <button type="button" class="chip" data-q="min" aria-pressed="true">Minor</button>
        <button type="button" class="chip" data-q="7" aria-pressed="false">Seven</button></span>
      <span class="chips"><span class="lbl">Roots</span>
        <button type="button" class="chip" data-roots="all" aria-pressed="true">All 12</button>
        <button type="button" class="chip" data-roots="bg" aria-pressed="false">G C D A E F Bb</button></span>
    </div>
    <div class="tally" id="tally"></div>
    <div class="misses" id="misses"></div>
  </main>
</div>

<div class="sheet" id="picker" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <h2 id="pickTitle">What was it?</h2>
    <div class="grid" id="pickGrid"></div>
    <div class="row"><button type="button" class="btn quiet" id="noChord">No chord</button><button type="button" class="btn quiet" id="pickClose">Cancel</button></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
$("home").href = `http://${location.hostname}/`;
const NAMES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const QWORD = { "": "major", m: "minor", 7: "seven" };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function quality(name) { const m = /^[A-G][#b]?(m|7)?$/.exec(name || ""); return m ? QWORD[m[1] || ""] : ""; }
function rootOf(name) { return (/^[A-G][#b]?/.exec(name || "") || [""])[0]; }
function pretty(name) { return (name || "").replace("b", "♭").replace("#", "♯"); }
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { let m = `${r.status}`; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
let inputs = [], mix = store.get("mix", null), instrument = store.get("instrument", "piano"), view = store.get("view", "listen");
let st = null, session = [], checkTarget = null, lastId = null;
const qualities = new Set(store.get("qualities", ["maj", "min"])); let roots = store.get("roots", "all");

function setView(v) {
  view = v; store.set("view", v);
  $("vListen").setAttribute("aria-pressed", String(v === "listen")); $("vCheck").setAttribute("aria-pressed", String(v === "check"));
  $("listen").hidden = v !== "listen"; $("check").hidden = v !== "check";
  if (v === "check" && !checkTarget) nextCheck(); else if (v === "listen") api("POST", "/api/check/cancel").catch(() => {});
}
function renderInputs() {
  const box = $("inputs");
  box.querySelectorAll("button").forEach((b) => b.remove());
  for (const i of [...inputs].sort((a, b) => a.input - b.input)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = i.name; b.title = i.details;
    b.setAttribute("aria-pressed", String(mix.includes(i.input)));
    b.onclick = () => { const on = mix.includes(i.input); if (on && mix.length === 1) return;
      mix = on ? mix.filter((x) => x !== i.input) : [...mix, i.input]; store.set("mix", mix); renderInputs(); ask(); };
    box.appendChild(b);
  }
}
function ask() { if (!document.hidden && mix) api("POST", "/api/listen", { inputs: mix, instrument }).catch((e) => showError(e.message)); }
function showError(m) { $("error").textContent = m || ""; $("error").hidden = !m; }

function render(s) {
  st = s;
  const on = s.state === "listening";
  $("dot").classList.toggle("on", on);
  $("stateText").textContent = on ? "Listening" : s.state === "waiting" ? "Letting a recorder have the inputs" : "Not listening";
  showError(s.error && !on ? s.error : "");
  // Listen
  const c = s.chord;
  $("chord").textContent = c ? pretty(c) : "–"; $("chord").classList.toggle("none", !c);
  $("quality").textContent = c ? `${pretty(rootOf(c))} ${quality(c)}` : on ? "Play a chord" : "";
  $("conf").style.width = c ? `${Math.round(100 * s.confidence)}%` : "0";
  $("alts").innerHTML = (s.top || []).slice(c ? 1 : 0, 4).map(([n, v]) => `<span class="alt"><b>${pretty(n)}</b>${v.toFixed(2)}</span>`).join("");
  $("level").style.width = s.level_dbfs == null ? "0" : `${Math.max(0, Math.min(100, (s.level_dbfs + 70) / 70 * 100))}%`;
  $("history").innerHTML = (s.history || []).map((h) => `<span>${pretty(h.chord)}</span>`).join("");
  // Check
  const ck = s.check;
  if (view === "check" && ck) {
    $("ask").textContent = ck.state === "waiting" ? "Play" : ck.state === "hearing" ? "Hearing…" : "Asked for";
    const v = $("verdict");
    if (ck.state === "done") {
      v.className = "verdict " + (ck.right ? "right" : "wrong");
      v.textContent = ck.right ? `✓ Heard ${pretty(ck.heard)}` : `✗ Heard ${pretty(ck.heard)}, ${pretty(rootOf(ck.heard))} ${quality(ck.heard)}`;
      $("checkAlts").innerHTML = (ck.scores || []).slice(0, 4).map(([n, x]) => `<span class="alt"><b>${pretty(n)}</b>${x.toFixed(2)}</span>`).join("");
      if (ck.id && ck.id !== lastId) { lastId = ck.id; session.push({ id: ck.id, target: ck.target, heard: ck.heard, right: ck.right }); renderTally(); }
    } else { v.className = "verdict"; v.textContent = ck.state === "hearing" ? "…" : on ? "Listening for it" : ""; $("checkAlts").innerHTML = ""; }
  }
}
function renderTally() {
  const n = session.length, r = session.filter((x) => x.right).length;
  $("tally").innerHTML = n ? `<span>This session: <b>${r}</b> right of <b>${n}</b></span>` : "<span>Each check is kept with its clip, for making detection better.</span>";
  const misses = {};
  for (const x of session) if (!x.right) { const k = `${pretty(x.target)} heard as ${pretty(x.heard)}`; misses[k] = (misses[k] || 0) + 1; }
  $("misses").innerHTML = Object.entries(misses).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span>${k}${v > 1 ? ` ×${v}` : ""}</span>`).join("");
}
function chordsInSet() {
  const rs = roots === "bg" ? ["G", "C", "D", "A", "E", "F", "Bb"] : NAMES;
  const qs = [...qualities].map((q) => ({ maj: "", min: "m", 7: "7" }[q]));
  return rs.flatMap((r) => qs.map((q) => r + q));
}
function nextCheck(same) {
  const all = chordsInSet();
  if (!same) { let t; do { t = all[Math.floor(Math.random() * all.length)]; } while (all.length > 1 && t === checkTarget); checkTarget = t; }
  $("target").textContent = pretty(checkTarget);
  $("targetQ").textContent = `${pretty(rootOf(checkTarget))} ${quality(checkTarget)}`;
  $("verdict").textContent = ""; $("checkAlts").innerHTML = "";
  api("POST", "/api/check", { target: checkTarget }).catch((e) => showError(e.message));
}
async function poll() {
  try { render(await api("GET", "/api/status")); } catch (e) { $("stateText").textContent = "Not reachable"; $("dot").classList.remove("on"); }
  setTimeout(poll, document.hidden ? 1500 : 120);
}

$("vListen").onclick = () => setView("listen");
$("vCheck").onclick = () => setView("check");
$("instrument").value = instrument;
$("instrument").onchange = () => { instrument = $("instrument").value; store.set("instrument", instrument); ask(); };
$("next").onclick = () => nextCheck(false);
$("again").onclick = () => nextCheck(true);
$("discard").onclick = async () => {
  const ck = st && st.check;
  if (ck && ck.id) { try { await api("DELETE", `/api/checks/${ck.id}`); session = session.filter((x) => x.id !== ck.id); renderTally(); } catch (e) { showError(e.message); } }
  nextCheck(true);
};
for (const b of document.querySelectorAll("[data-q]")) {
  b.setAttribute("aria-pressed", String(qualities.has(b.dataset.q)));
  b.onclick = () => { if (qualities.has(b.dataset.q) && qualities.size === 1) return; qualities.has(b.dataset.q) ? qualities.delete(b.dataset.q) : qualities.add(b.dataset.q);
    b.setAttribute("aria-pressed", String(qualities.has(b.dataset.q))); store.set("qualities", [...qualities]); };
}
for (const b of document.querySelectorAll("[data-roots]")) {
  b.setAttribute("aria-pressed", String(b.dataset.roots === roots));
  b.onclick = () => { roots = b.dataset.roots; store.set("roots", roots); document.querySelectorAll("[data-roots]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.roots === roots))); };
}
// labels from the Listen view: the last two seconds, with what it was
async function label(chord) {
  try { await api("POST", "/api/label", { chord }); $("toast").textContent = chord ? `Kept: it was ${pretty(chord)}${st && st.chord ? `, heard ${pretty(st.chord)}` : ""}.` : "Kept: no chord."; }
  catch (e) { $("toast").textContent = `Not kept: ${e.message}.`; }
}
$("right").onclick = () => { if (st && st.chord) label(st.chord); };
$("wrong").onclick = () => { $("picker").hidden = false; };
$("pickClose").onclick = () => { $("picker").hidden = true; };
$("noChord").onclick = () => { $("picker").hidden = true; label(null); };
$("pickGrid").innerHTML = ["", "m", "7"].flatMap((q) => NAMES.map((n) => `<button type="button" data-c="${n + q}">${pretty(n + q)}</button>`)).join("");
$("pickGrid").onclick = (e) => { const b = e.target.closest("[data-c]"); if (b) { $("picker").hidden = true; label(b.dataset.c); } };
document.addEventListener("visibilitychange", () => { if (!document.hidden) ask(); });

(async () => {
  try { inputs = await api("GET", "/api/inputs"); } catch (e) { inputs = []; }
  const known = inputs.map((i) => i.input);
  if (!mix || !mix.every((x) => known.includes(x))) mix = inputs.filter((i) => !i.for).map((i) => i.input).concat().slice(0) || known;
  if (!mix.length) mix = known;
  renderInputs(); renderTally(); setView(view); ask(); setInterval(ask, 2000); poll();
})();
</script>
</body>
</html>
