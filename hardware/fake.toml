# A stand-in audio device for developing without hardware: capture makes
# room noise with an occasional note, and hears the playback again like the
# BMG-04F (loopback). Both run in real time.

name = "fake"
description = "Fake device for development"
backend = "fake"
loopback = true

[fake]
# The playback comes back in the capture this much quieter and this much later
# (the BMG-04F: -31 dBFS for a full-scale tone, T7).
loopback_db = -31.0
loopback_delay_ms = 9.0

[capture]
device = "fake"
format = "S16_LE"
rate = 48000
channels = 2
keep_channels = [0]
remove_dc = true

[playback]
device = "fake"
format = "S16_LE"
rate = 48000
channels = 2
